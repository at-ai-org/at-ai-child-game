<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字飞机 · Number Jet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b1026;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100vw; height: 100vh; }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 46px; left: 14px; z-index: 10;
    display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none;
  }
  .hud-chip {
    background: rgba(10, 16, 40, .72);
    border: 1px solid rgba(120, 200, 255, .35);
    border-radius: 14px;
    color: #dff2ff;
    padding: 7px 15px;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
  }
  .hud-chip b { color: #ffd35c; font-size: 21px; }

  /* ---------- 声音开关 ---------- */
  #btnMute {
    position: absolute; top: 12px; right: 12px; z-index: 60;
    font-size: 20px; line-height: 1;
    padding: 9px 13px; border-radius: 12px; cursor: pointer;
    background: rgba(10, 16, 40, .72);
    border: 1px solid rgba(120, 200, 255, .35);
    color: #dff2ff;
  }

  /* ---------- 挑战弹窗 ---------- */
  #challenge {
    position: absolute; z-index: 20;
    left: 50%; top: 28%;
    transform: translate(-50%, -50%) scale(.6);
    opacity: 0; pointer-events: none;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
    width: min(88vw, 400px);
    background: linear-gradient(160deg, #16224a 0%, #0d1330 100%);
    border: 2px solid #4f8cff;
    border-radius: 22px;
    padding: 18px 22px 16px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(79,140,255,.25) inset;
  }
  #challenge.show {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }
  #challenge h2 {
    color: #7fc4ff; font-size: 21px; letter-spacing: 2px; margin-bottom: 5px;
  }
  #challenge .sub { color: #9db4d8; font-size: 13.5px; margin-bottom: 12px; }
  #numberInput {
    width: 100%;
    padding: 10px;
    font-size: 30px;
    text-align: center;
    border: 2px dashed #5577cc;
    border-radius: 12px;
    background: rgba(255,255,255,.06);
    color: #fff;
    outline: none;
    font-family: inherit;
    caret-color: #ffd35c;
  }
  #numberInput:focus { border-color: #ffd35c; }
  #keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 11px;
  }
  .key {
    padding: 11px 0;
    font-size: 21px; font-weight: 700;
    border-radius: 11px;
    border: 1px solid rgba(120,160,255,.4);
    background: rgba(90,130,255,.18);
    color: #eaf4ff;
    cursor: pointer;
    font-family: inherit;
  }
  .key:active { transform: scale(.93); background: rgba(90,130,255,.42); }
  .key.enter { background: linear-gradient(90deg,#37d67a,#59ff9c); color: #06331a; border-color: transparent; }
  .key.back  { background: rgba(255,120,120,.16); border-color: rgba(255,120,120,.4); }
  #challenge .tip {
    margin-top: 10px;
    min-height: 20px;
    font-size: 14.5px;
    color: #9db4d8;
    font-weight: 600;
  }

  /* ---------- 反馈大字 ---------- */
  #toast {
    position: absolute; left: 50%; top: 22%;
    transform: translate(-50%, -50%) scale(1);
    z-index: 30;
    font-size: 62px; font-weight: 800;
    color: #ffd35c;
    text-shadow: 0 4px 18px rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
  }
  #toast.pop {
    opacity: 1;
    transform: translate(-50%, -58%) scale(1.12);
  }

  /* ---------- 结算 ---------- */
  #result {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(4, 8, 22, .82);
    display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #result.show { display: flex; }
  .result-card {
    text-align: center; color: #eaf4ff;
    background: linear-gradient(160deg, #16224a, #0d1330);
    border: 2px solid #4f8cff;
    border-radius: 26px;
    padding: 30px 44px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    max-width: 88vw;
  }
  .result-card h1 { font-size: 38px; color: #ffd35c; margin-bottom: 12px; }
  .result-card p { font-size: 17px; color: #b9cdf0; margin: 6px 0 22px; line-height: 1.8; }
  .result-card button {
    font-size: 20px; padding: 12px 42px; border-radius: 999px;
    border: none; cursor: pointer;
    background: linear-gradient(90deg, #4f8cff, #59d1ff);
    color: #fff; font-weight: 700; letter-spacing: 4px;
    box-shadow: 0 6px 20px rgba(79,140,255,.45);
    font-family: inherit;
  }
  .result-card button:active { transform: scale(.97); }

  /* ---------- 开始界面 ---------- */
  #start {
    position: absolute; inset: 0; z-index: 50;
    background: radial-gradient(1200px 600px at 50% 30%, #17275e 0%, #0b1026 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #eaf4ff; text-align: center;
    padding: 20px;
  }
  #start h1 {
    font-size: clamp(38px, 8vw, 60px); letter-spacing: 6px;
    background: linear-gradient(90deg, #ffd35c, #ff9c5c, #5cc8ff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 14px;
  }
  #start p { font-size: 16px; color: #9db4d8; line-height: 2; max-width: 560px; }
  #start .rules { margin: 22px 0 28px; }
  #start button {
    font-size: 21px; padding: 14px 56px; border-radius: 999px;
    border: none; cursor: pointer;
    background: linear-gradient(90deg, #ff9c5c, #ffd35c);
    color: #3a2200; font-weight: 800; letter-spacing: 6px;
    box-shadow: 0 8px 26px rgba(255,180,70,.45);
    font-family: inherit;
  }
  #start button:active { transform: scale(.97); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<button id="btnMute" title="声音开关">🔊</button>

<!-- HUD -->
<div class="hud">
  <div class="hud-chip">击毁 <b id="hudKill">0</b> / 15</div>
  <div class="hud-chip">连对 <b id="hudStreak">0</b> 🔥</div>
  <div class="hud-chip">战力 <b id="hudPower">100</b> %</div>
</div>

<!-- 数字挑战弹窗 -->
<div id="challenge">
  <h2>🎯 锁定敌机</h2>
  <div class="sub">看被瞄准敌机身上的大数字，输入它就能发射导弹！</div>
  <input id="numberInput" type="text" inputmode="numeric" autocomplete="off" maxlength="1" placeholder="?">
  <div id="keypad"></div>
  <div class="tip" id="challengeTip">输入 0 - 9 中的一个数字</div>
</div>

<!-- 结果反馈 -->
<div id="toast"></div>

<!-- 结算 -->
<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">🎉 任务完成！</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再战一次</button>
  </div>
</div>

<!-- 开始 -->
<div id="start">
  <h1>数字飞机</h1>
  <p class="rules">
    你的战机正在高空巡航！敌机会迎面飞来，锁定目标后输入它机身上的 <b>0-9</b> 数字：<br>
    ✅ 答对 → 发射导弹击毁敌机，你的战机会 <b>变大变强</b>　　❌ 答错 → 播报正确数字，再来一次<br>
    击毁 15 架敌机，完成任务！
  </p>
  <button id="btnStart">开始任务</button>
</div>

<script>
/* =========================================================
 * 数字飞机 Number Jet —— 单文件 Canvas 小游戏
 *
 * 玩法：战机在高空巡航，敌机（战机/轰炸机/直升机）迎面飞来，
 * 机身带着大数字。锁定目标后弹出挑战：输入它的数字（0-9）并回车；
 * 答对 → 发射导弹击毁敌机，主角战机变大一点；
 * 答错 → 语音播报正确数字，继续输入直到正确。
 * 击毁 15 架敌机完成任务，按连对数颁发奖牌。
 * ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- 常量 ---------------- */
const STATE = { START: 0, RUNNING: 1, CHALLENGE: 2, FIRING: 3, FINISH: 4 };
const KILL_TARGET   = 15;      // 任务：击毁 15 架
const LOCK_Y        = 0.60;     // 锁定敌机停留的高度比例
const QUEUE_SPACING = 0.24;     // 后续敌机在锁定机上方排队
const SPAWN_Y       = -0.18;    // 出生高度（画面外）
const PLAYER_Y      = 0.84;     // 玩家战机高度
const GROW_PER_KILL = 0.07;     // 每次击毁战力成长
const MAX_SCALE     = 2.2;      // 战力上限
const MISSILE_TIME  = 0.55;     // 导弹飞行秒数
const APPROACH_V    = 0.115;    // 敌机下降速度（H/秒）

/* ---------------- 状态 ---------------- */
let state = STATE.START;
let killCount = 0, streak = 0, bestStreak = 0, wrongTotal = 0;
let enemies = [], particles = [], rings = [], puffs = [], streaks = [];
let missile = null;
let lockedEnemy = null;
let answer = '';
let shake = 0;
let flashT = 0;
let lastNumber = null;
let spawnDelay = 0;
let finishTimer = -1;
let playerScaleTarget = 1, playerScaleShow = 1, growPop = 0;

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const challengeBox = $('challenge');
const numberInput   = $('numberInput');
const challengeTip  = $('challengeTip');
const toastEl       = $('toast');

/* ---------------- 语音播报 ---------------- */
const synth = window.speechSynthesis || null;
let zhVoice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) ||
            vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (muted || !synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.92;
    synth.speak(u);
  } catch (e) { /* 忽略 */ }
}

/* ---------------- 音效 ---------------- */
let actx = null, muted = false;
let engineOsc = null, engineGain = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  // 引擎低鸣
  engineOsc = actx.createOscillator();
  engineGain = actx.createGain();
  engineOsc.type = 'triangle';
  engineOsc.frequency.value = 96;
  engineGain.gain.value = muted ? 0 : 0.035;
  engineOsc.connect(engineGain).connect(actx.destination);
  engineOsc.start();
}
function beep(freq, dur, type, vol, sweepTo) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* 忽略 */ }
}
const sfxRight  = () => { beep(660, .09, 'sine', .16); beep(880, .14, 'sine', .16); };
const sfxWrong  = () => beep(210, .20, 'square', .08);
const sfxMissile= () => beep(320, .30, 'sawtooth', .12, 980);
const sfxBoom   = () => { beep(150, .45, 'sawtooth', .3, 38); beep(90, .5, 'triangle', .22, 30); };
function updateEngine() {
  if (!engineOsc) return;
  const target = muted ? 0 : (state === STATE.FIRING ? 0.06 : 0.035);
  engineGain.gain.value += (target - engineGain.gain.value) * 0.1;
}
$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (muted && synth) synth.cancel();
});

/* ---------------- 触屏检测 + 数字键盘 ---------------- */
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const KEYS = [];
for (let i = 1; i <= 9; i++) KEYS.push(String(i));
KEYS.push('⌫', '0', '⏎');
KEYS.forEach(k => {
  const btn = document.createElement('button');
  btn.className = 'key' + (k === '⏎' ? ' enter' : k === '⌫' ? ' back' : '');
  btn.textContent = k;
  btn.addEventListener('click', () => {
    if (k === '⏎') submitAnswer();
    else if (k === '⌫') numberInput.value = '';
    else {
      numberInput.value = k;
      submitAnswer();                     // 输入数字即自动提交，无需回车
    }
    if (!isTouch) { numberInput.focus(); numberInput.select(); }
  });
  $('keypad').appendChild(btn);
});

numberInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitAnswer();
  } else if (e.key === 'Escape') {
    e.preventDefault();
  }
});
/* 输入满一位数字 → 自动提交（回车作为备用） */
numberInput.addEventListener('input', () => {
  numberInput.value = numberInput.value.replace(/[^0-9]/g, '').slice(-1);
  if (numberInput.value !== '') {
    submitAnswer();
  }
});
/* 焦点丢失时的键盘兜底：直接按键也能自动提交 */
window.addEventListener('keydown', e => {
  if (state !== STATE.CHALLENGE) return;
  if (e.target === numberInput) return;
  if (/^[0-9]$/.test(e.key)) {
    numberInput.value = e.key;
    submitAnswer();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    submitAnswer();
  }
});

/* ---------------- 工具 ---------------- */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(Math.min(255, Math.max(0, r + r * amt)));
  g = Math.round(Math.min(255, Math.max(0, g + g * amt)));
  b = Math.round(Math.min(255, Math.max(0, b + b * amt)));
  return `rgb(${r},${g},${b})`;
}
const seedRand = i => {
  const x = Math.sin(i * 12.9898) * 43758.5453;
  return x - Math.floor(x);
};

/* 星空（固定分数坐标） */
const stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({ fx: Math.random(), fy: Math.random() * 0.75, r: 0.6 + Math.random() * 1.3, p: Math.random() * 6.28 });
}
/* 云层（两层视差，柔和低对比） */
const clouds = [];
for (let i = 0; i < 7; i++) {
  clouds.push({
    fx: Math.random(), fy: Math.random(),
    w: 0.16 + seedRand(i) * 0.22,
    spd: 0.022 + seedRand(i + 9) * 0.020,
    a: 0.07 + seedRand(i + 20) * 0.06,
  });
}

/* ---------------- 敌机 ---------------- */
const ENEMY_TYPES = [
  { type: 'fighter', body: '#ff6b6b', accent: '#fff1c9' },  // 战斗机
  { type: 'bomber',  body: '#51cf66', accent: '#eef7ff' },  // 轰炸机
  { type: 'heli',    body: '#9d7bff', accent: '#e8ffe8' },  // 直升机
];
function spawnEnemy() {
  const t = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
  let n;
  do { n = String(Math.floor(Math.random() * 10)); } while (n === lastNumber);
  lastNumber = n;
  enemies.push({
    type: t.type, body: t.body, accent: t.accent,
    num: n,
    x: 0.5 + (Math.random() - 0.5) * 0.44,     // 横向出现位置
    y: SPAWN_Y,
    bob: Math.random() * 6.28,
  });
}

/* ---------------- 粒子 / 冲击环 / 尾烟 ---------------- */
function burst(x, y, color, n) {
  for (let i = 0; i < (n || 26); i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
      life: 1, color,
      size: 3 + Math.random() * 4,
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.10;
    p.life -= dt * 1.15;
  }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) r.t += dt * 2.2;
  rings = rings.filter(r => r.t < 1);
  for (const s of streaks) { s.y += s.v * dt; s.life -= dt * 1.4; }
  streaks = streaks.filter(s => s.life > 0);
  for (const p of puffs) { p.life -= dt * 1.8; p.y += 30 * dt; }
  puffs = puffs.filter(p => p.life > 0);
}

/* ---------------- HUD / Toast ---------------- */
function updateHUD() {
  $('hudKill').textContent = killCount;
  $('hudStreak').textContent = streak;
  $('hudPower').textContent = Math.round(playerScaleTarget * 100);
}
let toastTimer = null;
function toast(text, good) {
  toastEl.textContent = text;
  toastEl.style.color = good ? '#7dffa1' : '#ff9d9d';
  toastEl.classList.add('pop');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('pop'), 900);
}

/* ---------------- 挑战流程 ---------------- */
const PRAISES = ['击中了！', '太棒了', '好厉害', '打中了', '真不错'];

function openChallenge() {
  answer = lockedEnemy.num;
  challengeBox.classList.add('show');
  challengeTip.textContent = '输入被瞄准敌机身上的数字';
  challengeTip.style.color = '';
  numberInput.value = '';
  if (!isTouch) {
    setTimeout(() => { numberInput.focus(); numberInput.select(); }, 60);
  }
}
function closeChallenge() {
  challengeBox.classList.remove('show');
  if (!isTouch) numberInput.blur();
}

function submitAnswer() {
  if (state !== STATE.CHALLENGE || !lockedEnemy) return;
  const v = numberInput.value.trim();
  if (!/^[0-9]$/.test(v)) {
    challengeTip.textContent = '要先输入 0 - 9 中的一个数字哦！';
    challengeTip.style.color = '#ffcf6b';
    sfxWrong();
    return;
  }
  if (v === answer) {
    sfxRight();
    closeChallenge();
    numberInput.value = '';
    state = STATE.FIRING;
    missile = { t: 0, trail: [] };
    sfxMissile();
  } else {
    wrongTotal++;
    streak = 0;
    updateHUD();
    challengeTip.textContent = `正确的数字是 ${answer}，再输入一次！`;
    challengeTip.style.color = '#ff9d9d';
    speak(`答错了，正确的数字是 ${answer}，请再输入一次`);
    sfxWrong();
    shake = 0.35;
    numberInput.value = '';
    if (!isTouch) { numberInput.focus(); numberInput.select(); }
  }
}

/* ---------------- 击毁结算 ---------------- */
function explodeEnemy() {
  const pos = enemyDrawPos(lockedEnemy, perfT());
  burst(pos.x, pos.y, '#ffd35c', 34);
  burst(pos.x, pos.y, '#ff8a5c', 22);
  rings.push({ x: pos.x, y: pos.y, t: 0, color: '255,220,120' });
  rings.push({ x: pos.x, y: pos.y, t: -0.18, color: '255,255,255' });
  flashT = 0.22;
  shake = 0.4;
  sfxBoom();

  // 成长
  const idx = enemies.indexOf(lockedEnemy);
  if (idx >= 0) enemies.splice(idx, 1);
  lockedEnemy = null;
  missile = null;
  killCount++;
  streak++;
  if (streak > bestStreak) bestStreak = streak;
  playerScaleTarget = Math.min(MAX_SCALE, playerScaleTarget + GROW_PER_KILL);
  growPop = 1;

  const praise = PRAISES[Math.min(PRAISES.length - 1, Math.floor(Math.random() * PRAISES.length))];
  toast(praise + ' 战机变大啦！', true);
  speak(killCount >= KILL_TARGET ? '全部击毁，任务完成！' : praise);
  updateHUD();

  // 玩家成长金环
  const pp = playerDrawPos(perfT());
  rings.push({ x: pp.x, y: pp.y, t: -0.3, color: '255,215,100' });

  if (killCount >= KILL_TARGET) {
    finishTimer = 1.1;                      // 看完爆炸再结算
    state = STATE.RUNNING;
  } else {
    state = STATE.RUNNING;
  }
}
function perfT() { return (window.performance ? performance.now() : 0) / 1000; }

function showResult() {
  let title, medal;
  if (bestStreak >= 10)      { title = '🥇 金牌飞行员！'; medal = '金牌'; }
  else if (bestStreak >= 6)  { title = '🥈 银牌飞行员！'; medal = '银牌'; }
  else if (bestStreak >= 3)  { title = '🥉 铜牌飞行员！'; medal = '铜牌'; }
  else                       { title = '🎯 任务完成！';   medal = '继续加油'; }
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML =
    `击毁 <b style="color:#ffd35c">${killCount}</b> 架敌机（${medal}）<br>` +
    `最佳连对 <b style="color:#ffd35c">${bestStreak}</b> 次 · 答错 <b style="color:#ff9d9d">${wrongTotal}</b> 次<br>` +
    `你的战机战力达到了 <b style="color:#7dffa1">${Math.round(playerScaleTarget * 100)}%</b>！`;
  $('result').classList.add('show');
  speak(`任务完成！获得${medal}！`);
}

/* ---------------- 主循环 ---------------- */
function update(dt, t) {
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (flashT > 0) flashT = Math.max(0, flashT - dt);
  if (growPop > 0) growPop = Math.max(0, growPop - dt * 2.2);
  playerScaleShow += (playerScaleTarget - playerScaleShow) * Math.min(1, dt * 6);

  // 云层漂移（挑战时放慢，营造专注氛围）
  const cloudK = state === STATE.CHALLENGE ? 0.25 : 1;
  for (const c of clouds) {
    c.fy += c.spd * cloudK * dt;
    if (c.fy > 1.15) { c.fy = -0.18; c.fx = Math.random(); }
  }

  // 敌机推进（按队伍位置各就各位）
  if (state === STATE.RUNNING) {
    const sorted = [...enemies].sort((a, b) => b.y - a.y);
    sorted.forEach((e, i) => {
      const targetY = LOCK_Y - i * QUEUE_SPACING;
      if (e.y < targetY) {
        e.y = Math.min(targetY, e.y + APPROACH_V * dt);
      }
    });
    // 补充敌机（保持画面上最多 2 架：1 架锁定 + 1 架排队）
    spawnDelay -= dt;
    if (enemies.length < 2 && killCount + enemies.length < KILL_TARGET && spawnDelay <= 0) {
      spawnEnemy();
      spawnDelay = 0.8;
    }
    // 前排敌机到位 → 锁定挑战
    const front = sorted[0];
    if (front && front.y >= LOCK_Y - 0.001 && killCount < KILL_TARGET && finishTimer < 0) {
      lockedEnemy = front;
      state = STATE.CHALLENGE;
      openChallenge();
    }
    // 任务收尾
    if (finishTimer > 0) {
      finishTimer -= dt;
      if (finishTimer <= 0) {
        finishTimer = -1;
        state = STATE.FINISH;
        closeChallenge();
        showResult();
      }
    }
  }

  // 导弹飞行
  if (state === STATE.FIRING && missile && lockedEnemy) {
    missile.t += dt / MISSILE_TIME;
    const pos = missilePos(missile.t);
    missile.trail.push({ x: pos.x, y: pos.y });
    if (missile.trail.length > 14) missile.trail.shift();
    if (Math.random() < 0.7) puffs.push({ x: pos.x, y: pos.y, life: 1, r: 3 + Math.random() * 3 });
    if (missile.t >= 1) explodeEnemy();
  }

  // 冲刺速度线
  if (state === STATE.FIRING && Math.random() < 0.5) {
    streaks.push({
      x: Math.random() * W, y: H * 0.30 - Math.random() * 100,
      v: 900 + Math.random() * 500, life: 1,
    });
  }

  updateParticles(dt);
  updateEngine();
  updateHUD();
}

/* ---------------- 位置计算 ---------------- */
function enemyDrawPos(e, t) {
  const sizeFrac = Math.min(1, Math.max(0.35, e.y / LOCK_Y));
  const s = Math.min(W, H) * 0.20 * (0.55 + 0.45 * sizeFrac);
  return {
    x: W * e.x + Math.sin(t * 1.6 + e.bob) * s * 0.06,
    y: H * e.y + Math.sin(t * 2.2 + e.bob) * s * 0.05,
    s,
  };
}
function playerDrawPos(t) {
  const s = playerScaleShow * Math.min(W, H) * 0.20;
  return {
    x: W / 2 + Math.sin(t * 0.7) * W * 0.018,
    y: H * PLAYER_Y + Math.sin(t * 1.3) * H * 0.004,
    s,
  };
}
/* 导弹位置：从玩家到锁定敌机的抛物弧线 */
function missilePos(t) {
  const pp = playerDrawPos(perfT());
  const ep = enemyDrawPos(lockedEnemy, perfT());
  const x0 = pp.x, y0 = pp.y - pp.s * 0.55;
  const x2 = ep.x, y2 = ep.y;
  const side = x2 > x0 ? 1 : -1;
  const x1 = (x0 + x2) / 2 + side * W * 0.20;
  const y1 = Math.min(y0, y2) - H * 0.14;
  const u = 1 - t, tt = t * t;
  return {
    x: u * u * x0 + 2 * u * t * x1 + tt * x2,
    y: u * u * y0 + 2 * u * t * y1 + tt * y2,
    ang: Math.atan2(
      2 * u * (y1 - y0) + 2 * t * (y2 - y1),
      2 * u * (x1 - x0) + 2 * t * (x2 - x1)
    ),
  };
}

/* ---------------- 绘制 ---------------- */
function drawBackground(t) {
  // 高空夜色
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#070d26');
  sky.addColorStop(0.6, '#0d1637');
  sky.addColorStop(1, '#182964');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 星星
  for (const s of stars) {
    const a = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(t * 2 + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dceaff';
    ctx.beginPath();
    ctx.arc(s.fx * W, s.fy * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 云层（柔和椭圆，低对比）
  for (const c of clouds) {
    const cx = c.fx * W, cy = c.fy * H;
    const rx = c.w * W, ry = rx * 0.36;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, `rgba(190,210,255,${c.a})`);
    g.addColorStop(1, 'rgba(190,210,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---- 号码牌 ---- */
function drawNumPlate(s, accent, num) {
  const r = s * 0.19;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, s * 0.028);
  ctx.strokeStyle = accent;
  ctx.stroke();
  ctx.fillStyle = '#1b2547';
  ctx.font = `800 ${s * 0.28}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(num, 0, s * 0.012);
}

/* ---- 敌机（机头朝下，冲着玩家） ---- */
function drawEnemyPlane(e, t) {
  const pos = enemyDrawPos(e, t);
  const s = pos.s;
  ctx.save();
  ctx.translate(pos.x, pos.y);
  const dim = (state === STATE.CHALLENGE && e !== lockedEnemy) ? 0.55 : 1;
  ctx.globalAlpha = dim;

  if (e.type === 'fighter') drawFighterShape(s, e.body, e.accent, t);
  else if (e.type === 'bomber') drawBomberShape(s, e.body, e.accent, t);
  else drawHeliShape(s, e.body, e.accent, t);

  // 号码牌居中
  drawNumPlate(s, e.accent, e.num);
  ctx.restore();
}
function drawFighterShape(s, body, accent, t) {
  // 尾焰（机尾朝上，喷向上方）
  const fl = s * (0.18 + Math.random() * 0.10);
  const fg = ctx.createLinearGradient(0, -s * 0.52, 0, -s * 0.52 - fl);
  fg.addColorStop(0, 'rgba(120,190,255,.9)');
  fg.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-s * 0.05, -s * 0.50);
  ctx.lineTo(0, -s * 0.50 - fl);
  ctx.lineTo(s * 0.05, -s * 0.50);
  ctx.closePath(); ctx.fill();

  // 三角翼（后掠朝上）
  ctx.fillStyle = shade(body, -0.18);
  ctx.beginPath();
  ctx.moveTo(-s * 0.06, -s * 0.05);
  ctx.lineTo(-s * 0.40, -s * 0.42);
  ctx.lineTo(-s * 0.40, -s * 0.28);
  ctx.lineTo(-s * 0.06, s * 0.12);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.06, -s * 0.05);
  ctx.lineTo(s * 0.40, -s * 0.42);
  ctx.lineTo(s * 0.40, -s * 0.28);
  ctx.lineTo(s * 0.06, s * 0.12);
  ctx.closePath(); ctx.fill();

  // 机身
  const g = ctx.createLinearGradient(-s * 0.08, 0, s * 0.08, 0);
  g.addColorStop(0, shade(body, -0.25));
  g.addColorStop(0.5, body);
  g.addColorStop(1, shade(body, -0.25));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.52);                     // 机头（朝下）
  ctx.quadraticCurveTo(s * 0.09, 0, s * 0.07, -s * 0.42);
  ctx.lineTo(-s * 0.07, -s * 0.42);
  ctx.quadraticCurveTo(-s * 0.09, 0, 0, s * 0.52);
  ctx.closePath(); ctx.fill();

  // 座舱（机头处）
  ctx.fillStyle = 'rgba(30,40,70,.9)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.24, s * 0.05, s * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();

  // 翼尖灯
  ctx.fillStyle = '#ff5c5c';
  ctx.fillRect(-s * 0.41, -s * 0.34, s * 0.035, s * 0.05);
  ctx.fillStyle = '#59ff9c';
  ctx.fillRect(s * 0.375, -s * 0.34, s * 0.035, s * 0.05);
}
function drawBomberShape(s, body, accent, t) {
  // 平直宽翼
  ctx.fillStyle = shade(body, -0.18);
  ctx.beginPath();
  ctx.moveTo(-s * 0.07, -s * 0.06);
  ctx.lineTo(-s * 0.46, -s * 0.14);
  ctx.lineTo(-s * 0.46, s * 0.02);
  ctx.lineTo(-s * 0.07, s * 0.12);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.07, -s * 0.06);
  ctx.lineTo(s * 0.46, -s * 0.14);
  ctx.lineTo(s * 0.46, s * 0.02);
  ctx.lineTo(s * 0.07, s * 0.12);
  ctx.closePath(); ctx.fill();

  // 双发动机舱
  ctx.fillStyle = shade(body, -0.4);
  for (const ex of [-s * 0.30, s * 0.30]) {
    ctx.beginPath();
    ctx.ellipse(ex, s * 0.10, s * 0.055, s * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    // 螺旋桨模糊弧
    ctx.strokeStyle = 'rgba(230,240,255,.35)';
    ctx.lineWidth = Math.max(1, s * 0.018);
    ctx.beginPath();
    ctx.ellipse(ex, s * 0.24, s * 0.10, s * 0.028, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 宽机身
  const g = ctx.createLinearGradient(-s * 0.11, 0, s * 0.11, 0);
  g.addColorStop(0, shade(body, -0.25));
  g.addColorStop(0.5, body);
  g.addColorStop(1, shade(body, -0.25));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.50);
  ctx.quadraticCurveTo(s * 0.13, s * 0.05, s * 0.11, -s * 0.40);
  ctx.lineTo(-s * 0.11, -s * 0.40);
  ctx.quadraticCurveTo(-s * 0.13, s * 0.05, 0, s * 0.50);
  ctx.closePath(); ctx.fill();

  // 双垂尾
  ctx.fillStyle = shade(body, -0.45);
  ctx.fillRect(-s * 0.16, -s * 0.52, s * 0.06, s * 0.14);
  ctx.fillRect(s * 0.10, -s * 0.52, s * 0.06, s * 0.14);

  // 座舱
  ctx.fillStyle = 'rgba(30,40,70,.9)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.26, s * 0.055, s * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
}
function drawHeliShape(s, body, accent, t) {
  // 尾梁（朝上）
  ctx.fillStyle = shade(body, -0.3);
  ctx.fillRect(-s * 0.035, -s * 0.52, s * 0.07, s * 0.36);
  // 尾桨
  ctx.strokeStyle = 'rgba(230,240,255,.5)';
  ctx.lineWidth = Math.max(1, s * 0.02);
  const ta = t * 18;
  ctx.beginPath();
  ctx.moveTo(-s * 0.10 + Math.cos(ta) * s * 0.02, -s * 0.50 + Math.sin(ta) * s * 0.02);
  ctx.lineTo( s * 0.10 - Math.cos(ta) * s * 0.02, -s * 0.50 - Math.sin(ta) * s * 0.02);
  ctx.stroke();

  // 座舱（圆胖）
  const g = ctx.createLinearGradient(-s * 0.17, 0, s * 0.17, 0);
  g.addColorStop(0, shade(body, -0.25));
  g.addColorStop(0.5, body);
  g.addColorStop(1, shade(body, -0.25));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.06, s * 0.185, s * 0.235, 0, 0, Math.PI * 2);
  ctx.fill();
  // 挡风玻璃
  ctx.fillStyle = 'rgba(30,40,70,.9)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.17, s * 0.11, s * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  // 滑橇
  ctx.strokeStyle = shade(body, -0.5);
  ctx.lineWidth = Math.max(1.5, s * 0.03);
  ctx.beginPath();
  ctx.moveTo(-s * 0.13, s * 0.30); ctx.lineTo(-s * 0.13, s * 0.34);
  ctx.moveTo(s * 0.13, s * 0.30); ctx.lineTo(s * 0.13, s * 0.34);
  ctx.moveTo(-s * 0.16, s * 0.34); ctx.lineTo(s * 0.16, s * 0.34);
  ctx.stroke();

  // 主旋翼（旋转叶片 + 模糊盘）
  ctx.globalAlpha *= 1;
  ctx.save();
  ctx.translate(0, -s * 0.10);
  ctx.fillStyle = 'rgba(220,235,255,.08)';
  ctx.beginPath();
  ctx.ellipse(0, 0, s * 0.46, s * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
  const ra = t * 22;
  ctx.strokeStyle = 'rgba(220,235,255,.65)';
  ctx.lineWidth = Math.max(1.5, s * 0.028);
  for (let k = 0; k < 3; k++) {
    const a = ra + k * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * s * 0.46, Math.sin(a) * s * 0.14);
    ctx.stroke();
  }
  ctx.fillStyle = shade(body, -0.5);
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.045, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ---- 锁定框 ---- */
function drawReticle(e, t) {
  const pos = enemyDrawPos(e, t);
  const s = pos.s;
  const R = s * 0.62 * (1 + 0.06 * Math.sin(t * 9));
  ctx.save();
  ctx.translate(pos.x, pos.y);
  // 旋转虚线圆
  ctx.strokeStyle = 'rgba(255,122,0,.85)';
  ctx.lineWidth = Math.max(1.5, s * 0.03);
  ctx.setLineDash([Math.max(4, s * 0.09), Math.max(4, s * 0.09)]);
  ctx.lineDashOffset = -t * s * 0.8;
  ctx.beginPath();
  ctx.arc(0, 0, R * 1.18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  // 四角括号
  const L = R * 0.42;
  ctx.strokeStyle = '#ff7a00';
  ctx.lineWidth = Math.max(2, s * 0.045);
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    ctx.beginPath();
    ctx.moveTo(sx * R, sy * R - sy * L);
    ctx.lineTo(sx * R, sy * R);
    ctx.lineTo(sx * R - sx * L, sy * R);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- 玩家战机（机头朝上） ---- */
function drawPlayer(t) {
  const pos = playerDrawPos(t);
  const pop = growPop > 0 ? Math.sin(growPop * Math.PI) * 0.14 : 0;   // 变大弹跳
  const ss = pos.s * (1 + pop);
  ctx.save();
  ctx.translate(pos.x, pos.y);

  // 引擎尾焰（朝下）
  const boost = state === STATE.FIRING ? 1.5 : 1;
  const fl = ss * (0.26 + Math.random() * 0.14) * boost;
  const fg = ctx.createLinearGradient(0, ss * 0.50, 0, ss * 0.50 + fl);
  fg.addColorStop(0, 'rgba(120,190,255,.95)');
  fg.addColorStop(0.5, 'rgba(255,170,80,.6)');
  fg.addColorStop(1, 'rgba(255,60,40,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-ss * 0.06, ss * 0.48);
  ctx.lineTo(0, ss * 0.50 + fl);
  ctx.lineTo(ss * 0.06, ss * 0.48);
  ctx.closePath(); ctx.fill();

  // 主翼（后掠）
  ctx.fillStyle = '#3a6fe8';
  ctx.beginPath();
  ctx.moveTo(-ss * 0.06, -ss * 0.04);
  ctx.lineTo(-ss * 0.46, ss * 0.26);
  ctx.lineTo(-ss * 0.46, ss * 0.37);
  ctx.lineTo(-ss * 0.06, ss * 0.22);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(ss * 0.06, -ss * 0.04);
  ctx.lineTo(ss * 0.46, ss * 0.26);
  ctx.lineTo(ss * 0.46, ss * 0.37);
  ctx.lineTo(ss * 0.06, ss * 0.22);
  ctx.closePath(); ctx.fill();
  // 翼尖黄条
  ctx.fillStyle = '#ffd35c';
  ctx.fillRect(-ss * 0.46, ss * 0.26, ss * 0.07, ss * 0.11);
  ctx.fillRect(ss * 0.39, ss * 0.26, ss * 0.07, ss * 0.11);

  // 尾翼
  ctx.fillStyle = '#2f5fd0';
  ctx.beginPath();
  ctx.moveTo(-ss * 0.05, ss * 0.26);
  ctx.lineTo(-ss * 0.21, ss * 0.47);
  ctx.lineTo(-ss * 0.05, ss * 0.42);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(ss * 0.05, ss * 0.26);
  ctx.lineTo(ss * 0.21, ss * 0.47);
  ctx.lineTo(ss * 0.05, ss * 0.42);
  ctx.closePath(); ctx.fill();

  // 机身
  const g = ctx.createLinearGradient(-ss * 0.09, 0, ss * 0.09, 0);
  g.addColorStop(0, '#2f5fd0');
  g.addColorStop(0.5, '#4f8cff');
  g.addColorStop(1, '#2f5fd0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -ss * 0.52);
  ctx.quadraticCurveTo(ss * 0.10, -ss * 0.05, ss * 0.08, ss * 0.46);
  ctx.lineTo(-ss * 0.08, ss * 0.46);
  ctx.quadraticCurveTo(-ss * 0.10, -ss * 0.05, 0, -ss * 0.52);
  ctx.closePath(); ctx.fill();

  // 雷达罩
  ctx.fillStyle = '#ffd35c';
  ctx.beginPath();
  ctx.moveTo(0, -ss * 0.52);
  ctx.quadraticCurveTo(ss * 0.045, -ss * 0.46, ss * 0.04, -ss * 0.40);
  ctx.lineTo(-ss * 0.04, -ss * 0.40);
  ctx.quadraticCurveTo(-ss * 0.045, -ss * 0.46, 0, -ss * 0.52);
  ctx.closePath(); ctx.fill();

  // 座舱
  ctx.fillStyle = 'rgba(180,225,255,.92)';
  ctx.beginPath();
  ctx.ellipse(0, -ss * 0.16, ss * 0.055, ss * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();
  const cg = ctx.createLinearGradient(0, -ss * 0.30, 0, -ss * 0.02);
  cg.addColorStop(0, 'rgba(255,255,255,.55)');
  cg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(0, -ss * 0.16, ss * 0.055, ss * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  // 航行灯：左红右绿
  ctx.fillStyle = '#ff5c5c';
  ctx.beginPath(); ctx.arc(-ss * 0.445, ss * 0.315, ss * 0.028, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#59ff9c';
  ctx.beginPath(); ctx.arc(ss * 0.445, ss * 0.315, ss * 0.028, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

/* ---- 导弹 ---- */
function drawMissile() {
  if (!missile || !lockedEnemy) return;
  // 尾烟
  for (const p of puffs) {
    ctx.globalAlpha = p.life * 0.4;
    ctx.fillStyle = '#cdd8f0';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (1.6 - p.life * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 弹道轨迹
  if (missile.trail.length > 1) {
    ctx.strokeStyle = 'rgba(255,200,120,.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(missile.trail[0].x, missile.trail[0].y);
    for (const q of missile.trail) ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
  // 弹体
  const pos = missilePos(Math.min(1, missile.t));
  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.rotate(pos.ang);
  const L = Math.min(W, H) * 0.045;
  // 尾焰
  const fg = ctx.createLinearGradient(-L * 0.6, 0, -L * 1.6, 0);
  fg.addColorStop(0, 'rgba(255,190,80,.95)');
  fg.addColorStop(1, 'rgba(255,60,40,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-L * 0.55, -L * 0.16);
  ctx.lineTo(-L * 1.6, 0);
  ctx.lineTo(-L * 0.55, L * 0.16);
  ctx.closePath(); ctx.fill();
  // 弹身
  ctx.fillStyle = '#e8eeff';
  ctx.beginPath();
  ctx.moveTo(L * 0.8, 0);
  ctx.quadraticCurveTo(L * 0.1, -L * 0.22, -L * 0.55, -L * 0.18);
  ctx.lineTo(-L * 0.55, L * 0.18);
  ctx.quadraticCurveTo(L * 0.1, L * 0.22, L * 0.8, 0);
  ctx.closePath(); ctx.fill();
  // 弹翼
  ctx.fillStyle = '#ff9c5c';
  ctx.moveTo(-L * 0.1, -L * 0.18); ctx.lineTo(-L * 0.45, -L * 0.5); ctx.lineTo(-L * 0.45, -L * 0.18);
  ctx.closePath(); ctx.fill();
  ctx.moveTo(-L * 0.1, L * 0.18); ctx.lineTo(-L * 0.45, L * 0.5); ctx.lineTo(-L * 0.45, L * 0.18);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---- 冲击环 / 粒子 / 速度线 ---- */
function drawEffects() {
  for (const r of rings) {
    if (r.t < 0) continue;
    const k = r.t;
    ctx.strokeStyle = `rgba(${r.color},${(1 - k) * 0.8})`;
    ctx.lineWidth = Math.max(2, 10 * (1 - k));
    ctx.beginPath();
    ctx.arc(r.x, r.y, 14 + k * 70, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  for (const s of streaks) {
    ctx.globalAlpha = s.life * 0.16;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x, s.y - 46);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 爆炸白闪
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255,240,200,${flashT * 0.9})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- 渲染 ---------------- */
function render(t) {
  ctx.save();
  if (shake > 0) {
    const m = shake * 14;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawBackground(t);

  // 敌机（按 y 降序 = 近的先画在最后覆盖）
  const sorted = [...enemies].sort((a, b) => a.y - b.y);
  for (const e of sorted) drawEnemyPlane(e, t);

  // 锁定框
  if ((state === STATE.CHALLENGE || state === STATE.FIRING) && lockedEnemy) {
    drawReticle(lockedEnemy, t);
  }

  drawPlayer(t);
  drawMissile();
  drawEffects();

  ctx.restore();
}

/* ---------------- 帧循环 ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 开始 / 重开 ---------------- */
$('btnStart').addEventListener('click', () => {
  initAudio();
  $('start').style.display = 'none';
  state = STATE.RUNNING;
  spawnDelay = 0.2;
  speak('任务开始！');
});

$('btnRestart').addEventListener('click', () => {
  $('result').classList.remove('show');
  resetGame();
  state = STATE.RUNNING;
  spawnDelay = 0.2;
  speak('新的任务开始！');
});

function resetGame() {
  killCount = 0; streak = 0; bestStreak = 0; wrongTotal = 0;
  enemies = []; particles = []; rings = []; puffs = []; streaks = [];
  missile = null;
  lockedEnemy = null;
  answer = '';
  shake = 0; flashT = 0; lastNumber = null;
  spawnDelay = 0.2; finishTimer = -1;
  playerScaleTarget = 1; playerScaleShow = 1; growPop = 0;
  closeChallenge();
  numberInput.value = '';
  updateHUD();
}
</script>
