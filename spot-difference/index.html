<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>找不同小侦探 · Spot Difference</title>
<style>*{margin: 0;padding: 0;box-sizing: border-box}
html, body{width: 100%;height: 100%;overflow: hidden}
body{background: #0b1026;font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;user-select: none;-webkit-user-select: none;-webkit-tap-highlight-color: transparent}
#game{display: block;width: 100vw;height: 100vh;touch-action: manipulation}
.hud{position: absolute;top: 64px;left: 14px;z-index: 10;display: flex;gap: 10px;flex-wrap: wrap;pointer-events: none}
.hud-chip{background: rgba(10, 16, 40, .72);border: 1px solid rgba(120, 200, 255, .35);border-radius: 14px;color: #dff2ff;padding: 7px 15px;font-size: 17px;font-weight: 600;box-shadow: 0 4px 18px rgba(0,0,0,.35);backdrop-filter: blur(6px)}
.hud-chip b{color: #ffd35c;font-size: 21px}
#btnMute{position: absolute;top: 12px;right: 12px;z-index: 60;font-size: 20px;line-height: 1;padding: 9px 13px;border-radius: 12px;cursor: pointer;background: rgba(10, 16, 40, .72);border: 1px solid rgba(120, 200, 255, .35);color: #dff2ff}
#btnHint{position: absolute;bottom: 18px;left: 50%;transform: translateX(-50%);z-index: 60;font-size: 19px;line-height: 1.2;padding: 12px 30px;border-radius: 999px;cursor: pointer;background: linear-gradient(90deg, #ff9c5c, #ffd35c);border: none;outline: none;color: #3a2200;font-weight: 800;letter-spacing: 2px;box-shadow: 0 8px 26px rgba(255,180,70,.45);font-family: inherit}
#btnHint:active{transform: translateX(-50%) scale(.96)}
#voiceBar{position: absolute;top: 12px;left: 50%;transform: translateX(-50%);z-index: 25;background: rgba(10, 16, 40, .80);border: 1px solid rgba(120, 200, 255, .35);border-radius: 999px;color: #ffe9b0;font-size: 18px;font-weight: 700;padding: 9px 24px;max-width: 86vw;text-align: center;box-shadow: 0 4px 18px rgba(0,0,0,.35);backdrop-filter: blur(6px);transition: opacity .25s;white-space: nowrap;overflow: hidden;text-overflow: ellipsis}
#voiceBar.hide{opacity: 0}
#toast{position: absolute;left: 50%;top: 42%;transform: translate(-50%, -50%) scale(1);z-index: 30;font-size: 56px;font-weight: 800;color: #ffd35c;text-shadow: 0 4px 18px rgba(0,0,0,.6);opacity: 0;pointer-events: none;transition: opacity .25s, transform .25s;white-space: nowrap}
#toast.pop{opacity: 1;transform: translate(-50%, -58%) scale(1.12)}
#result{position: absolute;inset: 0;z-index: 40;background: rgba(4, 8, 22, .82);display: none;align-items: center;justify-content: center;backdrop-filter: blur(4px)}
#result.show{display: flex}
.result-card{text-align: center;color: #eaf4ff;background: linear-gradient(160deg, #16224a, #0d1330);border: 2px solid #4f8cff;border-radius: 26px;padding: 30px 44px;box-shadow: 0 20px 60px rgba(0,0,0,.55);max-width: 88vw}
.result-card h1{font-size: 38px;color: #ffd35c;margin-bottom: 12px}
.result-card p{font-size: 17px;color: #b9cdf0;margin: 6px 0 22px;line-height: 1.8}
.result-card button{font-size: 20px;padding: 12px 42px;border-radius: 999px;border: none;cursor: pointer;background: linear-gradient(90deg, #4f8cff, #59d1ff);color: #fff;font-weight: 700;letter-spacing: 4px;box-shadow: 0 6px 20px rgba(79,140,255,.45);font-family: inherit}
.result-card button:active{transform: scale(.97)}
#start{position: absolute;inset: 0;z-index: 50;background: radial-gradient(1200px 600px at 50% 30%, #17275e 0%, #0b1026 70%);display: flex;flex-direction: column;align-items: center;justify-content: center;color: #eaf4ff;text-align: center;padding: 20px}
#start h1{font-size: clamp(38px, 8vw, 60px);letter-spacing: 6px;background: linear-gradient(90deg, #ffd35c, #ff9c5c, #5cc8ff);-webkit-background-clip: text;background-clip: text;color: transparent;margin-bottom: 14px}
#start p{font-size: 16px;color: #9db4d8;line-height: 2;max-width: 560px}
#start .rules{margin: 22px 0 28px}
#start button{font-size: 21px;padding: 14px 56px;border-radius: 999px;border: none;cursor: pointer;background: linear-gradient(90deg, #ff9c5c, #ffd35c);color: #3a2200;font-weight: 800;letter-spacing: 6px;box-shadow: 0 8px 26px rgba(255,180,70,.45);font-family: inherit}
#start button:active{transform: scale(.97)}</style>
</head>
<body>

<canvas id="game"></canvas>

<button id="btnMute" title="声音开关">🔊</button>

<div id="voiceBar">点击开始，睁大眼睛找不同吧！</div>

<div class="hud">
  <div class="hud-chip">第 <b id="hudLevel">1</b> / 4 关</div>
  <div class="hud-chip">找到 <b id="hudFound">0</b> / <b id="hudTotal">5</b> 处</div>
  <div class="hud-chip">用了 <b id="hudHints">0</b> 次提示 💡</div>
</div>

<button id="btnHint">💡 提示一下</button>

<div id="toast"></div>

<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">🎉 神探小柯南！</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再玩一次</button>
  </div>
</div>

<div id="start">
  <h1>找不同小侦探</h1>
  <p class="rules">
    两幅画看起来一样，其实藏着 5 处小秘密：<br>
    🔍 点击<b>下面那幅图</b>里不一样的地方 → 放大镜圈出它！<br>
    💡 实在找不到就点"提示"，一处不同会闪闪发光<br>
    🏆 闯过 4 大场景：公园、海底、太空、糖果城！
  </p>
  <button id="btnStart">开始侦探之旅</button>
</div>

<script>
/* =========================================================
 * 找不同小侦探 Spot Difference —— 单文件 Canvas 小游戏
 * 上下两幅 400×300 场景图，同一绘制函数带 variant 参数；
 * 点击下图差异处 → 放大镜光圈标记；点错 → 轻摇 + 嗡声；
 * 5 处找齐 → 烟花庆祝进下一关，4 关结算。
 * ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  layout();
}
window.addEventListener('resize', resize);

/* ---------------- 常量 ---------------- */
const IMG_W = 400, IMG_H = 300;
const HIT_R = 32;
const STATE = { START: 0, RUNNING: 1, LEVEL_UP: 2, FINISH: 3 };
const TOTAL_LEVELS = 4;
const HIT_MARGIN = 30;                    // 命中判定缩边（差异尽量远离外边）
const CHEER_TIME = 1.4;

/* ---------------- 场景定义 ----------------
 * 每关一个绘制函数，variant ∈ {'A','B'}，5 个差异点坐标写死（场景内 400×300 系）。
 * d.desc: 测试/提示语音用差异名。 */
const SCENES = [
  {
    name: '公园', sky: ['#aee3ff', '#e8f7ff'],
    draw: drawPark,
    diffs: [
      { x: 68,  y: 252, desc: '左边皮球' },        // 有无：左下皮球
      { x: 322, y: 238, desc: '花丛颜色' },        // 颜色：右下花朵
      { x: 200, y: 176, desc: '秋千绳子' },        // 大小：秋千座板宽窄
      { x: 118, y: 92,  desc: '风筝' },            // 有无：左上风筝
      { x: 36,  y: 168, desc: '苹果数量' },        // 数量：树上苹果 3 vs 4
    ],
  },
  {
    name: '海底', sky: ['#0b4f8a', '#08305c'],
    draw: drawSea,
    diffs: [
      { x: 74,  y: 90,  desc: '水母数量' },        // 数量：左上水母 2 vs 1
      { x: 330, y: 105, desc: '小丑鱼颜色' },      // 颜色：右上鱼橙 vs 蓝
      { x: 202, y: 225, desc: '宝箱' },            // 有无：中下宝箱
      { x: 258, y: 70,  desc: '气泡大小' },        // 大小：右上气泡
      { x: 132, y: 215, desc: '章鱼' },            // 有无：左下章鱼
    ],
  },
  {
    name: '太空', sky: ['#060a24', '#0b1036'],
    draw: drawSpace,
    diffs: [
      { x: 76,  y: 66,  desc: '飞碟' },            // 有无：左上飞碟
      { x: 322, y: 78,  desc: '行星环' },          // 有无：右上行星光环
      { x: 196, y: 150, desc: '火箭颜色' },        // 颜色：火箭身红 vs 紫
      { x: 270, y: 222, desc: '星星数量' },        // 数量：右下星星 4 vs 3
      { x: 118, y: 222, desc: '宇航员大小' },      // 大小：左下宇航员
    ],
  },
  {
    name: '糖果城', sky: ['#ffc7e6', '#ffeaf6'],
    draw: drawCandy,
    diffs: [
      { x: 72,  y: 60,  desc: '棒棒糖颜色' },      // 颜色：左上棒棒糖
      { x: 326, y: 96,  desc: '彩虹数量' },        // 数量：彩虹 7 道 vs 5 道
      { x: 200, y: 150, desc: '姜饼人' },          // 有无：中央姜饼人
      { x: 298, y: 232, desc: '杯子蛋糕大小' },    // 大小：右下蛋糕
      { x: 122, y: 258, desc: '糖果数量' },        // 数量：左下散糖 3 vs 2
    ],
  },
];

/* ---------------- 状态 ---------------- */
let state = STATE.START;
let level = 1, foundCount = 0, foundFlags = [0,0,0,0,0];
let hintTotal = 0, wrongTotal = 0;
let hintFlash = -1, hintUntil = 0;                // 提示闪烁的差异索引/截止时间
let marks = [];                                   // 已找到标记 [{x,y,anim}]
let fireworks = [];                               // 庆祝烟花粒子
let shake = 0;                                    // 点错轻摇强度
let cheerTimer = -1;
let stageTop = { x: 0, y: 0, w: 0, h: 0 };         // 上图画区
let stageBot = { x: 0, y: 0, w: 0, h: 0 };         // 下图画区

function layout() {
  /* 两幅图横向铺满（保持 4:3），中间留 12px 缝，上下留 HUD 空间 */
  const marginX = Math.min(40, W * 0.04);
  const iw = W - marginX * 2;
  const ih = iw * IMG_H / IMG_W;
  const totalH = ih * 2 + 14;
  const topY = Math.max(86, (H - totalH - 20) / 2);
  stageTop = { x: marginX, y: topY, w: iw, h: ih };
  stageBot = { x: marginX, y: topY + ih + 14, w: iw, h: ih };
}
resize();

/* ---------------- 语音播报 ---------------- */
const synth = window.speechSynthesis || null;
let zhVoice = null, muted = false;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) ||
            vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (muted || !synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.92;
    synth.speak(u);
  } catch (e) { /* 忽略 */ }
}
const voiceBar = $('voiceBar');
let voiceTimer = null;
function say(text) {
  voiceBar.textContent = text;
  voiceBar.classList.remove('hide');
  if (voiceTimer) clearTimeout(voiceTimer);
  voiceTimer = setTimeout(() => voiceBar.classList.add('hide'), 3600);
  speak(text);
}

/* ---------------- 音效 ---------------- */
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
}
function beep(freq, dur, type, vol, sweepTo) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* 忽略 */ }
}
const sfxRight  = () => { beep(660, .09, 'sine', .16); beep(990, .14, 'sine', .16); };
const sfxWrong  = () => beep(180, .3, 'sawtooth', .12, 120);   // 嗡声
const sfxHint   = () => beep(880, .12, 'sine', .12, 1100);
const sfxCheer  = () => { beep(523, .12, 'sine', .14); beep(659, .12, 'sine', .14); beep(784, .2, 'sine', .16); };
const sfxPop    = () => { beep(1200, .18, 'triangle', .16); beep(500, .2, 'sine', .14, 300); };

$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (muted && synth) synth.cancel();
});

/* ---------------- HUD / Toast ---------------- */
function updateHUD() {
  $('hudLevel').textContent = String(level);
  $('hudFound').textContent = String(foundCount);
  $('hudTotal').textContent = String(5);
  $('hudHints').textContent = String(hintTotal);
}
let toastTimer = null;
function toast(text, good) {
  const el = $('toast');
  el.textContent = text;
  el.style.color = good ? '#7dffa1' : '#ffcf6b';
  el.classList.add('pop');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('pop'), 900);
}

/* ---------------- 关卡流程 ---------------- */
const PRAISES = ['太棒了', '好厉害', '真不错', '顶呱呱', '火眼金睛'];

function startLevel() {
  foundCount = 0;
  foundFlags = [0,0,0,0,0];
  marks = [];
  fireworks = [];
  hintFlash = -1;
  hintUntil = 0;
  shake = 0;
  cheerTimer = -1;
  state = STATE.RUNNING;
  updateHUD();
  say(`第 ${level} 关 ${SCENES[level - 1].name}，找出 5 处不同吧！`);
}

function hitDiff(i) {
  if (state !== STATE.RUNNING || foundFlags[i]) return false;
  const d = SCENES[level - 1].diffs[i];
  foundFlags[i] = 1;
  foundCount++;
  marks.push({ x: d.x, y: d.y, anim: 0 });
  sfxRight();
  sfxPop();
  const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  toast(`${praise}！找到${d.desc}`, true);
  say(`${praise}！找到了${d.desc}`);
  updateHUD();
  if (foundCount >= 5) {
    cheerTimer = CHEER_TIME;
    state = STATE.LEVEL_UP;
    sfxCheer();
    spawnFireworks();
    const last = level >= TOTAL_LEVELS;
    toast(last ? '🎉 全部通关啦！' : '🎉 本关找齐啦！', true);
    say(last ? '太厉害了！四关全部通关！' : `${SCENES[level - 1].name}找齐啦！真棒！`);
  }
  return true;
}

function clickStage(gx, gy) {
  /* gx/gy 是 400×300 图内坐标 */
  if (state !== STATE.RUNNING) return false;
  const scene = SCENES[level - 1];
  let best = -1, bestD2 = Infinity;
  for (let i = 0; i < scene.diffs.length; i++) {
    if (foundFlags[i]) continue;
    const d = scene.diffs[i];
    const dx = gx - d.x, dy = gy - d.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) { bestD2 = d2; best = i; }
  }
  if (best >= 0 && bestD2 <= HIT_R * HIT_R) return hitDiff(best);
  /* 点错：轻摇 + 嗡声（无惩罚） */
  wrongTotal++;
  shake = 1;
  sfxWrong();
  toast('再找找看，眼睛擦亮一点', false);
  say('这里一样哦，再仔细看看');
  return false;
}

canvas.addEventListener('pointerdown', e => {
  if (state !== STATE.RUNNING) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const s = stageBot;
  if (x < s.x || x > s.x + s.w || y < s.y || y > s.y + s.h) return;
  const gx = (x - s.x) / s.w * IMG_W;
  const gy = (y - s.y) / s.h * IMG_H;
  clickStage(gx, gy);
});

/* ---------------- 提示 ---------------- */
$('btnHint').addEventListener('click', () => {
  if (state !== STATE.RUNNING) return;
  const scene = SCENES[level - 1];
  const candidates = [];
  for (let i = 0; i < scene.diffs.length; i++) if (!foundFlags[i]) candidates.push(i);
  if (!candidates.length) return;
  hintTotal++;
  hintFlash = candidates[Math.floor(Math.random() * candidates.length)];
  hintUntil = perfT() + 1.5;
  sfxHint();
  say(`提示来啦，注意看${scene.diffs[hintFlash].desc}的位置`);
  updateHUD();
});

/* ---------------- 烟花庆祝 ---------------- */
function spawnFireworks() {
  const colors = ['#ffd35c', '#ff6b6b', '#7dffa1', '#5cc8ff', '#ff9c5c'];
  for (let k = 0; k < 3; k++) {
    const fx = stageBot.x + stageBot.w * (0.25 + 0.25 * k);
    const fy = stageBot.y + stageBot.h * (0.3 + 0.2 * ((k % 2)));
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      fireworks.push({ x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, color: colors[(k + i) % colors.length], size: 2.5 + Math.random() * 2.5 });
    }
  }
}

/* ---------------- 差异绘制通用小件 ---------------- */
function ballAt(g, x, y, r, colors) {
  const grad = g.createRadialGradient(x - r*0.3, y - r*0.3, r*0.1, x, y, r*1.1);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(1, colors[1]);
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
}
function drawStar(g, cx, cy, r, color) {
  g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r;
    const a = -Math.PI/2 + i * Math.PI/5;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fill();
}

/* ================= 场景 1：公园 ================= */
function drawPark(g, v) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);
  grad.addColorStop(0, '#8ed8f8');
  grad.addColorStop(1, '#d8f4ff');
  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(80, 42, 42, 15, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(120, 50, 30, 12, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(300, 36, 46, 16, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#7ec850';
  g.fillRect(0, 232, IMG_W, 68);
  g.fillStyle = '#6db845';
  for (let i = 0; i < IMG_W; i += 18) g.fillRect(i, 232, 9, 4);
  /* 太阳 */
  ballAt(g, 352, 40, 22, ['#fff3b0', '#ffd35c']);
  /* 左树 */
  g.fillStyle = '#8a5a2b'; g.fillRect(46, 168, 12, 66);
  ballAt(g, 52, 150, 34, ['#8fe08f', '#4fae4f']);
  ballAt(g, 30, 172, 22, ['#8fe08f', '#4fae4f']);
  ballAt(g, 74, 172, 22, ['#8fe08f', '#4fae4f']);
  /* D5 树上苹果：A=3 个 / B=4 个 */
  const apples = v === 'A' ? [[40,142],[64,136],[60,164]] : [[40,142],[64,136],[60,164],[36,168]];
  for (const p of apples) ballAt(g, p[0], p[1], 6, ['#ff9f7f', '#e8403a']);
  /* 右树（无差异，纯装饰） */
  g.fillStyle = '#8a5a2b'; g.fillRect(340, 160, 12, 74);
  ballAt(g, 346, 142, 32, ['#8fe08f', '#4fae4f']);
  ballAt(g, 324, 166, 20, ['#8fe08f', '#4fae4f']);
  ballAt(g, 368, 166, 20, ['#8fe08f', '#4fae4f']);
  /* D1 左下皮球：A 有 / B 无 */
  if (v === 'A') {
    ballAt(g, 68, 252, 14, ['#ffd0d0', '#e8403a']);
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    g.beginPath(); g.arc(68, 252, 7, 0, Math.PI*2); g.stroke();
  } else {
    g.fillStyle = '#7ec850';
    g.beginPath(); g.ellipse(68, 258, 16, 5, 0, 0, Math.PI*2); g.fill();
  }
  /* D2 右下花丛颜色：A 红花 / B 黄花 */
  for (let i = 0; i < 5; i++) {
    const fx = 300 + i * 12, fy = 238 + (i % 2) * 8;
    ballAt(g, fx, fy, 7, v === 'A' ? ['#ffb0c0', '#e83a6a'] : ['#fff0b0', '#e8b820']);
    g.fillStyle = '#4fae4f';
    g.fillRect(fx - 1, fy + 6, 2, 8);
  }

/* ---------------- 舞台渲染 ---------------- */
function drawStage(scene) {
  ctx.save();
  ctx.translate(stageTop.x, stageTop.y);
  ctx.scale(stageTop.w / IMG_W, stageTop.h / IMG_H);
  scene.draw(ctx, 'A');
  ctx.restore();

  ctx.save();
  let ox = 0, oy = 0;
  if (shake > 0) {
    ox = Math.sin(shake * 40) * 8 * shake;
  }
  ctx.translate(stageBot.x + ox, stageBot.y + oy);
  ctx.scale(stageBot.w / IMG_W, stageBot.h / IMG_H);
  scene.draw(ctx, 'B');
  ctx.restore();
}

/* 放大镜光圈标记（画在下图） */
function drawMarks(now) {
  for (const m of marks) {
    const s = stageBot;
    const cx = s.x + m.x / IMG_W * s.w;
    const cy = s.y + m.y / IMG_H * s.h;
    const pop = Math.min(1, m.anim);
    const R = (26 + 10 * pop) * Math.min(s.w / IMG_W, 2);
    /* 光圈 */
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#ffd35c';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
    /* 放大镜柄 */
    ctx.strokeStyle = '#8a5a2b';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx + R * 0.72, cy + R * 0.72);
    ctx.lineTo(cx + R * 1.25, cy + R * 1.25);
    ctx.stroke();
    /* 内光晕 */
    const glow = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
    glow.addColorStop(0, 'rgba(255,211,92,.28)');
    glow.addColorStop(1, 'rgba(255,211,92,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* 提示闪烁（上下两幅同一点位对比闪现） */
function drawHintFlash(now) {
  if (hintFlash < 0 || now > hintUntil) return;
  const scene = SCENES[level - 1];
  const d = scene.diffs[hintFlash];
  const blink = 0.5 + 0.5 * Math.sin(now * 14);
  ctx.save();
  ctx.globalAlpha = blink;
  for (const s of [stageTop, stageBot]) {
    const cx = s.x + d.x / IMG_W * s.w;
    const cy = s.y + d.y / IMG_H * s.h;
    ctx.strokeStyle = '#5cc8ff';
    ctx.lineWidth = 5;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(cx, cy, 34 * (s.w / IMG_W), 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* 烟花粒子 */
function drawFireworks() {
  for (const p of fireworks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render(now) {
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070d26');
  bg.addColorStop(1, '#12224e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  if (state === STATE.START) return;

  const scene = SCENES[level - 1];
  drawStage(scene);
  drawMarks(now);
  drawHintFlash(now);
  drawFireworks();

  /* 图框 + 标题 */
  ctx.strokeStyle = 'rgba(120,200,255,.45)';
  ctx.lineWidth = 2;
  for (const s of [stageTop, stageBot]) {
    ctx.strokeRect(s.x, s.y, s.w, s.h);
  }
  ctx.fillStyle = 'rgba(10,16,40,.72)';
  ctx.font = `700 15px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('看一看', stageTop.x + stageTop.w - 52, stageTop.y - 16);
  ctx.fillText('找一找（点这里）', stageBot.x + 150, stageBot.y - 16);
}

/* ---------------- 主循环 ---------------- */
let lastT = 0;
function perfT() { return (window.performance ? performance.now() : 0) / 1000; }
function frame(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000);
  if (lastT === 0) dt = 0;
  lastT = now;
  const t = now / 1000;

  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);

  for (const m of marks) m.anim = Math.min(1, m.anim + dt * 2.5);
  if (hintFlash >= 0 && t > hintUntil) hintFlash = -1;

  for (let i = fireworks.length - 1; i >= 0; i--) {
    const p = fireworks[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1;
    p.life -= dt * 0.9;
    if (p.life <= 0) fireworks.splice(i, 1);
  }

  if (state === STATE.LEVEL_UP) {
    if (cheerTimer > 0) {
      cheerTimer -= dt;
      if (cheerTimer <= 0) {
        cheerTimer = -1;
        if (level >= TOTAL_LEVELS) {
          showResult();
        } else {
          level++;
          startLevel();
        }
      }
    }
  }

  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 结算 ---------------- */
function showResult() {
  let title, medal;
  if (hintTotal === 0)      { title = '🥇 金牌小侦探！'; medal = '金牌'; }
  else if (hintTotal <= 2)  { title = '🥈 银牌小侦探！'; medal = '银牌'; }
  else if (hintTotal <= 4)  { title = '🥉 铜牌小侦探！'; medal = '铜牌'; }
  else                      { title = '🎉 观察小能手！'; medal = '参与奖'; }
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML =
    `闯过 <b style="color:#ffd35c">4</b> 个场景（${medal}）<br>` +
    `使用提示 <b style="color:#ffd35c">${hintTotal}</b> 次 · 点错 <b style="color:#ffcf6b">${wrongTotal}</b> 次<br>` +
    `你的眼睛真尖，下次试试不用提示哦！`;
  $('result').classList.add('show');
  state = STATE.FINISH;
  speak(`全部通关啦！获得${medal}！`);
}

/* ---------------- 开始 / 重开 ---------------- */
function resetGame() {
  level = 1; foundCount = 0;
  foundFlags = [0,0,0,0,0];
  hintTotal = 0; wrongTotal = 0;
  marks = []; fireworks = [];
  hintFlash = -1; hintUntil = 0;
  shake = 0;
  cheerTimer = -1;
  updateHUD();
}
$('btnStart').addEventListener('click', () => {
  initAudio();
  $('start').style.display = 'none';
  resetGame();
  startLevel();
});
$('btnRestart').addEventListener('click', () => {
  $('result').classList.remove('show');
  resetGame();
  startLevel();
});

/* ---------------- 测试钩子 ---------------- */
window.__testDiffs = () => SCENES[level - 1].diffs.map((d, i) => ({
  x: d.x, y: d.y, found: !!foundFlags[i], desc: d.desc,
}));
window.__testClickDiff = (x, y) => clickStage(x, y);
window.__testState = () => state;
window.__testProgress = () => ({
  level, foundCount, hintTotal, wrongTotal, state,
  scene: SCENES[level - 1].name,
});
</script>
