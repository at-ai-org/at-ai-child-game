    g.fillStyle = '#c8ced8';
    g.beginPath(); g.arc(wheelPos[i][0], wheelPos[i][1], 4, 0, Math.PI*2); g.fill();
  }

  /* 机身 */
  g.fillStyle = '#f0a41e';
  g.fillRect(56, 186, 202, 34);
  g.fillStyle = '#c8801a';
  g.fillRect(56, 212, 202, 8);
  /* 配重块 */
  /* --- D5 配重块：A 有 / B 无 · 点位 (110,172) --- */
  if (v === 'A') {
    g.fillStyle = '#6a707c';
    g.fillRect(60, 152, 52, 40);
    g.fillStyle = '#4a505c';
    g.fillRect(64, 156, 44, 6);
  }
  /* 驾驶室（机身左端，两版一致） */
  g.fillStyle = '#3f444d';
  g.fillRect(120, 150, 48, 42);
  g.fillStyle = '#bfe8ff';
  g.fillRect(127, 158, 34, 22);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.beginPath();
  g.moveTo(127, 180); g.lineTo(141, 158); g.lineTo(149, 158); g.lineTo(135, 180);
  g.closePath(); g.fill();

  /* 导杆（桅杆） */
  g.fillStyle = '#8a8f9a';
  g.fillRect(278, 86, 20, 140);
  g.fillStyle = '#c8ced8';
  for (let i = 0; i < 8; i++) g.fillRect(278, 92 + i * 17, 20, 4);
  g.fillStyle = '#6a707c';
  g.fillRect(282, 84, 12, 6);

  /* --- D1 桩锤颜色：A 蓝 / B 紫 · 点位 (220,124) --- */
  const hammerC = v === 'A' ? '#3a7ae8' : '#8a3ad8';
  g.fillStyle = hammerC;
  g.fillRect(204, 102, 36, 44);
  g.fillStyle = '#c8ced8';
  g.fillRect(208, 108, 28, 5);
  g.fillRect(208, 136, 28, 5);
  /* 液压油缸（两版一致） */
  g.strokeStyle = '#c8ced8'; g.lineWidth = 9; g.lineCap = 'round';
  g.beginPath(); g.moveTo(240, 126); g.lineTo(280, 148); g.stroke();
  g.strokeStyle = '#8a8f9a'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(266, 140); g.lineTo(280, 148); g.stroke();

  /* --- D2 桩管大小：A 长 / B 短（A 向上多伸出一段）· 点位 (176,190) --- */
  const pileH = v === 'A' ? 60 : 34;
  g.fillStyle = '#b0b8c4';
  g.fillRect(164, 246 - pileH, 22, pileH);
  g.fillStyle = '#8a929e';
  g.fillRect(164, 246 - pileH, 6, pileH);
  g.fillStyle = '#d8a83a';
  g.fillRect(164, 246 - pileH, 22, 5);
  g.fillRect(164, 246 - pileH, 22, 5);

  /* --- D3 排气烟团：A 有 / B 无 · 点位 (306,196) --- */
  if (v === 'A') {
    g.fillStyle = 'rgba(238,240,244,.92)';
    g.beginPath(); g.arc(306, 196, 20, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(284, 186, 13, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(326, 190, 12, 0, Math.PI*2); g.fill();
  }

  /* 固定装饰：堆放的钢管 */
  g.fillStyle = '#8a929e';
  for (let i = 0; i < 5; i++) g.fillRect(34, 186 + i * 11, 12, 8);
  g.fillStyle = '#6a707c';
  for (let i = 0; i < 5; i++) g.fillRect(34, 186 + i * 11, 12, 3);
}

/* ================= 工程车主题：新增关卡 ================= */

/* ---------------- 舞台渲染 ---------------- */
function drawStage(scene) {
  /* 单幅绘制失败也不能让整帧中断：否则后面的放大镜、提示圈全都画不出来，
   * 表现就是"点对了没反应、提示没用"，很难查 */
  const safeDraw = function (g, v) {
    try {
      scene.draw(g, v);
    } catch (err) {
      if (!drawStage.warned) {
        drawStage.warned = true;
        console.warn('场景绘制失败（' + scene.name + ' ' + v + '）：', err);
      }
    }
  };
  ctx.save();
  ctx.translate(stageTop.x, stageTop.y);
  ctx.scale(stageTop.w / IMG_W, stageTop.h / IMG_H);
  safeDraw(ctx, 'A');
  ctx.restore();

  ctx.save();
  let ox = 0, oy = 0;
  if (shake > 0) {
    ox = Math.sin(shake * 40) * 8 * shake;
  }
  ctx.translate(stageBot.x + ox, stageBot.y + oy);
  ctx.scale(stageBot.w / IMG_W, stageBot.h / IMG_H);
  safeDraw(ctx, 'B');
  ctx.restore();
}

/* 放大镜光圈标记（左右两幅图都画，方便对照） */
function drawMarks(now) {
  for (const m of marks) {
    const pop = Math.min(1, m.anim);
    for (const s of [stageTop, stageBot]) {
      const cx = s.x + m.x / IMG_W * s.w;
      const cy = s.y + m.y / IMG_H * s.h;
      const R = (26 + 10 * pop) * Math.min(s.w / IMG_W, 2);
      /* 光圈 */
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#ffd35c';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
      /* 放大镜柄 */
      ctx.strokeStyle = '#8a5a2b';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx + R * 0.72, cy + R * 0.72);
      ctx.lineTo(cx + R * 1.25, cy + R * 1.25);
      ctx.stroke();
      /* 内光晕 */
      const glow = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
      glow.addColorStop(0, 'rgba(255,211,92,.28)');
      glow.addColorStop(1, 'rgba(255,211,92,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}

/* 提示闪烁（左右两幅同一点位对比闪现） */
function drawHintFlash(now) {
  if (hintFlash < 0 || now > hintUntil) return;
  const scene = curScene();
  const d = scene.diffs[hintFlash];
  const blink = 0.5 + 0.5 * Math.sin(now * 14);
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.strokeStyle = '#5cc8ff';
  ctx.lineWidth = 5;
  ctx.setLineDash([10, 8]);
  for (const s of [stageTop, stageBot]) {
    const kx = s.w / IMG_W, ky = s.h / IMG_H;
    /* 真图关卡的一处变化常常占一大片（比如整栋楼换了颜色）。
     * 只画一个小圈会让人以为"提示的位置不对"，所以按区域框整块高亮。 */
    if (d.boxes && d.boxes.length) {
      for (const b of d.boxes) {
        const x0 = s.x + b[0] * kx, y0 = s.y + b[1] * ky;
        const w0 = (b[2] - b[0]) * kx, h0 = (b[3] - b[1]) * ky;
        ctx.strokeRect(x0 - 3, y0 - 3, w0 + 6, h0 + 6);
      }
      continue;
    }
    const cx = s.x + d.x * kx;
    const cy = s.y + d.y * ky;
    ctx.beginPath();
    ctx.arc(cx, cy, 34 * kx, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

/* 烟花粒子 */
function drawFireworks() {
  for (const p of fireworks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render(now) {
  frameTime = now / 1000;      // A/B 同帧同值，干扰要素两幅完全一致
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070d26');
  bg.addColorStop(1, '#12224e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  if (state === STATE.START) return;

  const scene = curScene();
  drawStage(scene);
  drawMarks(now);
  drawHintFlash(now);
  drawFireworks();

  /* 图框 + 标题 */
  ctx.strokeStyle = 'rgba(120,200,255,.45)';
  ctx.lineWidth = 2;
  for (const s of [stageTop, stageBot]) {
    ctx.strokeRect(s.x, s.y, s.w, s.h);
  }
  /* 中间竖线分隔条 */
  const midX = (stageTop.x + stageTop.w + stageBot.x) / 2;
  const splitGrad = ctx.createLinearGradient(midX - 4, 0, midX + 4, 0);
  splitGrad.addColorStop(0, 'rgba(92,200,255,.15)');
  splitGrad.addColorStop(.5, 'rgba(92,200,255,.85)');
  splitGrad.addColorStop(1, 'rgba(92,200,255,.15)');
  ctx.fillStyle = splitGrad;
  ctx.fillRect(midX - 3, stageTop.y, 6, stageTop.h);
  /* 顶端圆点装饰 */
  ballAt(ctx, midX, stageTop.y - 2, 5, ['#bfe9ff', '#5cc8ff']);
  ballAt(ctx, midX, stageTop.y + stageTop.h + 2, 5, ['#ffd9a0', '#ff9c5c']);
  /* 左右图标题 */
  ctx.fillStyle = 'rgba(10,16,40,.72)';
  ctx.font = `700 15px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('看一看', stageTop.x + stageTop.w / 2, stageTop.y - 16);
  ctx.fillText('找一找（点这里）', stageBot.x + stageBot.w / 2, stageBot.y - 16);
}

/* ---------------- 主循环 ---------------- */
let lastT = 0;
function nowSeconds() { return (window.performance ? performance.now() : 0) / 1000; }
function frame(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000);
  if (lastT === 0) dt = 0;
  lastT = now;
  const t = now / 1000;

  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);

  for (const m of marks) m.anim = Math.min(1, m.anim + dt * 2.5);
  if (hintFlash >= 0 && t > hintUntil) hintFlash = -1;

  for (let i = fireworks.length - 1; i >= 0; i--) {
    const p = fireworks[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1;
    p.life -= dt * 0.9;
    if (p.life <= 0) fireworks.splice(i, 1);
  }

  if (state === STATE.LEVEL_UP) {
    if (cheerTimer > 0) {
      cheerTimer -= dt;
      if (cheerTimer <= 0) {
        cheerTimer = -1;
        if (level >= totalLevels()) {
          showResult();
        } else {
          level++;
          startLevel();
        }
      }
    }
  }

  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 结算 ---------------- */
function showResult() {
  updateDiffBar();          // 结算界面重新露出难度按钮
  let title, medal;
  if (hintTotal === 0)      { title = '🥇 金牌小侦探！'; medal = '金牌'; }
  else if (hintTotal <= 8)  { title = '🥈 银牌小侦探！'; medal = '银牌'; }
  else if (hintTotal <= 16) { title = '🥉 铜牌小侦探！'; medal = '铜牌'; }
  else                      { title = '🎉 观察小能手！'; medal = '参与奖'; }
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML =
    `闯过 <b style="color:#ffd35c">${totalLevels()}</b> 个${diffCfg().photo ? '实景照片' : '场景'}` +
    `（${diffCfg().name}难度 · ${medal}）<br>` +
    `使用提示 <b style="color:#ffd35c">${hintTotal}</b> 次 · 点错 <b style="color:#ffcf6b">${wrongTotal}</b> 次<br>` +
    `你的眼睛真尖，下次试试不用提示哦！`;
  $('result').classList.add('show');
  state = STATE.FINISH;
  speak(`全部通关啦！获得${medal}！`);
}

/* ---------------- 开始 / 重开 ---------------- */
function resetGame() {
  updateDiffBar();
  shuffleLevels();                 // 每局重新洗牌：出题顺序不再固定
  level = 1; foundCount = 0;
  foundFlags = new Array(spotsOf()).fill(0);
  hintTotal = 0; wrongTotal = 0;
  marks = []; fireworks = [];
  hintFlash = -1; hintUntil = 0;
  shake = 0;
  cheerTimer = -1;
  updateHUD();
}
$('btnStart').addEventListener('click', () => {
  /* 真图还没就位就先等一下，免得开局看到两张"照片加载中"的空图 */
  if (!photosReady()) {
    say('照片正在加载，马上就好…');
    ensurePhotos(function () { $('btnStart').click(); });
    return;
  }
  initAudio();
  $('start').style.display = 'none';
  resetGame();
  startLevel();
});
$('btnRestart').addEventListener('click', () => {
  $('result').classList.remove('show');
  resetGame();
  startLevel();
});

/* ---------------- 难度选择 ---------------- */
function refreshStartText() {
  const cfg = diffCfg();
  const sp = $('startSpots'); if (sp) sp.textContent = String(cfg.spots);
  const sd = $('startDiff');
  if (sd) sd.innerHTML = '🎨 当前难度：<b>' + cfg.name + '</b> · ' + cfg.blurb;
  const tl = $('hudTotalLevel'); if (tl) tl.textContent = String(totalLevels());
}

function updateDiffBar() {
  const bar = $('diffBar');
  if (!bar) return;
  const btns = bar.querySelectorAll('.diff-btn');
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('on', btns[i].getAttribute('data-diff') === difficulty);
  }
  /* 只在开始界面显示：玩的时候屏幕上不该有难度按钮，
   * 免得孩子玩着玩着把难度点掉了 */
  const showBar = (state === STATE.START || state === STATE.FINISH);
  bar.classList.toggle('hidden', !showBar);
  bar.classList.toggle('locked', !showBar);
  refreshStartText();
}

/* 当前难度的真图是否都准备好了（简单难度没有照片，恒为 true） */
function photosReady() {
  if (!diffCfg().photo) return true;
  const pool = scenePool();
  for (let i = 0; i < pool.length; i++) {
    const k = pool[i].key;
    if (k && !PHOTO_IMAGES[k] && !PHOTO_FAILED[k]) return false;
  }
  return true;
}

/* 把关卡池里的真图全部加载好（用于开始前等待） */
function ensurePhotos(cb) {
  if (photosReady()) { cb(); return; }
  const pool = scenePool();
  preloadPhotos(pool, function () { cb(); });
}

function setDifficulty(d) {
  if (!DIFFICULTY[d] || d === difficulty) return false;
  if (state === STATE.RUNNING || state === STATE.LEVEL_UP) {
    toast('先回主页再换难度吧', false);
    say('想换难度的话，先点左上角的房子回主页哦');
    return false;
  }
  difficulty = d;
  try { localStorage.setItem('spotdiff.difficulty', d); } catch (e) {}
  $('result').classList.remove('show');
  $('start').style.display = '';
  state = STATE.START;
  resetGame();                       // 换池子 + 重新洗牌
  preloadPhotos(scenePool());        // 真图先加载好，免得开局看到"加载中"
  updateDiffBar();
  say('已切换到' + diffCfg().name + '难度：' + diffCfg().blurb);
  return true;
}

(function initDifficulty() {
  const bar = $('diffBar');
  if (bar) {
    const btns = bar.querySelectorAll('.diff-btn');
    for (let i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) {
        e.stopPropagation();
        setDifficulty(this.getAttribute('data-diff'));
      });
    }
  }
  shuffleLevels();                   // 先按（可能是上次记住的）难度建好关卡池
  preloadPhotos(scenePool());
  updateDiffBar();
})();

/* ---------------- 测试钩子 ---------------- */
window.__testDiffs = () => curScene().diffs.map((d, i) => ({
  x: d.x, y: d.y, found: !!foundFlags[i], desc: d.desc,
}));
window.__testClickDiff = (x, y) => clickStage(x, y);
window.__testState = () => state;
window.__testProgress = () => ({
  level, foundCount, hintTotal, wrongTotal, state,
  scene: curScene().name,
});
window.__testOrder = () => LEVELS.map(s => s.name);   // 本局出题顺序（验证随机用）
window.__testShuffle = () => shuffleLevels();
window.__testDifficulty = () => difficulty;
window.__testSetDifficulty = (d) => setDifficulty(d);
window.__testSpots = () => spotsOf();
window.__testPreload = () => { preloadPhotos(scenePool()); return Object.keys(PHOTO_IMAGES).length; };
window.__testPhotos = () => Object.keys(PHOTO_IMAGES);
window.__testStages = () => ({ top: stageTop, bot: stageBot, img: { w: IMG_W, h: IMG_H } });
window.__testClutter = () => diffCfg().clutter;
window.__testMarks = () => marks.slice();
window.__testHint = () => hintFlash;
/* 回到开始界面（测试用：难度只能在非游戏状态下切换） */
window.__testToStart = () => {
  state = STATE.START;
  $('start').style.display = '';
  $('result').classList.remove('show');
  updateDiffBar();
  return true;
};
/* 离屏渲染当前关卡的 A/B 两版，用来验证"干扰要素在两版里完全一致" */
window.__testAB = () => {
  const sc = curScene();
  const keep = frameTime;
  frameTime = 1.234;                 // 固定时间，A/B 必须逐像素只差声明的那几处
  const out = {};
  ['A', 'B'].forEach(function (v) {
    const cv = document.createElement('canvas');
    cv.width = IMG_W; cv.height = IMG_H;
    sc.draw(cv.getContext('2d'), v);
    out[v] = cv;
  });
  frameTime = keep;
  return out;
};
</script>

<script>
/* ---- 返回主页：确认弹窗 ---- */
(function () {
  var btn = document.getElementById('btnHome');
  var dlg = document.getElementById('homeConfirm');
  if (!btn || !dlg) return;
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    dlg.classList.add('show');
  });
  document.getElementById('hcOk').addEventListener('click', function () {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (err) {}
    window.location.replace('../index.html');
  });
  document.getElementById('hcCancel').addEventListener('click', function () {
    dlg.classList.remove('show');
  });
  dlg.addEventListener('pointerdown', function (e) {
    if (e.target === dlg) dlg.classList.remove('show');
  });
})();
</script>


<script>
/* ---- 禁用浏览器回退：按物理回退键只会弹确认弹窗 ---- */
(function () {
  var dlg = document.getElementById('homeConfirm');
  /* 无弹窗结构（理论上不会发生）时退化为静默推回 */
  function guardBack() {
    try { history.pushState({ g: 1 }, '', '#guard'); } catch (e) {}
    if (dlg) {
      dlg.classList.add('show');
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    }
  }
  try {
    history.pushState({ g: 1 }, '', '#guard');
    window.addEventListener('popstate', guardBack);
    /* 页面显示状态变化（从 bfcache 恢复）时重新垫垫子 */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { try { history.pushState({ g: 1 }, '', '#guard'); } catch (err) {} }
    });
  } catch (e) {}
})();
</script>
