<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>*{margin: 0;padding: 0;box-sizing: border-box}
html, body{width: 100%;height: 100%;overflow: hidden}
body{background: #0b1026;font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;user-select: none;-webkit-user-select: none;-webkit-tap-highlight-color: transparent}
#game{display: block;width: 100vw;height: 100vh;touch-action: manipulation}
.hud{position: absolute;top: 72px;left: 14px;z-index: 10;display: flex;gap: 10px;flex-wrap: wrap;pointer-events: none}
.hud-chip{background: rgba(10, 16, 40, .72);border: 1px solid rgba(120, 200, 255, .35);border-radius: 14px;color: #dff2ff;padding: 7px 15px;font-size: 17px;font-weight: 600;box-shadow: 0 4px 18px rgba(0,0,0,.35);backdrop-filter: blur(6px)}
.hud-chip b{color: #ffd35c;font-size: 21px}
#btnMute{position: absolute;top: 12px;right: 12px;z-index: 60;font-size: 20px;line-height: 1;padding: 9px 13px;border-radius: 12px;cursor: pointer;background: rgba(10, 16, 40, .72);border: 1px solid rgba(120, 200, 255, .35);color: #dff2ff}
#btnHint{position: absolute;bottom: 18px;left: 50%;transform: translateX(-50%);z-index: 60;font-size: 19px;line-height: 1.2;padding: 12px 30px;border-radius: 999px;cursor: pointer;background: linear-gradient(90deg, #ff9c5c, #ffd35c);border: none;outline: none;color: #3a2200;font-weight: 800;letter-spacing: 2px;box-shadow: 0 8px 26px rgba(255,180,70,.45);font-family: inherit}
#btnHint:active{transform: translateX(-50%) scale(.96)}
#voiceBar{position: absolute;top: 12px;left: 50%;transform: translateX(-50%);z-index: 25;background: rgba(10, 16, 40, .80);border: 1px solid rgba(120, 200, 255, .35);border-radius: 999px;color: #ffe9b0;font-size: 18px;font-weight: 700;padding: 9px 24px;max-width: 86vw;text-align: center;box-shadow: 0 4px 18px rgba(0,0,0,.35);backdrop-filter: blur(6px);transition: opacity .25s;white-space: nowrap;overflow: hidden;text-overflow: ellipsis}
#voiceBar.hide{opacity: 0}
#toast{position: absolute;left: 50%;top: 42%;transform: translate(-50%, -50%) scale(1);z-index: 30;font-size: 56px;font-weight: 800;color: #ffd35c;text-shadow: 0 4px 18px rgba(0,0,0,.6);opacity: 0;pointer-events: none;transition: opacity .25s, transform .25s;white-space: nowrap}
#toast.pop{opacity: 1;transform: translate(-50%, -58%) scale(1.12)}
#result{position: absolute;inset: 0;z-index: 40;background: rgba(4, 8, 22, .82);display: none;align-items: center;justify-content: center;backdrop-filter: blur(4px)}
#result.show{display: flex}
.result-card{text-align: center;color: #eaf4ff;background: linear-gradient(160deg, #16224a, #0d1330);border: 2px solid #4f8cff;border-radius: 26px;padding: 30px 44px;box-shadow: 0 20px 60px rgba(0,0,0,.55);max-width: 88vw}
.result-card h1{font-size: 38px;color: #ffd35c;margin-bottom: 12px}
.result-card p{font-size: 17px;color: #b9cdf0;margin: 6px 0 22px;line-height: 1.8}
.result-card button{font-size: 20px;padding: 12px 42px;border-radius: 999px;border: none;cursor: pointer;background: linear-gradient(90deg, #4f8cff, #59d1ff);color: #fff;font-weight: 700;letter-spacing: 4px;box-shadow: 0 6px 20px rgba(79,140,255,.45);font-family: inherit}
.result-card button:active{transform: scale(.97)}
#start{position: absolute;inset: 0;z-index: 50;background: radial-gradient(1200px 600px at 50% 30%, #17275e 0%, #0b1026 70%);display: flex;flex-direction: column;align-items: center;justify-content: center;color: #eaf4ff;text-align: center;padding: 20px}
#start h1{font-size: clamp(38px, 8vw, 60px);letter-spacing: 6px;background: linear-gradient(90deg, #ffd35c, #ff9c5c, #5cc8ff);-webkit-background-clip: text;background-clip: text;color: transparent;margin-bottom: 14px}
#start p{font-size: 16px;color: #9db4d8;line-height: 2;max-width: 560px}
#start .rules{margin: 22px 0 28px}
#start button{font-size: 21px;padding: 14px 56px;border-radius: 999px;border: none;cursor: pointer;background: linear-gradient(90deg, #ff9c5c, #ffd35c);color: #3a2200;font-weight: 800;letter-spacing: 6px;box-shadow: 0 8px 26px rgba(255,180,70,.45);font-family: inherit}
#start button:active{transform: scale(.97)}
/* ---- 返回主页按钮 + 确认弹窗 ---- */
#btnHome { position: absolute; top: 12px; left: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); color: #dff2ff; font-family: inherit; }
#btnHome:active { transform: scale(.94); }
/* ---- 难度选择（紧挨着返回主页按钮）---- */
.diff-bar { position: absolute; top: 12px; left: 66px; z-index: 60; display: flex; gap: 3px;
  background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35);
  border-radius: 12px; padding: 4px; backdrop-filter: blur(6px); }
.diff-btn { font-family: inherit; font-size: 15px; line-height: 1; padding: 7px 13px; border-radius: 9px;
  border: none; cursor: pointer; background: transparent; color: #9db4d8; font-weight: 600; letter-spacing: 1px; }
.diff-btn:hover { color: #dff2ff; }
.diff-btn.on { color: #3a2200; background: linear-gradient(90deg, #ff9c5c, #ffd35c); box-shadow: 0 2px 10px rgba(255,180,70,.4); }
.diff-btn.on[data-diff="hard"] { color: #fff; background: linear-gradient(90deg, #ff7a5c, #ff4d6d); box-shadow: 0 2px 10px rgba(255,90,110,.45); }
.diff-btn.on[data-diff="hell"] { color: #fff; background: linear-gradient(90deg, #8a4dff, #d84dff); box-shadow: 0 2px 10px rgba(180,80,255,.45); }
.diff-bar.hidden { display: none; }
.diff-bar.locked .diff-btn { opacity: .45; }
.diff-bar.locked .diff-btn.on { opacity: 1; }
@media (max-width: 620px) { .diff-bar { left: 60px; } .diff-btn { font-size: 13px; padding: 6px 9px; letter-spacing: 0; } }
#homeConfirm { position: absolute; inset: 0; z-index: 90; background: rgba(4, 8, 22, .62); display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
#homeConfirm.show { display: flex; }
#homeConfirm .hc-card { text-align: center; background: linear-gradient(160deg, #16224a, #0d1330); border: 2px solid #4f8cff; border-radius: 22px; padding: 26px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.5); max-width: 84vw; }
#homeConfirm .hc-card h2 { font-size: 24px; color: #eaf4ff; margin-bottom: 8px; letter-spacing: 2px; }
#homeConfirm .hc-card p { font-size: 15px; color: #9db4d8; margin: 4px 0 18px; }
#homeConfirm .hc-btns { display: flex; gap: 14px; justify-content: center; }
#homeConfirm button { font-size: 17px; padding: 10px 26px; border-radius: 999px; border: none; cursor: pointer; font-weight: 700; letter-spacing: 2px; font-family: inherit; }
#homeConfirm button:active { transform: scale(.96); }
#hcOk { background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; box-shadow: 0 6px 18px rgba(255,180,70,.4); }
#hcCancel { background: rgba(255,255,255,.12); color: #dff2ff; border: 1px solid rgba(120,200,255,.4) !important; }
</style>
</head>
<body>
<button id="btnHome" title="返回主页">🏠</button>

<!-- 难度选择：只在开始界面出现，进入游戏后自动隐藏 -->
<div id="diffBar" class="diff-bar" title="选择难度">
  <button class="diff-btn" type="button" data-diff="easy">简单</button>
  <button class="diff-btn" type="button" data-diff="hard">困难</button>
  <button class="diff-btn" type="button" data-diff="hell">地狱</button>
</div>
<div id="homeConfirm">
  <div class="hc-card">
    <h2>🏠 返回游戏主页？</h2>
    <p>当前的游戏进度将会丢失哦</p>
    <div class="hc-btns">
      <button id="hcOk">确认返回</button>
      <button id="hcCancel">再玩一会儿</button>
    </div>
  </div>
</div>


<canvas id="game"></canvas>

<button id="btnMute" title="声音开关">🔊</button>

<div id="voiceBar">点击开始，睁大眼睛找不同吧！</div>

<div class="hud">
  <div class="hud-chip">第 <b id="hudLevel">1</b> / <b id="hudTotalLevel">48</b> 关</div>
  <div class="hud-chip">找到 <b id="hudFound">0</b> / <b id="hudTotal">5</b> 处</div>
  <div class="hud-chip">用了 <b id="hudHints">0</b> 次提示 💡</div>
</div>

<button id="btnHint">💡 提示一下</button>

<div id="toast"></div>

<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">🎉 神探小柯南！</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再玩一次</button>
  </div>
</div>

<div id="start">
  <h1>找不同小侦探</h1>
  <p class="rules">
    左右两幅画看起来一样，其实藏着 <b id="startSpots">5</b> 处小秘密：<br>
    🔍 点击<b>任意一幅图</b>里不一样的地方 → 放大镜圈出它！<br>
    💡 实在找不到就点"提示"，一处不同会闪闪发光<br>
    <span id="startDiff">🎨 当前难度：<b>简单</b> · 48 个手绘场景，每局随机出题</span>
  </p>
  <button id="btnStart">开始侦探之旅</button>
</div>

<!-- 真图关卡的图片数据（base64 内嵌，见 tools/embed-photo-levels.py） -->
<script src="photos-data.js"></script>
<script>
/* 屏蔽右键菜单：防止游戏中误触（触屏板双指/鼠标右键弹出系统菜单打断游戏） */
window.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
 * 找不同小侦探 Spot Difference —— 单文件 Canvas 小游戏
 * 左右两幅 400×300 场景图（中间竖线隔开），同一绘制函数带 variant 参数；
 * 点击任意一幅图的差异处 → 放大镜光圈标记；点错 → 轻摇 + 嗡声；
 * 5 处找齐 → 烟花庆祝进下一关，48 关结算（出题顺序每局随机）。
 * ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  layout();
}
window.addEventListener('resize', resize);

/* ---------------- 常量 ---------------- */
const IMG_W = 400, IMG_H = 300;
const HIT_R = 40;                         // 基准命中半径（幼儿手指粗，判定放宽）
const HIT_R_MIN = 34;                     // 靠边的差异至少也留这么大的判定圈
const STATE = { START: 0, RUNNING: 1, LEVEL_UP: 2, FINISH: 3 };
/* 关卡总数 = 场景数，在 SCENES 定义之后求值（见下方「关卡顺序」段） */
const HINT_TIME = 2.6;                    // 提示高亮持续秒数（幼儿看得清）
const CHEER_TIME = 1.4;

/* ---------------- 场景定义 ----------------
 * 每关一个绘制函数，variant ∈ {'A','B'}，5 个差异点坐标写死（场景内 400×300 系）。
 * 共 48 大场景（下面数组的下标只是"场景编号"，实际出题顺序每局随机，见「关卡顺序」）。
 *   场景 1-18：公园、海底、太空、糖果城、农场、雪地、森林、夜晚、生日、
 *              沙漠、海滩、花园、马戏团、超市、恐龙、湖泊、万圣节、游乐园。
 *   场景 19-36：水果摊、雨天、图书馆、厨房、太空站、菜市场、音乐教室、消防站、
 *              医院、火车站、农场池塘、露营、乐高城、天文台、花市、运动场、
 *              宠物店、面包店。
 *   场景 37-48：工程车主题——挖掘机、推土机、压路机、塔吊、水泥搅拌车、自卸卡车、
 *              装载机、叉车、混凝土泵车、洒水车、高空作业车、打桩机。
 * d.desc: 测试/提示语音用差异名。
 * 注意：差异点坐标必须落在"该差异真正画出来的位置"上（见 tools/spot-diff-verify.mjs
 * 与 tools/spot-diff-scene-check.mjs 的像素校验），数量类差异要指向"消失/新增的那一个"，
 * 而不是两者都有的那个；大小类差异要指向"A 比 B 多出来的那一圈"，不能取中心。 */
const SCENES = [
  {
    name: '公园', sky: ['#aee3ff', '#e8f7ff'],
    draw: drawPark,
    diffs: [
      { x: 68,  y: 214, desc: '左边皮球' },        // 有无：左下皮球
      { x: 320, y: 206, desc: '花丛颜色' },        // 颜色：右下花朵
      { x: 175, y: 181, desc: '秋千绳子' },        // 大小：秋千座板宽窄（A 宽出来的一段）
      { x: 118, y: 92,  desc: '风筝' },            // 有无：左上风筝
      { x: 72,  y: 144, desc: '苹果数量' },        // 数量：树上苹果 3 vs 4（第 4 颗出现）
    ],
  },
  {
    name: '海底', sky: ['#0b4f8a', '#08305c'],
    draw: drawSea,
    diffs: [
      { x: 74,  y: 90,  desc: '水母数量' },        // 数量：左上水母 2 vs 1
      { x: 330, y: 105, desc: '小丑鱼颜色' },      // 颜色：右上鱼橙 vs 蓝
      { x: 202, y: 225, desc: '宝箱' },            // 有无：中下宝箱
      { x: 258, y: 70,  desc: '气泡大小' },        // 大小：右上气泡
      { x: 132, y: 215, desc: '章鱼' },            // 有无：左下章鱼
    ],
  },
  {
    name: '太空', sky: ['#060a24', '#0b1036'],
    draw: drawSpace,
    diffs: [
      { x: 76,  y: 66,  desc: '飞碟' },            // 有无：左上飞碟
      { x: 322, y: 78,  desc: '行星环' },          // 有无：右上行星光环
      { x: 196, y: 150, desc: '火箭颜色' },        // 颜色：火箭身红 vs 紫
      { x: 270, y: 222, desc: '星星数量' },        // 数量：右下星星 4 vs 3
      { x: 118, y: 222, desc: '宇航员大小' },      // 大小：左下宇航员
    ],
  },
  {
    name: '糖果城', sky: ['#ffc7e6', '#ffeaf6'],
    draw: drawCandy,
    diffs: [
      { x: 72,  y: 60,  desc: '棒棒糖颜色' },      // 颜色：左上棒棒糖
      { x: 326, y: 96,  desc: '彩虹数量' },        // 数量：彩虹 7 道 vs 5 道
      { x: 200, y: 150, desc: '姜饼人' },          // 有无：中央姜饼人
      { x: 298, y: 232, desc: '杯子蛋糕大小' },    // 大小：右下蛋糕
      { x: 122, y: 240, desc: '糖果数量' },        // 数量：左下散糖 3 vs 2
    ],
  },
  {
    name: '农场', sky: ['#aee8ff', '#e8f7d8'],
    draw: drawFarm,
    diffs: [
      { x: 68,  y: 96,  desc: '太阳镜' },          // 有无：太阳戴墨镜
      { x: 322, y: 130, desc: '风车叶片颜色' },    // 颜色：风车叶片红 vs 蓝
      { x: 222, y: 222, desc: '小鸡数量' },        // 数量：小鸡 3 只 vs 2 只（第 3 只消失）
      { x: 118, y: 150, desc: '干草堆大小' },      // 大小：左中干草堆
      { x: 280, y: 248, desc: '南瓜' },            // 有无：右下南瓜（点位右移，离 D3 小鸡 63px）
    ],
  },
  {
    name: '雪地', sky: ['#b8dcff', '#eaf6ff'],
    draw: drawSnow,
    diffs: [
      { x: 70,  y: 114, desc: '雪人围巾' },        // 颜色：围巾红 vs 绿
      { x: 310, y: 108, desc: '雪花数量' },        // 数量：右上雪花 4 vs 3（第 4 片消失）
      { x: 200, y: 195, desc: '冰屋门' },          // 有无：中央冰屋门
      { x: 130, y: 230, desc: '雪橇' },            // 有无：左下雪橇
      { x: 286, y: 224, desc: '企鹅大小' },        // 大小：右下企鹅
    ],
  },
  {
    name: '森林', sky: ['#c8f0c8', '#eafcdf'],
    draw: drawForest,
    diffs: [
      { x: 72,  y: 92,  desc: '蘑菇颜色' },        // 颜色：左上蘑菇红 vs 黄
      { x: 323, y: 152, desc: '小鸟数量' },        // 数量：树洞小鸟 2 vs 1
      { x: 200, y: 200, desc: '刺猬' },            // 有无：中央刺猬
      { x: 126, y: 232, desc: '蘑菇大小' },        // 大小：左下蘑菇
      { x: 288, y: 236, desc: '浆果数量' },        // 数量：右下浆果 4 vs 3
    ],
  },
  {
    name: '夜晚', sky: ['#0a1038', '#182450'],
    draw: drawNight,
    diffs: [
      { x: 70,  y: 66,  desc: '月亮方向' },        // 形状：月牙朝向
      { x: 308, y: 102, desc: '星星数量' },        // 数量：右上亮星 4 vs 3（第 4 颗消失）
      { x: 191, y: 195, desc: '窗户灯光' },        // 颜色：小屋窗户亮 vs 暗
      { x: 120, y: 236, desc: '萤火虫数量' },      // 数量：左下萤火虫 3 vs 2
      { x: 288, y: 210, desc: '猫头鹰' },          // 有无：右下猫头鹰
    ],
  },
  {
    name: '生日', sky: ['#ffe0f0', '#fff4fb'],
    draw: drawBirthday,
    diffs: [
      { x: 96,  y: 76,  desc: '气球数量' },        // 数量：左上气球 3 vs 2（第 3 个消失）
      { x: 326, y: 96,  desc: '彩旗颜色' },        // 颜色：右上彩旗
      { x: 223, y: 168, desc: '蛋糕蜡烛' },        // 数量：蜡烛 4 根 vs 3 根（第 4 根消失）
      { x: 298, y: 234, desc: '礼物盒' },          // 有无：右下礼物盒
      { x: 118, y: 226, desc: '礼物蝴蝶结' },      // 颜色：左下蝴蝶结
    ],
  },
  {
    name: '沙漠', sky: ['#ffd9a0', '#ffefd0'],
    draw: drawDesert,
    diffs: [
      { x: 68,  y: 96,  desc: '太阳帽子' },        // 有无：太阳戴帽子
      { x: 322, y: 140, desc: '金字塔大小' },      // 大小：右金字塔
      { x: 200, y: 190, desc: '骆驼数量' },        // 数量：骆驼 2 vs 1
      { x: 122, y: 196, desc: '仙人掌花' },        // 有无：左下仙人掌开花
      { x: 290, y: 236, desc: '仙人掌高度' },      // 大小：右下仙人掌
    ],
  },
  {
    name: '海滩', sky: ['#8ed8f8', '#d8f4ff'],
    draw: drawBeach,
    diffs: [
      { x: 70,  y: 90,  desc: '椰子数量' },        // 数量：树上椰子 3 vs 2
      { x: 324, y: 100, desc: '热气球颜色' },      // 颜色：右上热气球
      { x: 200, y: 160, desc: '遮阳伞' },          // 有无：中央遮阳伞
      { x: 128, y: 232, desc: '海星数量' },        // 数量：左下海星 2 vs 1
      { x: 292, y: 234, desc: '螃蟹' },            // 有无：右下螃蟹
    ],
  },
  {
    name: '花园', sky: ['#c8f0c8', '#f0fbe8'],

/* =========================================================================
 * 真图关卡（困难 / 地狱 = 公园手绘 SVG 场景：困难 6 处、地狱换天色 7 处）
 *   SVG 源与 400×300 出图见 tools/gen-svg-park-levels.py；
 *   出图后跑 tools/embed-photo-levels.py 内嵌成 photos-data.js
 *
 * 每关有 A/B 两张模型画的图，差异由**游戏自己比对出来**（computePhotoDiffs）：
 * 把两张图画到离屏画布，逐像素比色差，连通域就是一处变化。
 *
 * 为什么不在离线阶段把差异坐标写死？
 *   写死的话，只要检测漏掉一处（阈值高了一点、边缘没圈住），那一处就成了陷阱 ——
 *   孩子看得见、点上去却判错。运行时比对则天然自洽：凡是两张图真不一样的地方，
 *   一定在判定区域里；数量、位置、提示区域全部跟着图走，不会对不上。
 *
 * 图片以 base64 内嵌在 photos-data.js 里（不是 images/*.jpg 相对路径），
 * 因为 file:// 下按路径加载的本地图片会污染画布，读像素会抛 SecurityError。
 * ========================================================================= */
const PHOTO_DATA = window.PHOTO_DATA || {};
const PHOTO_IMAGES = {};      // key -> { A: Image, B: Image }
const PHOTO_FAILED = {};      // 加载失败的，避免反复重试
let frameTime = 0;            // 同一帧内 A/B 共用同一个时间，干扰要素才不会变成"差异"

/* 差异判定参数（和离线生成脚本里的取值保持一致） */
const PHOTO_DIFF_TH = 110;    // 单像素色差阈值（RGB 之和）
const PHOTO_MIN_AREA = 45;    // 一处变化至少覆盖这么多像素才算"看得见"
const PHOTO_MERGE = 30;       // 碎块合并距离
const PHOTO_MAX_W = 220;      // 一组变化的最大包围盒（防止连锁合并吞掉整幅图）
const PHOTO_MAX_H = 180;
const PHOTO_MIN_GAP = 34;     // 点位两两至少这么远
const PHOTO_PAD = 18;         // 判定区域外扩。除了给小朋友容差，
                              // 也把差异边缘那些肉眼看不见的一两个像素碎点一起圈进来

const PHOTO_SCENES = { hard: [], hell: [] };
(function buildPhotoScenes() {
  const order = {
    hard: ['hard-1', 'hard-2', 'hard-3', 'hard-4', 'hard-5', 'hard-6',
           'hard-7', 'hard-8', 'hard-9', 'hard-10', 'hard-11', 'hard-12'],
    hell: ['hell-1', 'hell-2', 'hell-3', 'hell-4', 'hell-5', 'hell-6',
           'hell-7', 'hell-8', 'hell-9', 'hell-10', 'hell-11', 'hell-12'],
  };
  for (const group of ['hard', 'hell']) {
    for (const key of order[group]) {
      const d = PHOTO_DATA[key];
      if (!d) continue;
      const sc = {
        key: key, name: d.name, group: group,
        imgA: d.A, imgB: d.B, seed: (key.charCodeAt(key.length - 1) || 1) * 7919,
      };
      sc.draw = function (g, v) { photoDraw(sc, g, v); };
      PHOTO_SCENES[group].push(sc);
    }
  }
})();

/* 预加载（浏览器里是异步的；测试环境里 Image 会同步回调）。
 * ⚠ 每关有 A、B 两张图，两张都要加载 —— 只加载 A 会让右图一直显示"照片加载中"。 */
function preloadPhotos(list, onReady) {
  const todo = [];
  for (const sc of (list || [])) {
    if (!sc || !sc.key) continue;
    if (PHOTO_IMAGES[sc.key]) continue;
    if (PHOTO_FAILED[sc.key]) continue;
    todo.push(sc);
  }
  let left = todo.length, done = false;
  const finish = function () {
    if (!done && left <= 0) { done = true; if (onReady) onReady(); }
  };
  if (!left) { finish(); return 0; }
  for (const sc of todo) {
    const box = { A: null, B: null };
    let got = 0;
    const one = function () {
      got++;
      if (got >= 2) {
        if (box.A && box.B) PHOTO_IMAGES[sc.key] = box;
        else PHOTO_FAILED[sc.key] = 1;
        left--; finish();
      }
    };
    for (const which of ['A', 'B']) {
      const img = new Image();
      img.onload = function () { box[which] = img; one(); };
      img.onerror = function () { one(); };
      img.src = sc['img' + which];
    }
  }
  finish();                  // 同步回调的情况（测试桩）在这里收口
  return left;
}

/* ---------------- 差异检测：游戏自己比对 A/B 两张图 ---------------- */
function computePhotoDiffs(sc) {
  if (sc._diffs) return sc._diffs;
  const imgs = PHOTO_IMAGES[sc.key];
  if (!imgs || !imgs.A || !imgs.B) return null;
  const W = IMG_W, H = IMG_H;
  const ca = document.createElement('canvas'); ca.width = W; ca.height = H;
  const cb = document.createElement('canvas'); cb.width = W; cb.height = H;
  const ga = ca.getContext('2d'), gb = cb.getContext('2d');
  ga.drawImage(imgs.A, 0, 0, W, H);
  gb.drawImage(imgs.B, 0, 0, W, H);
  let da, db;
  try {
    da = ga.getImageData(0, 0, W, H).data;
    db = gb.getImageData(0, 0, W, H).data;
  } catch (e) {
    return null;               // 画布被污染（data URI 理论上不会），交给上层兜底
  }
  const mask = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < mask.length; i++, p += 4) {
    const d = Math.abs(da[p] - db[p]) + Math.abs(da[p + 1] - db[p + 1]) +
              Math.abs(da[p + 2] - db[p + 2]);
    if (d > PHOTO_DIFF_TH) mask[i] = 1;
  }
  /* 连通域：每一块连通的差异像素 */
  const seen = new Uint8Array(W * H);
  const clusters = [];
  for (let i = 0; i < mask.length; i++) {
    if (!mask[i] || seen[i]) continue;
    const stack = [i]; seen[i] = 1;
    let area = 0, minX = W, minY = H, maxX = -1, maxY = -1, sx = 0, sy = 0, dsum = 0;
    while (stack.length) {
      const q = stack.pop();
      const x = q % W, y = (q - x) / W;
      area++; sx += x; sy += y;
      const p = q * 4;
      dsum += Math.abs(da[p] - db[p]) + Math.abs(da[p + 1] - db[p + 1]) +
              Math.abs(da[p + 2] - db[p + 2]);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const r = ny * W + nx;
          if (mask[r] && !seen[r]) { seen[r] = 1; stack.push(r); }
        }
      }
    }
    clusters.push({ area: area, minX: minX, minY: minY, maxX: maxX, maxY: maxY,
                    cx: sx / area, cy: sy / area, strength: dsum / area });
  }
  /* 合并成"一处变化"：同一处常被拆成好几块（描边、阴影分开）；
   * 中心离得比判定间距还近的也必须并成一处，否则第二处没有点位/区域，
   * 孩子点它会判错。 */
  const groups = [];
  const near = function (a, b) {
    const nx0 = Math.min(a[0], b[0]), ny0 = Math.min(a[1], b[1]);
    const nx1 = Math.max(a[2], b[2]), ny1 = Math.max(a[3], b[3]);
    return (a[0] <= b[2] + PHOTO_MERGE && a[2] >= b[0] - PHOTO_MERGE &&
            a[1] <= b[3] + PHOTO_MERGE && a[3] >= b[1] - PHOTO_MERGE &&
            nx1 - nx0 <= PHOTO_MAX_W && ny1 - ny0 <= PHOTO_MAX_H);
  };
  for (const c of clusters) {
    if (c.area < PHOTO_MIN_AREA) continue;
    const box = [c.minX, c.minY, c.maxX, c.maxY];
    let hit = null;
    for (const g of groups) {
      const tooClose = Math.hypot(c.cx - g.cx, c.cy - g.cy) < PHOTO_MIN_GAP;
      if (near(box, g.bbox) || tooClose) { hit = g; break; }
    }
    if (hit) {
      hit.members.push(c);
      hit.bbox = [Math.min(hit.bbox[0], box[0]), Math.min(hit.bbox[1], box[1]),
                  Math.max(hit.bbox[2], box[2]), Math.max(hit.bbox[3], box[3])];
      hit.area += c.area;
    } else {
      groups.push({ members: [c], bbox: box, area: c.area, cx: c.cx, cy: c.cy });
    }
  }
  /* 合并后可能又能连上，再迭代两轮 */
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < groups.length; i++) {
      for (let j = i + 1; j < groups.length; j++) {
        const a = groups[i], b = groups[j];
        if (near(a.bbox, b.bbox) ||
            Math.hypot(a.cx - b.cx, a.cy - b.cy) < PHOTO_MIN_GAP) {
          a.members = a.members.concat(b.members);
          a.bbox = [Math.min(a.bbox[0], b.bbox[0]), Math.min(a.bbox[1], b.bbox[1]),
                    Math.max(a.bbox[2], b.bbox[2]), Math.max(a.bbox[3], b.bbox[3])];
          a.area += b.area;
          groups.splice(j, 1);
          j--;
        }
      }
    }
  }
  /* 生成游戏要的差异结构：x/y 是提示圈位置（差异最密处），boxes 是判定区域 */
  const diffs = [];
  const density = function (cx, cy) {
    let n = 0;
    for (let y = Math.max(0, cy - 12); y < Math.min(H, cy + 12); y++) {
      for (let x = Math.max(0, cx - 12); x < Math.min(W, cx + 12); x++) {
        if (mask[y * W + x]) n++;
      }
    }
    return n;
  };
  for (const g of groups) {
    const members = g.members.slice().sort(function (a, b) {
      return (b.area * b.strength) - (a.area * a.strength);
    });
    let px = null, py = null, best = -1;
    for (const c of members) {
      const cx = Math.min(Math.max(Math.round(c.cx), 40), W - 40);
      const cy = Math.min(Math.max(Math.round(c.cy), 40), H - 40);
      const v = density(cx, cy);
      if (v > best) { best = v; px = cx; py = cy; }
    }
    if (px === null) { px = 40; py = 40; }
    /* 点位太近的就挪一挪，避免两个提示圈叠在一起 */
    if (diffs.some(function (d) { return Math.hypot(d.x - px, d.y - py) < PHOTO_MIN_GAP; })) {
      let moved = false;
      for (const c of members) {
        const qx = Math.min(Math.max(Math.round(c.cx), 40), W - 40);
        const qy = Math.min(Math.max(Math.round(c.cy), 40), H - 40);
        if (!diffs.some(function (d) { return Math.hypot(d.x - qx, d.y - qy) < PHOTO_MIN_GAP; })) {
          px = qx; py = qy; moved = true; break;
        }
      }
      if (!moved) { continue; }   // 实在放不下才会走到这（极少）
    }
    const boxes = members.map(function (c) {
      return [Math.max(0, c.minX - PHOTO_PAD), Math.max(0, c.minY - PHOTO_PAD),
              Math.min(W - 1, c.maxX + PHOTO_PAD), Math.min(H - 1, c.maxY + PHOTO_PAD)];
    });
    diffs.push({ x: px, y: py, boxes: boxes, area: g.area,
                 desc: photoKind(g), core: best });
  }

  /* 把邻近的小碎点并进最近的差异区域。
   * JPEG 压缩和抗锯齿会在差异边缘留下一两个像素的碎点，肉眼看不见，
   * 但孩子点到那里会被判"错"，体验很糟。这里把离某处差异较近的碎点
   * 一并算进那处差异的判定区域（不会增加差异数量）。 */
  for (const c of clusters) {
    if (c.area >= PHOTO_MIN_AREA) continue;      // 大块已经在上面分组了
    let best = -1, bestD = Infinity;
    for (let i = 0; i < diffs.length; i++) {
      for (const b of diffs[i].boxes) {
        const dx = Math.max(b[0] - c.cx, 0, c.cx - b[2]);
        const dy = Math.max(b[1] - c.cy, 0, c.cy - b[3]);
        const dist = Math.hypot(dx, dy);
        if (dist < bestD) { bestD = dist; best = i; }
      }
    }
    if (best >= 0 && bestD <= 80) {
      diffs[best].boxes.push([Math.max(0, c.minX - PHOTO_PAD), Math.max(0, c.minY - PHOTO_PAD),
                              Math.min(W - 1, c.maxX + PHOTO_PAD), Math.min(H - 1, c.maxY + PHOTO_PAD)]);
    }
  }

  sc._diffs = diffs;
  return diffs;
}

/* 粗判这处差异是哪一类，提示语用（"注意看XX的位置"） */
function photoKind(g) {
  const w = g.bbox[2] - g.bbox[0] + 1, h = g.bbox[3] - g.bbox[1] + 1;
  const fill = g.area / Math.max(1, w * h);
  let strength = 0;
  for (const c of g.members) strength += c.strength * c.area;
  strength = strength / Math.max(1, g.area);
  if (strength > 150) return '颜色不一样';
  if (fill > 0.55 && g.area > 900) return '有东西不见了';
  if (fill < 0.30) return '多了或少了个小东西';
  return '形状不一样';
}

/* 难度越高干扰越多：飘动的碎屑 + 暗角（地狱再加几团飘过的雾光）。
 * 注意 A/B 两版必须逐像素一致，否则它们自己会变成"差异"。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function drawClutter(g, scene) {
  const n = diffCfg().clutter;
  if (!n) return;
  const rnd = mulberry32(((scene && scene.seed) || 1) * 7919 + 13);
  const t = frameTime;                       // A/B 同一帧同一个 t
  const heavy = n >= 20;
  const vig = g.createRadialGradient(IMG_W / 2, IMG_H / 2, IMG_H * 0.30,
                                     IMG_W / 2, IMG_H / 2, IMG_W * 0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,' + (heavy ? 0.30 : 0.16) + ')');
  g.fillStyle = vig;
  g.fillRect(0, 0, IMG_W, IMG_H);
  for (let i = 0; i < n; i++) {
    const x0 = rnd() * IMG_W, y0 = rnd() * IMG_H;
    const r = 2 + rnd() * (heavy ? 7 : 4.5);
    const speed = 5 + rnd() * 12;
    const sway = 10 + rnd() * 16;
    const warm = rnd() < 0.45;
    const x = (x0 + Math.sin(t * 0.6 + i) * sway + IMG_W) % IMG_W;
    const y = (y0 + t * speed) % (IMG_H + 30) - 15;
    g.fillStyle = warm ? 'rgba(255,214,140,.34)' : 'rgba(226,240,255,.30)';
    g.beginPath();
    g.ellipse(x, y, r, r * (warm ? 0.62 : 0.82), (i % 6) * 0.5, 0, Math.PI * 2);
    g.fill();
  }
  if (heavy) {
    for (let i = 0; i < 3; i++) {
      const rr = 70 + i * 18;
      const x = (i * 150 + t * (10 + i * 4)) % (IMG_W + rr * 2) - rr;
      const y = 40 + i * 90 + Math.sin(t * 0.4 + i) * 16;
      const grd = g.createRadialGradient(x, y, 2, x, y, rr);
      grd.addColorStop(0, 'rgba(255,255,255,.16)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill();
    }
  }
}

/* 真图场景的绘制入口（签名与手绘场景一致） */
function photoDraw(scene, g, v) {
  const imgs = PHOTO_IMAGES[scene.key];
  const img = imgs ? (v === 'B' ? imgs.B : imgs.A) : null;
  if (img) {
    g.drawImage(img, 0, 0, IMG_W, IMG_H);
  } else {
    g.fillStyle = '#1b2450'; g.fillRect(0, 0, IMG_W, IMG_H);
    g.fillStyle = '#9db4d8';
    g.font = '600 20px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(PHOTO_FAILED[scene.key] ? '图片加载失败' : '图片加载中…', IMG_W / 2, IMG_H / 2);
  }
  drawClutter(g, scene);
}

/* ---------------- 关卡顺序（每局随机） ----------------
 * 以前 48 个场景永远按固定顺序出题，孩子玩两遍就记住了"下一关是哪个"，
 * 靠记忆而不是靠观察，难度直线下降。现在改成：每次开局（含"再玩一次"）
 * 用 Fisher-Yates 把整份场景洗牌一次，本局的出题顺序存在 LEVELS 里。
 * 游戏逻辑一律通过 curScene() 取当前关卡场景，不要再直接按下标取 SCENES。 */
let LEVELS = SCENES.slice();
function shuffleLevels() {
  LEVELS = scenePool().slice();          // 换难度 = 换整个关卡池
  for (let i = LEVELS.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = LEVELS[i]; LEVELS[i] = LEVELS[j]; LEVELS[j] = t;
  }
}
function curScene() { return LEVELS[level - 1]; }

/* ---------------- 状态 ---------------- */
let state = STATE.START;
let level = 1, foundCount = 0, foundFlags = [0,0,0,0,0];
let hintTotal = 0, wrongTotal = 0;
let hintFlash = -1, hintUntil = 0;                // 提示闪烁的差异索引/截止时间
let marks = [];                                   // 已找到标记 [{x,y,anim}]
let fireworks = [];                               // 庆祝烟花粒子
let shake = 0;                                    // 点错轻摇强度
let cheerTimer = -1;
let stageTop = { x: 0, y: 0, w: 0, h: 0 };         // 左图画区（原图 A）
let stageBot = { x: 0, y: 0, w: 0, h: 0 };         // 右图画区（找茬图 B）

function layout() {
  /* 两幅图左右并排（各保持 4:3），中间一条竖线隔开，上下留 HUD 空间 */
  const SPLIT_W = 16;                                  // 中缝宽（含竖线）
  const marginX = Math.min(40, W * 0.04);
  const iw = Math.max(60, (W - marginX * 2 - SPLIT_W) / 2);   // 兜底防负宽
  const ih = iw * IMG_H / IMG_W;
  const maxH = Math.max(120, H - 200);                 // 给 HUD/按钮留空间
  let topY = Math.max(86, (H - ih) / 2 + 10);
  let drawW = iw, drawH = ih;
  if (ih > maxH) {                                     // 竖屏兜底：按高度缩小
    drawH = maxH;
    drawW = drawH * IMG_W / IMG_H;
    topY = Math.max(86, (H - drawH) / 2 + 10);
  }
  const leftX = marginX + (iw - drawW) / 2;            // 缩小后保持居中
  stageTop = { x: leftX, y: topY, w: drawW, h: drawH };                  // 左图（原图 A）
  stageBot = { x: leftX + drawW + SPLIT_W, y: topY, w: drawW, h: drawH }; // 右图（找茬图 B）
}
resize();

/* ---------------- 语音播报 ---------------- */
const synth = window.speechSynthesis || null;
let zhVoice = null, muted = false;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) ||
            vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) {
  pickVoice();
  synth.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (muted || !synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.92;
    synth.speak(u);
  } catch (e) { /* 忽略 */ }
}
const voiceBar = $('voiceBar');
let voiceTimer = null;
function say(text) {
  voiceBar.textContent = text;
  voiceBar.classList.remove('hide');
  if (voiceTimer) clearTimeout(voiceTimer);
  voiceTimer = setTimeout(() => voiceBar.classList.add('hide'), 3600);
  speak(text);
}

/* ---------------- 音效 ---------------- */
let actx = null;
function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
}
function beep(freq, dur, type, vol, sweepTo) {
  if (!actx || muted) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start();
    o.stop(actx.currentTime + dur);
  } catch (e) { /* 忽略 */ }
}
const sfxRight  = () => { beep(660, .09, 'sine', .16); beep(990, .14, 'sine', .16); };
const sfxWrong  = () => beep(180, .3, 'sawtooth', .12, 120);   // 嗡声
const sfxHint   = () => beep(880, .12, 'sine', .12, 1100);
const sfxCheer  = () => { beep(523, .12, 'sine', .14); beep(659, .12, 'sine', .14); beep(784, .2, 'sine', .16); };
const sfxPop    = () => { beep(1200, .18, 'triangle', .16); beep(500, .2, 'sine', .14, 300); };

$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (muted && synth) synth.cancel();
});

/* ---------------- HUD / Toast ---------------- */
function updateHUD() {
  $('hudLevel').textContent = String(level);
  $('hudTotalLevel').textContent = String(totalLevels());
  $('hudFound').textContent = String(foundCount);
  $('hudTotal').textContent = String(spotsOf());
  $('hudHints').textContent = String(hintTotal);
}
let toastTimer = null;

/* ---------------- 关卡流程 ---------------- */
const PRAISES = ['太棒了', '好厉害', '真不错', '顶呱呱', '火眼金睛'];

function startLevel() {
  /* 真图关卡：开局先让游戏自己比对 A/B 两张图，算出差异在哪 */
  const sc0 = curScene();
  if (diffCfg().photo && sc0 && !sc0._diffs) {
    const d = computePhotoDiffs(sc0);
    if (d) sc0.diffs = d;
  }
  foundCount = 0;
  foundFlags = new Array(spotsOf()).fill(0);
  marks = [];
  fireworks = [];
  hintFlash = -1;
  hintUntil = 0;
  shake = 0;
  cheerTimer = -1;
  state = STATE.RUNNING;
  updateHUD();
  updateDiffBar();          // 进游戏就收起难度按钮
  say(`第 ${level} 关 ${curScene().name}，找出 ${spotsOf()} 处不同吧！`);
}

function hitDiff(i) {
  if (state !== STATE.RUNNING || foundFlags[i]) return false;
  const d = curScene().diffs[i];
  foundFlags[i] = 1;
  foundCount++;
  marks.push({ x: d.x, y: d.y, anim: 0 });
  sfxRight();
  sfxPop();
  const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  toast(`${praise}！找到${d.desc}`, true);
  say(`${praise}！找到了${d.desc}`);
  updateHUD();
  if (foundCount >= spotsOf()) {
    cheerTimer = CHEER_TIME;
    state = STATE.LEVEL_UP;
    sfxCheer();
    spawnFireworks();
    const last = level >= totalLevels();
    toast(last ? '🎉 全部通关啦！' : '🎉 本关找齐啦！', true);
    say(last ? `太厉害了！${totalLevels()} 关全部通关！` : `${curScene().name}找齐啦！真棒！`);
  }
  return true;
}

/* 差异点判定半径
 * - 统一用 HIT_R（40px），比成人向找不同游戏宽，照顾幼儿手指粗、点不准
 * - 不再"越靠边圈越大"：那样会让相邻两个差异的判定圈大量重叠，
 *   孩子明明点在 A 上却被判成点了 B（实测 21 处出现这种"抢命中"）
 * - 半径也不越过画布边界，保证判定圈完整落在图内 */
function hitRadiusFor(d) {
  const edgeX = Math.min(d.x, IMG_W - d.x);
  const edgeY = Math.min(d.y, IMG_H - d.y);
  return Math.max(HIT_R_MIN, Math.min(HIT_R, Math.min(edgeX, edgeY)));
}

function clickStage(gx, gy) {
  /* gx/gy 是 400×300 图内坐标 */
  if (state !== STATE.RUNNING) return false;
  const scene = curScene();

  /* ① 区域判定：真图关卡的一处变化往往占很大一片（比如整栋楼换了颜色、
   *    一堆木板变了色），点在这块区域里的任何位置都应该算找到，
   *    不能只认一个点 —— 否则孩子明明点对了却判错。
   *    多块区域重叠时，取中心离点击最近的那一处。 */
  let regionBest = -1, regionDist = Infinity;
  for (let i = 0; i < scene.diffs.length; i++) {
    if (foundFlags[i]) continue;
    const d = scene.diffs[i];
    if (!d.boxes) continue;
    /* 容差 14px：小朋友瞄不准，点在物体边上一点也该算对。
     * 差异区域本身是离线按像素检测出来的，放宽这点不会误判别的地方。 */
    for (const b of d.boxes) {
      if (gx >= b[0] - 14 && gx <= b[2] + 14 && gy >= b[1] - 14 && gy <= b[3] + 14) {
        const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
        const dist = (gx - cx) * (gx - cx) + (gy - cy) * (gy - cy);
        if (dist < regionDist) { regionDist = dist; regionBest = i; }
      }
    }
  }
  if (regionBest >= 0) return hitDiff(regionBest);

  /* ② 点位判定：在所有未找到的差异里，挑"点击点落在判定圈内、且离点击最近"的那一个。
   * 用归一化距离（d²/r²）比较，判定圈大的点不会被判定圈小的点抢走。 */
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < scene.diffs.length; i++) {
    if (foundFlags[i]) continue;
    const d = scene.diffs[i];
    const r = hitRadiusFor(d);
    const dx = gx - d.x, dy = gy - d.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) continue;                 // 不在这个点的判定圈里
    const score = d2 / (r * r);               // 0 = 正中，1 = 擦边
    if (score < bestScore) { bestScore = score; best = i; }
  }
  if (best >= 0) return hitDiff(best);
  /* 点错：轻摇 + 嗡声（无惩罚） */
  wrongTotal++;
  shake = 1;
  sfxWrong();
  toast('再找找看，眼睛擦亮一点', false);
  say('这里一样哦，再仔细看看');
  return false;
}

canvas.addEventListener('pointerdown', e => {
  if (state !== STATE.RUNNING) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  /* 左右两幅图都可以点：哪幅命中就用哪幅的坐标 */
  for (const s of [stageTop, stageBot]) {
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
      const gx = (x - s.x) / s.w * IMG_W;
      const gy = (y - s.y) / s.h * IMG_H;
      clickStage(gx, gy);
      return;
    }
  }
});

/* ---------------- 提示 ---------------- */
$('btnHint').addEventListener('click', () => {
  if (state !== STATE.RUNNING) return;
  const scene = curScene();
  const candidates = [];
  for (let i = 0; i < scene.diffs.length; i++) if (!foundFlags[i]) candidates.push(i);
  if (!candidates.length) return;
  hintTotal++;
  hintFlash = candidates[Math.floor(Math.random() * candidates.length)];
  /* 与主循环的 t（rAF 时间轴，秒）保持一致，否则提示会一闪而过或一直亮着 */
  hintUntil = nowSeconds() + HINT_TIME;
  sfxHint();
  say(`提示来啦，注意看${scene.diffs[hintFlash].desc}的位置`);
  updateHUD();
});

/* ---------------- 烟花庆祝 ---------------- */
function spawnFireworks() {
  const colors = ['#ffd35c', '#ff6b6b', '#7dffa1', '#5cc8ff', '#ff9c5c'];
  for (let k = 0; k < 3; k++) {
    const fx = stageBot.x + stageBot.w * (0.25 + 0.25 * k);
    const fy = stageBot.y + stageBot.h * (0.3 + 0.2 * ((k % 2)));
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      fireworks.push({ x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, color: colors[(k + i) % colors.length], size: 2.5 + Math.random() * 2.5 });
    }
  }
}

/* ---------------- 差异绘制通用小件 ---------------- */
function ballAt(g, x, y, r, colors) {
  const grad = g.createRadialGradient(x - r*0.3, y - r*0.3, r*0.1, x, y, r*1.1);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(1, colors[1]);
  g.fillStyle = grad;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
}
function drawStar(g, cx, cy, r, color) {
  g.fillStyle = color;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r;
    const a = -Math.PI/2 + i * Math.PI/5;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath(); g.fill();
}

/* ================= 场景 1：公园 ================= */
function drawPark(g, v) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);
  grad.addColorStop(0, '#8ed8f8');
  grad.addColorStop(1, '#d8f4ff');
  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(80, 42, 42, 15, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(120, 50, 30, 12, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(300, 36, 46, 16, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#7ec850';
  g.fillRect(0, 232, IMG_W, 68);
  g.fillStyle = '#6db845';
  for (let i = 0; i < IMG_W; i += 18) g.fillRect(i, 232, 9, 4);
  /* 太阳 */
  ballAt(g, 352, 40, 22, ['#fff3b0', '#ffd35c']);
  /* 左树 */
  g.fillStyle = '#8a5a2b'; g.fillRect(46, 168, 12, 66);
  ballAt(g, 52, 150, 34, ['#8fe08f', '#4fae4f']);
  ballAt(g, 30, 172, 22, ['#8fe08f', '#4fae4f']);
  ballAt(g, 74, 172, 22, ['#8fe08f', '#4fae4f']);
  /* D5 树上苹果：A=3 个 / B=4 个（都画在树冠靠中位置，避免贴边难点） */
  /* A 版本 3 颗；B 版本在最上方多出第 4 颗（差异点就指这一颗） */
  const apples = v === 'A' ? [[50,168],[66,158],[48,146]] : [[50,168],[66,158],[48,146],[72,144]];
  for (const p of apples) ballAt(g, p[0], p[1], 6, ['#ff9f7f', '#e8403a']);
  /* 右树（无差异，纯装饰） */
  g.fillStyle = '#8a5a2b'; g.fillRect(340, 160, 12, 74);
  ballAt(g, 346, 142, 32, ['#8fe08f', '#4fae4f']);
  ballAt(g, 324, 166, 20, ['#8fe08f', '#4fae4f']);
  ballAt(g, 368, 166, 20, ['#8fe08f', '#4fae4f']);
  /* D1 左下皮球：A 有 / B 无（上移离开底边，方便点击） */
  if (v === 'A') {
    ballAt(g, 68, 214, 14, ['#ffd0d0', '#e8403a']);
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    g.beginPath(); g.arc(68, 214, 7, 0, Math.PI*2); g.stroke();
  } else {
    g.fillStyle = '#7ec850';
    g.beginPath(); g.ellipse(68, 220, 16, 5, 0, 0, Math.PI*2); g.fill();
  }
  /* D2 右下花丛颜色：A 红花 / B 黄花 */
  for (let i = 0; i < 5; i++) {
    const fx = 300 + i * 12, fy = 206 + (i % 2) * 8;
    ballAt(g, fx, fy, 7, v === 'A' ? ['#ffb0c0', '#e83a6a'] : ['#fff0b0', '#e8b820']);
    g.fillStyle = '#4fae4f';
    g.fillRect(fx - 1, fy + 6, 2, 8);
  }
  /* D3 秋千：A 座板宽 / B 座板窄 */
  g.strokeStyle = '#6b4a2b'; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(150, 80); g.lineTo(200, 176); g.moveTo(250, 80); g.lineTo(200, 176);
  g.stroke();
  g.strokeStyle = '#5a3a1e'; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(172, 118); g.lineTo(172, 176); g.moveTo(228, 118); g.lineTo(228, 176);
  g.stroke();
  g.fillStyle = '#c98a4b';
  g.fillRect(200 - (v === 'A' ? 34 : 16), 176, v === 'A' ? 68 : 32, 10);
  /* 秋千架子 */
  g.strokeStyle = '#8a5a2b'; g.lineWidth = 6;
  g.beginPath();
  g.moveTo(140, 232); g.lineTo(150, 80); g.lineTo(250, 80); g.lineTo(260, 232);
  g.stroke();
  /* D4 左上风筝：A 有 / B 无 */
  if (v === 'A') {
    g.save();
    g.translate(118, 92); g.rotate(0.5);
    g.fillStyle = '#ff8f5c';
    g.beginPath();
    g.moveTo(0, -16); g.lineTo(12, 0); g.lineTo(0, 16); g.lineTo(-12, 0);

    g.strokeStyle = '#666'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(0, 16); g.lineTo(0, 40); g.stroke();

}

/* ================= 场景 2：海底 ================= */

  /* D4 右上气泡：A 大 / B 小 */

  g.beginPath(); g.arc(246, 110, br * 0.45, 0, Math.PI*2); g.stroke();

/* ================= 场景 3：太空 ================= */
function drawSpace(g, v) {
  g.fillStyle = '#070c2a';
  g.fillRect(0, 0, IMG_W, IMG_H);
  /* 遥远小星星（固定伪随机） */
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 40; i++) {
    const sx = rnd() * IMG_W, sy = rnd() * IMG_H, sr = rnd() * 1.3 + 0.4;
    g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI*2); g.fill();
  }
  /* D1 左上飞碟：A 有 / B 无 */
  if (v === 'A') {
    ballAt(g, 76, 66, 10, ['#c0e8ff', '#5aa0e8']);
    g.fillStyle = '#b8b8c8';
    g.beginPath(); g.ellipse(76, 74, 26, 8, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#5cff8a';
    g.beginPath(); g.arc(62, 74, 3, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(90, 74, 3, 0, Math.PI*2); g.fill();
  } else {
    drawStar(g, 76, 66, 8, '#fff');
  }
  /* D2 右上行星环：A 有 / B 无 */
  ballAt(g, 322, 78, 26, ['#ffd8a0', '#e8944a']);
  if (v === 'A') {
    g.strokeStyle = '#d8b8f8'; g.lineWidth = 5;
    g.save();
    g.translate(322, 78); g.rotate(-0.35);
    g.beginPath(); g.ellipse(0, 0, 42, 12, 0, 0, Math.PI*2); g.stroke();
    g.restore();
  }
  /* D3 火箭颜色：红 / 紫 */
  const rc = v === 'A' ? ['#ff9f9f', '#e8403a'] : ['#d0b0ff', '#7a4fe0'];
  g.save();
  g.translate(196, 150);
  g.fillStyle = rc[1];
  g.beginPath();
  g.moveTo(0, -46); g.quadraticCurveTo(16, -18, 14, 24);
  g.lineTo(-14, 24); g.quadraticCurveTo(-16, -18, 0, -46);
  g.closePath(); g.fill();
  g.fillStyle = rc[0];
  g.fillRect(-14, 8, 28, 10);
  ballAt(g, 0, -10, 7, ['#c0e8ff', '#7fd4ff']);
  g.fillStyle = '#ff9c5c';
  g.beginPath(); g.moveTo(-14, 12); g.lineTo(-30, 30); g.lineTo(-14, 24); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(14, 12); g.lineTo(30, 30); g.lineTo(14, 24); g.closePath(); g.fill();
  g.fillStyle = '#ffd35c';
  g.beginPath(); g.moveTo(-6, 24); g.lineTo(0, 42); g.lineTo(6, 24); g.closePath(); g.fill();
  g.restore();
  /* D4 右下星星：A 4 颗 / B 3 颗 */
  const starPos = [[268, 190], [292, 212], [310, 182], [270, 222]];
  const starN = v === 'A' ? 4 : 3;
  for (let i = 0; i < starN; i++) drawStar(g, starPos[i][0], starPos[i][1], 9, '#ffd35c');
  /* D5 左下宇航员大小：A 大 / B 小 */
  const as = v === 'A' ? 1.5 : 0.9;
  g.save();
  g.translate(118, 222); g.scale(as, as);
  ballAt(g, 0, -18, 12, ['#f0f0f8', '#c8c8d8']);   // 头盔
  ballAt(g, 2, -19, 7, ['#9fe8ff', '#5ac8f0']);   // 面罩
  g.fillStyle = '#f0f0f8';
  g.beginPath(); g.ellipse(0, 4, 10, 13, 0, 0, Math.PI*2); g.fill();   // 身体
  g.fillStyle = '#4f8cff';
  g.fillRect(-10, -6, 20, 6);
  g.fillStyle = '#e8e8f0';
  g.beginPath(); g.ellipse(-13, 2, 5, 9, 0.4, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(13, 2, 5, 9, -0.4, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(-5, 18, 5, 7, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(5, 18, 5, 7, 0, 0, Math.PI*2); g.fill();
  g.restore();
  /* 陨石装饰 */
  ballAt(g, 46, 160, 10, ['#c8a888', '#8a6a5a']);
  ballAt(g, 368, 190, 8, ['#c8a888', '#8a6a5a']);
}

/* ================= 场景 4：糖果城 ================= */
function drawCandy(g, v) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);

  grad.addColorStop(1, '#fff2fa');

  g.fillRect(0, 0, IMG_W, IMG_H);

  g.fillStyle = '#f0b8d8';
  g.beginPath();
  g.moveTo(0, 232); g.quadraticCurveTo(70, 180, 140, 232);
  g.quadraticCurveTo(210, 176, 280, 232);
  g.quadraticCurveTo(340, 186, IMG_W, 232);
  g.lineTo(IMG_W, IMG_H); g.lineTo(0, IMG_H); g.closePath(); g.fill();
  /* 巧克力地面 */
  g.fillStyle = '#a8703f';
  g.fillRect(0, 246, IMG_W, 54);

  for (let i = 0; i < IMG_W; i += 26) g.fillRect(i, 246, 14, 5);

  g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(72, 74); g.lineTo(72, 96); g.stroke();
  ballAt(g, 72, 60, 15, lc);
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 4;
  g.beginPath();
  for (let a = 0; a < Math.PI * 4; a += 0.1) {
    const r = 2 + (a / (Math.PI * 4)) * 11;
    const px = 72 + Math.cos(a) * r, py = 60 + Math.sin(a) * r;
    a === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
  }
  g.stroke();
  /* D2 右上彩虹：A 7 道 / B 5 道 */
  const rainbow = ['#e8403a', '#f0942a', '#ffd35c', '#5cd85c', '#5cc8ff', '#5a5ae8', '#a05ce8'];

    g.lineWidth = 6;
    g.beginPath();
    g.arc(326, 150, 84 - i * 6, Math.PI, 0);
    g.stroke();

  /* 云朵压住彩虹两端底部 */
  g.fillStyle = '#fff';

  g.beginPath(); g.ellipse(410, 148, 18, 10, 0, 0, Math.PI*2); g.fill();
  /* D3 中央姜饼人：A 有 / B 无 */
  if (v === 'A') {
    g.fillStyle = '#c98a4b';
    g.beginPath(); g.arc(200, 128, 16, 0, Math.PI*2); g.fill();     // 头
    g.beginPath(); g.ellipse(200, 158, 14, 18, 0, 0, Math.PI*2); g.fill();  // 身
    g.beginPath(); g.ellipse(180, 154, 6, 12, 0.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(220, 154, 6, 12, -0.6, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(192, 186, 6, 11, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(208, 186, 6, 11, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(194, 124, 2.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(206, 124, 2.5, 0, Math.PI*2); g.fill();
    g.fillStyle = '#e8403a';
    g.beginPath(); g.arc(200, 133, 3, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(200, 150, 2.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(195, 162, 2.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(205, 162, 2.5, 0, Math.PI*2); g.fill();
  } else {
    /* 无姜饼人：放一颗薄荷糖 */
    ballAt(g, 200, 150, 14, ['#e0f8e0', '#a0e0a0']);
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    g.beginPath(); g.arc(200, 150, 9, 0, Math.PI*2); g.stroke();
  }
  /* D4 右下杯子蛋糕大小：A 大 / B 小 */
  const ck = v === 'A' ? 1.3 : 0.7;
  g.save();
  g.translate(298, 232); g.scale(ck, ck);
  g.fillStyle = '#f0a8c8';
  g.beginPath();
  g.moveTo(-16, 0); g.lineTo(16, 0); g.lineTo(12, 18); g.lineTo(-12, 18);
  g.closePath(); g.fill();
  g.fillStyle = '#fff0f8';
  g.beginPath();
  g.moveTo(-18, 0);
  g.quadraticCurveTo(-14, -22, 0, -16);
  g.quadraticCurveTo(14, -24, 18, 0);
  g.closePath(); g.fill();
  ballAt(g, 0, -22, 5, ['#ffd0d0', '#e8403a']);
  g.restore();
  /* D5 左下散糖：A 3 颗 / B 2 颗（整体上移，远离底边） */
  const dropPos = [[112, 228], [140, 238], [126, 246]];
  const dropN = v === 'A' ? 3 : 2;
  const dropC = [['#c0e8ff', '#4f8cff'], ['#ffe0f0', '#e87ab8'], ['#e0ffd0', '#5cb858']];
  for (let i = 0; i < dropN; i++) ballAt(g, dropPos[i][0], dropPos[i][1], 8, dropC[i]);
  /* 房子装饰 */
  g.fillStyle = '#fff';
  g.fillRect(34, 90, 4, 24); g.fillRect(30, 86, 12, 6);
  g.fillStyle = '#f06a90';
  g.beginPath(); g.ellipse(36, 120, 16, 20, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#e8b040';
  g.beginPath(); g.rect(354, 204, 26, 42); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(367, 204, 13, Math.PI, 0); g.fill();
}

/* ================= 场景 5：农场 ================= */
function drawFarm(g, v) {

  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);

  g.fillStyle = '#8ed86a';

  for (let i = 0; i < IMG_W; i += 20) g.fillRect(i, 226, 10, 4);

    g.fillRect(58, 90, 8, 6);

    g.strokeStyle = '#222'; g.lineWidth = 2;

  g.fillStyle = '#d86a4a';
  g.beginPath(); g.rect(300, 150, 64, 50); g.fill();

  g.beginPath();
  g.moveTo(296, 150); g.lineTo(332, 122); g.lineTo(368, 150);
  g.closePath(); g.fill();
  g.fillStyle = '#f4e6c8';
  g.beginPath(); g.rect(322, 168, 20, 32); g.fill();

    g.closePath(); g.fill();
    g.restore();
  }
  g.restore();
  /* D3 小鸡：A 3 只 / B 2 只 */
  const chickN = v === 'A' ? 3 : 2;
  for (let i = 0; i < chickN; i++) {
    const cx = 170 + i * 26, cy = 216 + (i % 2) * 6;

    g.beginPath(); g.moveTo(cx + 7, cy); g.lineTo(cx + 13, cy + 2); g.lineTo(cx + 7, cy + 4); g.closePath(); g.fill();
    g.fillStyle = '#1b1b33';
    g.beginPath(); g.arc(cx + 3, cy - 2, 1.5, 0, Math.PI*2); g.fill();
  }
  /* D4 干草堆大小：A 大 / B 小 */
  const hs = v === 'A' ? 1.3 : 0.7;

  g.translate(118, 150); g.scale(hs, hs);
  g.fillStyle = '#e8c860';
  g.beginPath();
  g.moveTo(-30, 26); g.quadraticCurveTo(0, -34, 30, 26);
  g.closePath(); g.fill();
  g.strokeStyle = '#c8a030'; g.lineWidth = 2;
  for (let k = -1; k <= 1; k++) {
    g.beginPath();
    g.moveTo(-24, 18 + k * 6); g.quadraticCurveTo(0, -14 + k * 6, 24, 18 + k * 6);
    g.stroke();
  }
  g.restore();
  /* D5 右下南瓜：A 有 / B 无（上移离开底边） */
  if (v === 'A') {
    ballAt(g, 268, 242, 17, ['#ffb070', '#e88020']);
    ballAt(g, 252, 240, 13, ['#ffb070', '#e88020']);
    g.fillStyle = '#4fae4f';
    g.fillRect(266, 222, 4, 8);
  }
  /* 栅栏装饰 */
  g.strokeStyle = '#a87848'; g.lineWidth = 4;
  for (let fx = 20; fx <= 90; fx += 18) {
    g.beginPath(); g.moveTo(fx, 244); g.lineTo(fx, 272); g.stroke();
  }
  g.beginPath(); g.moveTo(16, 252); g.lineTo(94, 252); g.stroke();
}

/* ================= 场景 6：雪地 ================= */
function drawSnow(g, v) {

  g.fillStyle = '#f4faFF';
  g.beginPath();
  g.moveTo(0, 226); g.quadraticCurveTo(100, 210, 200, 226);
  g.quadraticCurveTo(300, 242, IMG_W, 222);
  g.lineTo(IMG_W, IMG_H); g.lineTo(0, IMG_H); g.closePath(); g.fill();
  /* D1 雪人围巾颜色：红 / 绿 */
  const scarfC = v === 'A' ? '#e8403a' : '#30a830';
  ballAt(g, 70, 98, 22, ['#ffffff', '#dceaf6']);
  ballAt(g, 70, 142, 30, ['#ffffff', '#dceaf6']);
  g.fillStyle = '#1b1b33';
  g.beginPath(); g.arc(63, 92, 2.5, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(77, 92, 2.5, 0, Math.PI*2); g.fill();
  g.fillStyle = '#f0a020';
  g.beginPath(); g.moveTo(66, 102); g.lineTo(74, 102); g.lineTo(70, 108); g.closePath(); g.fill();
  g.fillStyle = scarfC;
  g.fillRect(50, 112, 40, 8);
  g.fillRect(78, 112, 10, 26);
  /* D2 右上雪花：4 vs 3 */
  const snowPos = [[296, 60], [330, 84], [352, 52], [310, 108]];
  const snowN = v === 'A' ? 4 : 3;
  g.fillStyle = '#ffffff';
  for (let i = 0; i < snowN; i++) {
    const sp = snowPos[i];
    g.strokeStyle = '#ffffff'; g.lineWidth = 2.5; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(sp[0] - 7, sp[1]); g.lineTo(sp[0] + 7, sp[1]);

    g.fillStyle = '#c88848';
    g.beginPath();
    g.moveTo(px - 20, py); g.quadraticCurveTo(px, py - 12, px + 20, py - 2);

    g.closePath(); g.fill();
    ballAt(g, px + 14, py - 4, 5, ['#e8a868', '#c88848']);
  }
  /* D4 左下恐龙蛋：A 有 / B 无（上移离开底边） */
  if (v === 'A') {
    g.fillStyle = '#f0e0c0';
    g.beginPath(); g.ellipse(124, 230, 13, 17, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#d8c090'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(124, 230, 13, 17, 0, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(116, 224); g.quadraticCurveTo(124, 230, 132, 224); g.stroke();
    g.beginPath(); g.moveTo(115, 234); g.quadraticCurveTo(124, 238, 133, 234); g.stroke();
  } else {
    g.fillStyle = '#c8a878';
    g.beginPath(); g.ellipse(124, 236, 20, 8, 0, 0, Math.PI*2); g.fill();
  }
  /* D5 右下脚印：A 3 个 / B 2 个（上移离开底边） */
  const fpN = v === 'A' ? 3 : 2;
  for (let i = 0; i < fpN; i++) {
    const fx = 268 + i * 24, fy = 228 + (i % 2) * 12;
    g.fillStyle = '#b89868';
    g.beginPath(); g.ellipse(fx, fy, 9, 7, 0, 0, Math.PI*2); g.fill();
    for (let k = -1; k <= 1; k++) {
      g.beginPath(); g.arc(fx + k * 5, fy - 8, 2.5, 0, Math.PI*2); g.fill();
    }
  }
  /* 蕨类装饰 */
  g.strokeStyle = '#6aa858'; g.lineWidth = 3; g.lineCap = 'round';
  for (const fx of [30, 370]) {
    g.beginPath();
    g.moveTo(fx, 262); g.quadraticCurveTo(fx + 6, 240, fx, 222);

}

/* ================= 场景 16：湖泊 ================= */
function drawLake(g, v) {

    g.fillStyle = '#5a9ae8';
    g.beginPath(); g.ellipse(dx + 4, dy, 8, 3, 0, 0, Math.PI*2); g.fill();
    ballAt(g, dx + 12, dy, 3.5, ['#7ecdf4', '#3a6ae8']);

  g.closePath(); g.fill();
  g.strokeStyle = '#8a6238'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(322, 158); g.lineTo(322, 106); g.stroke();
  const sailC = v === 'A' ? '#e8403a' : '#f0c040';

  g.beginPath();
  g.moveTo(322, 108); g.lineTo(322, 152); g.lineTo(298, 152);

  g.fillStyle = '#fff';
  g.beginPath();
  g.moveTo(322, 112); g.lineTo(322, 152); g.lineTo(342, 152);
  g.closePath(); g.fill();
  /* D3 中央鸭妈妈：A 有 / B 无
   * 注意：小鸭子 / 水纹 / 睡莲三样**两版都要画**。以前它们一半画在 A 分支里，
   * 结果 A 版的小鸭子一直排到 x=124，离差异点 (200,150) 有 76px —— 孩子点了那只
   * 明显"少了一只"的小鸭子，判定圈却够不着，被判成点错（见 tools/spot-diff-scene-check.mjs）。 */
  g.fillStyle = '#5cb858';

    g.beginPath(); g.moveTo(214, 138); g.lineTo(223, 140); g.lineTo(214, 143); g.closePath(); g.fill();
    g.fillStyle = '#1b1b33';

  /* D4 左下荷花：A 有 / B 无（上移离开底边） */

    g.beginPath(); g.ellipse(126, 246, 26, 10, 0, 0, Math.PI*2); g.fill();

      g.restore();
    }
    g.fillStyle = '#e87ab0';
    ballAt(g, 126, 232, 4, ['#ffd0e0', '#e860a0']);
  } else {
    g.fillStyle = '#5cb858';
    g.beginPath(); g.ellipse(126, 246, 26, 10, 0, 0, Math.PI*2); g.fill();
  }
  /* D5 右下青蛙：A 有 / B 无（上移离开底边） */

    g.fillStyle = '#5cb858';
    g.beginPath(); g.ellipse(292, 238, 15, 11, 0, 0, Math.PI*2); g.fill();
    ballAt(g, 286, 228, 6, ['#8ee088', '#5cb858']);
    ballAt(g, 298, 228, 6, ['#8ee088', '#5cb858']);
    g.fillStyle = '#1b1b33';
    g.beginPath(); g.arc(286, 228, 2.5, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(298, 228, 2.5, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#4a9a48'; g.lineWidth = 3.5;
    g.beginPath();
    g.moveTo(280, 244); g.lineTo(272, 250);
    g.moveTo(304, 244); g.lineTo(312, 250);
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(292, 250, 18, 4, 0, 0, Math.PI*2); g.stroke();
  } else {
    g.fillStyle = '#4aa848';
    g.beginPath(); g.ellipse(292, 244, 20, 8, 0, 0, Math.PI*2); g.fill();
  }
}

/* ================= 场景 17：万圣节 ================= */
function drawHalloween(g, v) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);
  grad.addColorStop(0, '#2a1a3a');
  grad.addColorStop(1, '#3d2a52');
  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);
  /* 背景星星（固定伪随机） */
  let seed = 41;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = 'rgba(255,255,255,.45)';
  for (let i = 0; i < 40; i++) {
    const sx = rnd() * IMG_W, sy = rnd() * IMG_H, sr = rnd() * 1.2 + 0.3;
    g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI*2); g.fill();
  }
  /* 地面 */
  g.fillStyle = '#2a2040';
  g.beginPath();
  g.moveTo(0, 234); g.quadraticCurveTo(200, 220, IMG_W, 232);
  g.lineTo(IMG_W, IMG_H); g.lineTo(0, IMG_H); g.closePath(); g.fill();
  /* D1 左上蝙蝠：A 3 只 / B 2 只 */
  const batN = v === 'A' ? 3 : 2;
  for (let i = 0; i < batN; i++) {
    const bx = 48 + i * 24, by = 82 + (i % 2) * 14;
    g.fillStyle = '#1a1228';
    g.beginPath();
    g.moveTo(bx, by);
    g.quadraticCurveTo(bx - 10, by - 8, bx - 14, by - 2);
    g.quadraticCurveTo(bx - 8, by - 1, bx - 6, by + 3);
    g.quadraticCurveTo(bx - 2, by, bx, by + 2);
    g.quadraticCurveTo(bx + 2, by, bx + 6, by + 3);
    g.quadraticCurveTo(bx + 8, by - 1, bx + 14, by - 2);
    g.quadraticCurveTo(bx + 10, by - 8, bx, by);
    g.closePath(); g.fill();
    ballAt(g, bx, by - 1, 3, ['#2a2238', '#1a1228']);
  }
  /* D2 右上月亮：黄 / 橙 */
  const moonC = v === 'A' ? ['#fff3c0', '#ffe08a'] : ['#ffd8a0', '#ff9c4a'];
  ballAt(g, 322, 88, 22, moonC);
  /* D3 中央南瓜脸：A 有 / B 无 */
  g.fillStyle = '#f0a030';
  g.beginPath(); g.ellipse(200, 200, 30, 25, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#d88820';
  for (const lx of [186, 200, 214]) {
    g.beginPath(); g.ellipse(lx, 200, 3, 25, 0, 0, Math.PI*2); g.fill();
  }
  g.fillStyle = '#7a5a2a';
  g.fillRect(197, 168, 6, 10);
  g.strokeStyle = '#5a7a3a'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(200, 168); g.quadraticCurveTo(208, 158, 214, 162); g.stroke();
  if (v === 'A') {
    /* 三角眼 + 锯齿嘴 */
    g.fillStyle = '#3a2010';
    g.beginPath(); g.moveTo(184, 192); g.lineTo(194, 192); g.lineTo(189, 200); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(206, 192); g.lineTo(216, 192); g.lineTo(211, 200); g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(182, 210); g.lineTo(190, 216); g.lineTo(196, 210);
    g.lineTo(204, 216); g.lineTo(210, 210); g.lineTo(218, 216);
    g.lineTo(218, 220); g.lineTo(182, 220);
    g.closePath(); g.fill();
  } else {
    /* 无脸：只有轮廓南瓜 */
    g.strokeStyle = '#c87818'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(189, 196, 4, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.arc(211, 196, 4, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.arc(200, 212, 7, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  }
  /* 枯树装饰 */
  g.strokeStyle = '#1a1228'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(60, 260); g.lineTo(60, 180);
  g.moveTo(60, 210); g.lineTo(42, 186);
  g.moveTo(60, 220); g.lineTo(80, 198);
  g.moveTo(60, 200); g.lineTo(50, 174);
  g.stroke();
  /* D4 左下糖果：A 3 颗 / B 2 颗（上移离开底边） */
  const candyC = [['#ff9f9f', '#e8403a'], ['#a0c8ff', '#3a6ae8'], ['#ffe89f', '#f0a820']];
  const candyN = v === 'A' ? 3 : 2;
  for (let i = 0; i < candyN; i++) {
    const cx = 108 + i * 18, cy = 232 + (i % 2) * 10;
    ballAt(g, cx, cy, 7, candyC[i]);
    g.strokeStyle = candyC[i][1]; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(cx - 6, cy - 3); g.lineTo(cx - 12, cy - 6);
    g.moveTo(cx + 6, cy - 3); g.lineTo(cx + 12, cy - 6);
    g.stroke();
  }
  /* D5 右下幽灵：A 大 / B 小 */
  const gs = v === 'A' ? 1.35 : 0.7;
  g.save();
  g.translate(292, 240); g.scale(gs, gs);
  g.fillStyle = 'rgba(240,240,255,.92)';
  g.beginPath();
  g.moveTo(-13, 0);
  g.lineTo(-13, -26);
  g.arc(0, -26, 13, Math.PI, 0);
  g.lineTo(13, 0);
  g.quadraticCurveTo(9, -6, 6.5, 0);
  g.quadraticCurveTo(3, -6, 0, 0);
  g.quadraticCurveTo(-3, -6, -6.5, 0);
  g.quadraticCurveTo(-9, -6, -13, 0);
  g.closePath(); g.fill();
  g.fillStyle = '#2a1a3a';
  g.beginPath(); g.ellipse(-4.5, -28, 2.5, 3.5, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(4.5, -28, 2.5, 3.5, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(0, -20, 3.5, 2.5, 0, 0, Math.PI*2); g.fill();
  g.restore();
}

/* ================= 场景 18：游乐园 ================= */
function drawPark2(g, v) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);
  grad.addColorStop(0, '#8ed0f8');
  grad.addColorStop(1, '#e8f6ff');
  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);
  /* 云朵 */
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(160, 44, 38, 14, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(196, 38, 26, 11, 0, 0, Math.PI*2); g.fill();
  /* 地面 */
  g.fillStyle = '#8ed86a';
  g.fillRect(0, 226, IMG_W, 74);
  g.fillStyle = '#6cb84e';
  for (let i = 0; i < IMG_W; i += 20) g.fillRect(i, 226, 10, 4);
  /* D1 左上气球：红 / 绿 */
  const bc = v === 'A' ? ['#ff9f9f', '#e8403a'] : ['#a0f0a0', '#30a830'];
  g.strokeStyle = '#c8a8b8'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(70, 112); g.quadraticCurveTo(66, 128, 70, 142); g.stroke();
  ballAt(g, 70, 96, 16, bc);
  /* D2 右上摩天轮 */
  const cx = 322, cy = 108;
  g.strokeStyle = '#8a8a9a'; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx - 26, 158); g.lineTo(cx, cy);
  g.moveTo(cx + 26, 158); g.lineTo(cx, cy);
  g.stroke();
  /* D2 摩天轮其中一个吊舱颜色：A 红 / B 蓝
   * 只让 k===4 那个吊舱变色（差异点就是它）。以前 8 个吊舱一起变，
   * 孩子点其它 7 个明显变色的吊舱都会被判成点错。 */
  const podC = v === 'A' ? '#e8556a' : '#3a8ae8';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    const px = cx + Math.cos(a) * 52, py = cy + Math.sin(a) * 52;
    g.strokeStyle = '#a8a8b8'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(px, py); g.stroke();
    g.fillStyle = k === 4 ? podC : '#f0c040';
    g.beginPath(); g.arc(px, py + 5, 7, 0, Math.PI*2); g.fill();
  }
  g.fillStyle = '#8a8a9a';
  g.beginPath(); g.arc(cx, cy, 7, 0, Math.PI*2); g.fill();
  /* D3 中央旋转木马：A 有 / B 无 */
  if (v === 'A') {
    /* 顶棚 */
    g.fillStyle = '#e8556a';
    g.beginPath();
    g.moveTo(152, 130); g.quadraticCurveTo(200, 100, 248, 130);
    g.closePath(); g.fill();
    g.fillStyle = '#fff';
    g.beginPath();
    g.moveTo(168, 130); g.quadraticCurveTo(200, 108, 232, 130);
    g.closePath(); g.fill();
    g.fillStyle = '#f0d040';
    /* 顶棚小旗：用「旗杆+三角旗」画在顶棚峰值上，并整体落在差异点 (200,150) 的判定圈内。
     * 原来是悬空的小三角，离差异点 63px，孩子点它会被判成点错。 */
    g.strokeStyle = '#e0b878'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(200, 128); g.lineTo(200, 108); g.stroke();
    g.beginPath(); g.moveTo(200, 106); g.lineTo(214, 112); g.lineTo(200, 118); g.closePath(); g.fill();
    /* 立柱 */
    g.fillStyle = '#c8a878';
    g.fillRect(160, 130, 8, 66);
    g.fillRect(232, 130, 8, 66);
    /* 木马 */
    const horseC = ['#f0c860', '#a0c8e8'];
    for (let k = 0; k < 2; k++) {
      const hx = 182 + k * 36;
      g.strokeStyle = '#c8a8b8'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(hx, 132); g.lineTo(hx, 148); g.stroke();
      g.fillStyle = horseC[k];
      g.beginPath(); g.ellipse(hx, 158, 13, 9, 0, 0, Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(hx + 11, 150, 6, 6, 0, 0, Math.PI*2); g.fill();
      g.strokeStyle = '#c8a8b8'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(hx - 8, 165); g.lineTo(hx - 10, 178); g.moveTo(hx + 8, 165); g.lineTo(hx + 10, 178); g.stroke();
      g.beginPath(); g.moveTo(hx, 166); g.lineTo(hx, 178); g.stroke();
    }
    /* 底座 */
    g.fillStyle = '#c8a878';
    g.fillRect(152, 178, 96, 12);
  } else {
    /* 无旋转木马：跷跷板 */
    g.fillStyle = '#a87848';
    g.beginPath(); g.moveTo(160, 196); g.lineTo(200, 178); g.lineTo(240, 196);
    g.closePath(); g.fill();
    g.strokeStyle = '#c89858'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(200, 186); g.lineTo(200, 196); g.stroke();
    ballAt(g, 176, 186, 8, ['#ffe0c8', '#f0b898']);
    ballAt(g, 224, 186, 8, ['#ffe0c8', '#f0b898']);
  }
  /* D4 左下爆米花：A 3 桶 / B 2 桶（上移离开底边） */
  const pcN = v === 'A' ? 3 : 2;
  for (let i = 0; i < pcN; i++) {
    const px = 108 + i * 22;
    g.fillStyle = '#e8556a';
    g.fillRect(px - 7, 226, 14, 18);
    g.fillStyle = '#fff';
    g.fillRect(px - 7, 222, 14, 8);
    g.fillStyle = '#f8f0d8';
    ballAt(g, px, 220, 5, ['#fff8e0', '#f0e0b0']);
    ballAt(g, px - 4, 217, 4, ['#fff8e0', '#f0e0b0']);
    ballAt(g, px + 4, 217, 4, ['#fff8e0', '#f0e0b0']);
  }
  /* D5 右下棉花糖：A 有 / B 无（上移离开底边） */
  if (v === 'A') {
    g.strokeStyle = '#e8d8b8'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(292, 256); g.lineTo(292, 228); g.stroke();
    ballAt(g, 292, 216, 16, ['#ffd0e8', '#f0a0c8']);
    ballAt(g, 292, 202, 12, ['#ffd0e8', '#f0a0c8']);
    ballAt(g, 292, 192, 8, ['#ffd0e8', '#f0a0c8']);
  } else {
    g.fillStyle = '#a0d888';
    g.beginPath(); g.ellipse(292, 240, 22, 9, 0, 0, Math.PI*2); g.fill();
  }
  /* 远处过山车轨道装饰 */
  g.strokeStyle = '#b0b0c0'; g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo(0, 120);
  g.quadraticCurveTo(40, 70, 80, 120);
  g.quadraticCurveTo(110, 158, 140, 118);
  g.stroke();
}

/* =========================================================================
 * 第 19-36 关：新增 18 个场景绘制函数
 * -------------------------------------------------------------------------
 * 约定（与前面 18 关保持一致）：
 *   - 画布逻辑尺寸 400×300，函数签名 draw(g, v)，v ∈ {'A','B'}
 *   - 'A' = 左图（原图），'B' = 右图（找茬图），差异处两个分支画得不一样
 *   - 5 个差异点坐标与 SCENES 中写死的坐标一一对应；
 *     所有差异点都画在距四边 ≥ 70px 的安全区，方便孩子点击
 *   - 只有 helper：ballAt / drawStar / IMG_W / IMG_H，不做额外依赖
 * ========================================================================= */

/* 通用：背景渐变铺底 */
function bgFill(g, top, bottom) {
  const grad = g.createLinearGradient(0, 0, 0, IMG_H);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  g.fillStyle = grad;
  g.fillRect(0, 0, IMG_W, IMG_H);
}
/* 通用：云朵 */
function cloudAt(g, x, y, s) {
  g.fillStyle = '#ffffff';
  g.beginPath(); g.ellipse(x, y, 34 * s, 13 * s, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(x + 22 * s, y - 7 * s, 22 * s, 10 * s, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(x - 22 * s, y - 5 * s, 18 * s, 9 * s, 0, 0, Math.PI*2); g.fill();
}
/* 通用：地面 */
function groundAt(g, y, color, lineColor) {
  g.fillStyle = color;
  g.fillRect(0, y, IMG_W, IMG_H - y);
  if (lineColor) {
    g.fillStyle = lineColor;
    for (let i = 0; i < IMG_W; i += 22) g.fillRect(i, y, 11, 4);
  }
}
/* 通用：固定伪随机星点 */
function scatterStars(g, count, seed0, alpha) {
  let seed = seed0;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = `rgba(255,255,255,${alpha})`;
  for (let i = 0; i < count; i++) {
    const sx = rnd() * IMG_W, sy = rnd() * IMG_H, sr = rnd() * 1.2 + 0.35;
    g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI*2); g.fill();
  }
}
/* 通用：木箱 / 筐 */
function basketAt(g, x, y, w, h, c1, c2) {
  g.fillStyle = c2;
  g.beginPath();
  g.moveTo(x - w/2, y); g.lineTo(x + w/2, y);
  g.lineTo(x + w/2 - 4, y + h); g.lineTo(x - w/2 + 4, y + h);
  g.closePath(); g.fill();
  g.fillStyle = c1;
  g.fillRect(x - w/2, y - 3, w, 6);
  g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.5;
  for (let k = 1; k < 4; k++) {
    g.beginPath();
    g.moveTo(x - w/2 + k * (w/4), y + 2); g.lineTo(x - w/2 + k * (w/4), y + h - 2);
    g.stroke();
  }
}

/* ================= 场景 19：水果摊 ================= */
function drawFruit(g, v) {
  bgFill(g, '#ffe6c8', '#fff6e8');
  cloudAt(g, 300, 60, 1);
  /* 摊位台面 */
  groundAt(g, 214, '#c89058');
  g.fillStyle = '#a8703f';
  g.fillRect(0, 214, IMG_W, 8);
  /* D1 左上西瓜：A 4 粒籽 / B 3 粒籽 */
  ballAt(g, 96, 118, 26, ['#8ee08e', '#3aa03a']);
  g.strokeStyle = '#2a7a2a'; g.lineWidth = 3;
  for (let k = -1; k <= 1; k++) {
    g.beginPath(); g.arc(96, 118, 22, -0.9 + k * 0.35, 0.9 + k * 0.35); g.stroke();
  }
  g.fillStyle = '#e8403a';
  const seeds = v === 'A' ? [[86,110],[104,112],[88,128],[106,126]] : [[86,110],[104,112],[97,122]];
  for (const p of seeds) {
    g.beginPath(); g.ellipse(p[0], p[1], 2.4, 3.4, 0.3, 0, Math.PI*2); g.fill();
  }
  /* D2 右上香蕉：A 黄 / B 青 */
  const banC = v === 'A' ? '#f0c840' : '#a8d860';
  g.strokeStyle = banC; g.lineWidth = 9; g.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    g.beginPath();
    g.moveTo(286 + k * 5, 132);
    g.quadraticCurveTo(302 + k * 6, 106, 318 + k * 4, 116);
    g.stroke();
  }
  /* D3 中央一筐苹果：A 有 / B 无 */
  if (v === 'A') {
    basketAt(g, 200, 168, 74, 38, '#d8a060', '#b8823f');
    const apC = [['#ff9f9f', '#e8403a'], ['#ffd0a0', '#e8a040'], ['#c8f0a0', '#4aa848']];
    for (let i = 0; i < 4; i++) {
      ballAt(g, 178 + i * 15, 166, 11, apC[i % 3]);
    }
  } else {
    basketAt(g, 200, 168, 74, 38, '#d8a060', '#b8823f');
    g.fillStyle = '#e8d8b8';
    g.fillRect(178, 162, 44, 6);
  }
  /* D4 左下橙子大小：A 大 / B 小 */
  const os = v === 'A' ? 1.3 : 0.7;
  g.save();
  g.translate(100, 232); g.scale(os, os);
  ballAt(g, 0, 0, 15, ['#ffd88a', '#f0942a']);
  g.fillStyle = '#4fae4f';
  g.beginPath(); g.ellipse(2, -14, 5, 3, 0.4, 0, Math.PI*2); g.fill();
  g.restore();
  /* D5 右下葡萄：A 5 颗 / B 4 颗 */
  const grC = [['#c8a0e8', '#7a3ec0'], ['#b090e0', '#6a2eb0']];
  const grPos = [[300, 222], [286, 234], [314, 234], [300, 246], [300, 234]];
  const grN = v === 'A' ? 5 : 4;
  for (let i = 0; i < grN; i++) ballAt(g, grPos[i][0], grPos[i][1], 9, grC[i % 2]);
  g.strokeStyle = '#4fae4f'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(300, 214); g.lineTo(300, 204); g.stroke();
}

/* ================= 场景 20：雨天 ================= */
function drawRain(g, v) {
  bgFill(g, '#8aa4c8', '#c8d8ee');
  /* 远处楼房 */
  g.fillStyle = '#7a8aa8';
  g.fillRect(28, 150, 70, 110);
  g.fillRect(300, 132, 76, 128);
  g.fillStyle = 'rgba(255,240,180,.55)';
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 2; c++) g.fillRect(40 + c * 26, 164 + r * 28, 14, 16);
  groundAt(g, 254, '#9aa8bc');
  /* D1 左上雨伞：A 红 / B 蓝 */
  const umbC = v === 'A' ? '#e8403a' : '#3a8ae8';
  g.strokeStyle = '#6a5a4a'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(92, 124); g.lineTo(92, 160); g.stroke();
  g.fillStyle = umbC;
  g.beginPath(); g.arc(92, 124, 42, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(92, 124); g.arc(92, 124, 42, Math.PI * 1.2, Math.PI * 1.45); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(92, 124); g.arc(92, 124, 42, Math.PI * 1.7, Math.PI * 1.95); g.closePath(); g.fill();
  /* D2 右上乌云大小：A 大 / B 小 */
  const cl = v === 'A' ? 1.25 : 0.75;
  g.save();
  g.translate(306, 112); g.scale(cl, cl);
  g.fillStyle = '#6a7890';
  g.beginPath(); g.ellipse(0, 0, 40, 17, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(-24, -6, 24, 13, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(24, -5, 22, 12, 0, 0, Math.PI*2); g.fill();
  g.restore();
  /* D3 中央水洼：A 有 / B 无（水洼+涟漪）——画在差异点 (200,186) 上 */
  if (v === 'A') {
    g.fillStyle = '#6a9ad0';
    g.beginPath(); g.ellipse(200, 186, 46, 14, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(200, 186, 30, 9, 0, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(200, 186, 15, 5, 0, 0, Math.PI*2); g.stroke();
  } else {
    g.fillStyle = '#8a98ac';
    g.beginPath(); g.ellipse(200, 188, 40, 10, 0, 0, Math.PI*2); g.fill();
  }
  /* D4 左下雨滴：A 4 滴 / B 3 滴——画在差异点 (100,236) 附近 */
  const rdPos = [[72, 228], [104, 240], [86, 252], [122, 226]];
  const rdN = v === 'A' ? 4 : 3;
  g.fillStyle = '#dff0ff';
  for (let i = 0; i < rdN; i++) {
    const p = rdPos[i];
    g.beginPath();
    g.moveTo(p[0], p[1] - 10);
    g.quadraticCurveTo(p[0] + 6, p[1] + 2, p[0], p[1] + 6);
    g.quadraticCurveTo(p[0] - 6, p[1] + 2, p[0], p[1] - 10);
    g.closePath(); g.fill();
  }
  /* D5 右下小鸭子：A 有 / B 无 */
  if (v === 'A') {
    ballAt(g, 292, 232, 14, ['#ffe89a', '#f0c040']);
    ballAt(g, 302, 220, 9, ['#ffe89a', '#f0c040']);
    g.fillStyle = '#f0a020';
    g.beginPath(); g.moveTo(310, 218); g.lineTo(320, 221); g.lineTo(310, 225); g.closePath(); g.fill();
    g.fillStyle = '#1b1b33';
    g.beginPath(); g.arc(304, 217, 1.8, 0, Math.PI*2); g.fill();
  } else {
    g.fillStyle = '#8a98ac';
    g.beginPath(); g.ellipse(294, 244, 22, 8, 0, 0, Math.PI*2); g.fill();
  }
  /* 雨丝装饰 */
  g.strokeStyle = 'rgba(230,244,255,.55)'; g.lineWidth = 2; g.lineCap = 'round';
  for (const p of [[160, 70], [230, 90], [180, 130], [250, 160], [140, 170]]) {
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] - 5, p[1] + 16); g.stroke();
  }
}

/* ================= 场景 21：图书馆 ================= */
function drawLibrary(g, v) {
  bgFill(g, '#f0e6d2', '#fdf8ee');
  /* 书架 */
  g.fillStyle = '#c8a878';
  g.fillRect(0, 96, IMG_W, 150);
  g.fillStyle = '#a88858';
  for (const sy of [140, 186]) g.fillRect(0, sy, IMG_W, 6);
  /* 背景书脊（固定色序） */
  const spineC = ['#e8403a', '#3a8ae8', '#4aa848', '#f0a820', '#8a4fe0', '#e87ab8'];
  for (let s = 0; s < 3; s++) {
    for (let i = 0; i < 14; i++) {
      const bx = 6 + i * 28, by = 100 + s * 46;
      if (by > 182) continue;
      g.fillStyle = spineC[(i + s) % spineC.length];
      g.fillRect(bx, by, 18, 34);
      g.fillStyle = 'rgba(255,255,255,.35)';
      g.fillRect(bx + 3, by + 6, 12, 3);
    }
  }
  /* D1 左上书脊颜色：A 黄 / B 绿（盖一块显眼的书） */
  const bookC = v === 'A' ? '#f0c840' : '#4aa848';
  g.fillStyle = bookC;
  g.fillRect(76, 102, 32, 36);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillRect(82, 110, 20, 4);
  g.fillRect(82, 120, 20, 4);
  /* D2 右上台灯：A 有 / B 无 */
  if (v === 'A') {
    g.fillStyle = '#8a6a4a';
    g.fillRect(300, 150, 6, 34);
    g.fillStyle = '#e8b040';
    g.beginPath();
    g.moveTo(280, 150); g.lineTo(326, 150); g.lineTo(316, 124); g.lineTo(290, 124);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,240,160,.5)';
    g.beginPath(); g.moveTo(282, 150); g.lineTo(324, 150); g.lineTo(340, 190); g.lineTo(266, 190);
    g.closePath(); g.fill();
  } else {
    g.fillStyle = '#c8b8a0';
    g.beginPath(); g.ellipse(302, 172, 24, 10, 0, 0, Math.PI*2); g.fill();
  }
  /* D3 中央时钟指针方向：A 指右 / B 指下 */
  ballAt(g, 200, 178, 30, ['#fffaf0', '#e8dcc8']);
  g.strokeStyle = '#8a6a4a'; g.lineWidth = 3;
  g.beginPath(); g.arc(200, 178, 30, 0, Math.PI*2); g.stroke();
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 6;
    g.beginPath();
    g.moveTo(200 + Math.cos(a) * 24, 178 + Math.sin(a) * 24);
    g.lineTo(200 + Math.cos(a) * 28, 178 + Math.sin(a) * 28);
    g.stroke();
  }
  g.strokeStyle = '#3a2a1c'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(200, 178); g.lineTo(200, 158); g.stroke();
  g.beginPath();
  if (v === 'A') { g.moveTo(200, 178); g.lineTo(218, 178); }
  else           { g.moveTo(200, 178); g.lineTo(200, 196); }
  g.stroke();
  /* 桌子 */
  g.fillStyle = '#b89668';
  g.fillRect(110, 208, 180, 10);
  g.fillRect(122, 218, 10, 32);
  g.fillRect(268, 218, 10, 32);
  /* D4 左下叠书：A 3 本 / B 2 本 */
  const stackN = v === 'A' ? 3 : 2;
  const stackC = ['#e8403a', '#3a8ae8', '#4aa848'];
  for (let i = 0; i < stackN; i++) {
    g.fillStyle = stackC[i];
    g.fillRect(80, 214 - i * 12, 46, 11);
    g.fillStyle = '#fffaf0';
    g.fillRect(84, 217 - i * 12, 38, 3);
  }
  /* D5 右下地球仪：A 有 / B 无 */
  if (v === 'A') {
    g.fillStyle = '#8a6a4a';
    g.fillRect(296, 208, 8, 16);
    g.beginPath(); g.ellipse(300, 234, 20, 7, 0, 0, Math.PI*2); g.fill();
    ballAt(g, 300, 232, 20, ['#8ad8ff', '#3a8ae8']);
    g.fillStyle = '#4aa848';
    g.beginPath(); g.ellipse(294, 226, 9, 6, 0.3, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(308, 240, 7, 5, -0.2, 0, Math.PI*2); g.fill();
  } else {
    g.fillStyle = '#c8b8a0';
    g.beginPath(); g.ellipse(300, 240, 22, 8, 0, 0, Math.PI*2); g.fill();
  }
}

  g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-4, -10); g.lineTo(-2, 8); g.stroke();
  g.restore();
  /* D5 右下杯子：A 有 / B 无 */
