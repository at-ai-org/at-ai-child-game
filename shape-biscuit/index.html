<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>形状饼干工厂 · Shape Biscuit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #ffe3b3;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: absolute; top: 72px; left: 14px; z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .hud-chip { background: rgba(255,250,240,.9); border: 2px solid rgba(232,145,90,.5); border-radius: 14px; color: #7a4a1e; padding: 7px 15px; font-size: 17px; font-weight: 700; box-shadow: 0 4px 14px rgba(180,120,60,.25); backdrop-filter: blur(6px); }
  .hud-chip b { color: #ff8c42; font-size: 21px; }
  #btnMute { position: absolute; top: 12px; right: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(255,250,240,.9); border: 2px solid rgba(232,145,90,.5); color: #7a4a1e; }
  #caption { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 15; background: rgba(255,250,240,.92); border: 2px solid rgba(232,145,90,.55); border-radius: 18px; color: #6b3f16; padding: 10px 26px; font-size: 21px; font-weight: 700; letter-spacing: 1px; pointer-events: none; white-space: nowrap; max-width: 92vw; text-align: center; }
  #toast { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%) scale(1); z-index: 30; font-size: 56px; font-weight: 800; color: #ff8c42; text-shadow: 0 3px 10px rgba(255,255,255,.9), 0 4px 14px rgba(180,110,50,.35); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; }
  #toast.pop { opacity: 1; transform: translate(-50%, -58%) scale(1.12); }
  #result { position: absolute; inset: 0; z-index: 40; background: rgba(255,240,220,.75); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #result.show { display: flex; }
  .result-card { text-align: center; color: #6b3f16; background: linear-gradient(160deg, #fffdf7, #ffedcf); border: 3px solid #ffab6b; border-radius: 26px; padding: 30px 44px; box-shadow: 0 20px 60px rgba(190,130,70,.35); max-width: 88vw; }
  .result-card h1 { font-size: 38px; color: #ff8c42; margin-bottom: 12px; }
  .result-card p { font-size: 17px; color: #9a6a38; margin: 6px 0 22px; line-height: 1.8; }
  .result-card button { font-size: 20px; padding: 12px 42px; border-radius: 999px; border: none; cursor: pointer; background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; font-weight: 700; letter-spacing: 4px; box-shadow: 0 6px 20px rgba(255,156,92,.45); font-family: inherit; }
  .result-card button:active { transform: scale(.97); }
  #start { position: absolute; inset: 0; z-index: 50; background: radial-gradient(1200px 600px at 50% 30%, #fff3d9 0%, #ffd9a0 60%, #ffc98a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b3f16; text-align: center; padding: 20px; }
  #start h1 { font-size: clamp(38px, 8vw, 60px); letter-spacing: 6px; background: linear-gradient(90deg, #ff8c42, #ff6b6b, #ff9c5c); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 14px; }
  #start p { font-size: 16px; color: #a06a2e; line-height: 2; max-width: 560px; }
  #start .rules { margin: 22px 0 28px; }
  #start button { font-size: 21px; padding: 14px 56px; border-radius: 999px; border: none; cursor: pointer; background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; font-weight: 800; letter-spacing: 6px; box-shadow: 0 8px 26px rgba(255,180,70,.45); font-family: inherit; }
  #start button:active { transform: scale(.97); }

/* ---- 返回主页按钮 + 确认弹窗 ---- */
#btnHome { position: absolute; top: 12px; left: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); color: #dff2ff; font-family: inherit; }
#btnHome:active { transform: scale(.94); }
#homeConfirm { position: absolute; inset: 0; z-index: 90; background: rgba(4, 8, 22, .62); display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
#homeConfirm.show { display: flex; }
#homeConfirm .hc-card { text-align: center; background: linear-gradient(160deg, #16224a, #0d1330); border: 2px solid #4f8cff; border-radius: 22px; padding: 26px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.5); max-width: 84vw; }
#homeConfirm .hc-card h2 { font-size: 24px; color: #eaf4ff; margin-bottom: 8px; letter-spacing: 2px; }
#homeConfirm .hc-card p { font-size: 15px; color: #9db4d8; margin: 4px 0 18px; }
#homeConfirm .hc-btns { display: flex; gap: 14px; justify-content: center; }
#homeConfirm button { font-size: 17px; padding: 10px 26px; border-radius: 999px; border: none; cursor: pointer; font-weight: 700; letter-spacing: 2px; font-family: inherit; }
#homeConfirm button:active { transform: scale(.96); }
#hcOk { background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; box-shadow: 0 6px 18px rgba(255,180,70,.4); }
#hcCancel { background: rgba(255,255,255,.12); color: #dff2ff; border: 1px solid rgba(120,200,255,.4) !important; }
</style>
</head>
<body>
<button id="btnHome" title="返回主页">🏠</button>
<div id="homeConfirm">
  <div class="hc-card">
    <h2>🏠 返回游戏主页？</h2>
    <p>当前的游戏进度将会丢失哦</p>
    <div class="hc-btns">
      <button id="hcOk">确认返回</button>
      <button id="hcCancel">再玩一会儿</button>
    </div>
  </div>
</div>

<canvas id="game"></canvas>
<button id="btnMute" title="声音开关">🔊</button>
<div class="hud">
  <div class="hud-chip">烤好 <b id="hudDone">0</b> / 20</div>
  <div class="hud-chip">连对 <b id="hudStreak">0</b> 🔥</div>
  <div class="hud-chip" id="hudBatch">第一批</div>
</div>
<div id="caption" style="display:none"></div>
<div id="toast"></div>
<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">🍪 收工啦！</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再烤一次</button>
  </div>
</div>
<div id="start">
  <h1>形状饼干工厂</h1>
  <p class="rules">
    传送带上送来一块块饼干，听语音指令：<br>
    找到和饼干一样形状的模具，点击给它 <b>盖章</b>！<br>
    盖对了饼干会烤得金黄金黄，盖错了它会晃晃悠悠溜走～<br>
    先认识 <b>10 种平面图形</b>，再来挑战 <b>5 种立体图形</b>（球体、正方体、圆柱体…）<br>
    一起烤好 <b>20 块</b> 形状饼干吧！
  </p>
  <button id="btnStart">开始烤饼干</button>
</div>
<script>
/* 屏蔽右键菜单：防止游戏中误触（触屏板双指/鼠标右键弹出系统菜单打断游戏） */
window.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
 * 形状饼干工厂 Shape Biscuit —— 单文件 Canvas 小游戏
 * 传送带送来形状饼干，点对应模具盖章；盖对烤成金色。
 * ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

/* 平面图形（第一批） */
const SHAPES_2D = [
  { key: 'circle',   name: '圆形' },
  { key: 'triangle', name: '三角形' },
  { key: 'square',   name: '正方形' },
  { key: 'star',     name: '五角星' },
  { key: 'heart',    name: '心形' },
  { key: 'diamond',  name: '菱形' },
  { key: 'oval',     name: '椭圆形' },
  { key: 'hexagon',  name: '六边形' },
  { key: 'trapezoid',name: '梯形' },
  { key: 'arrow',    name: '箭头形' },
];
/* 立体图形（第二批） */
const SHAPES_3D = [
  { key: 'sphere',   name: '球体' },
  { key: 'cube',     name: '正方体' },
  { key: 'cuboid',   name: '长方体' },
  { key: 'cylinder', name: '圆柱体' },
  { key: 'cone',     name: '圆锥体' },
];
/* 当前批次的模具集（5 个一组轮换） */
let SHAPES = [];
const SHAPE_COLORS = {
  circle: '#ffd35c', triangle: '#7dffa1', square: '#6bd5ff', star: '#ff9c5c', heart: '#ff8fab',
  diamond: '#c0a8ff', oval: '#a8e8c0', hexagon: '#ffc0d8', trapezoid: '#d8c090', arrow: '#9fe0ff',
  sphere: '#ffd35c', cube: '#6bd5ff', cuboid: '#7dffa1', cylinder: '#ff9c5c', cone: '#ff8fab',
};
const SHAPE_TXT = {
  circle: '圆形', triangle: '三角形', square: '正方形', star: '五角星', heart: '心形',
  diamond: '菱形', oval: '椭圆形', hexagon: '六边形', trapezoid: '梯形', arrow: '箭头形',
  sphere: '球体', cube: '正方体', cuboid: '长方体', cylinder: '圆柱体', cone: '圆锥体',
};
/* 游戏分 4 批，每批 5 块（平面 2 批 → 立体 2 批），共 20 块 */
const TOTAL = 20;
const BATCHES = [
  { shapes: SHAPES_2D.slice(0, 5),  label: '第一批' },
  { shapes: SHAPES_2D.slice(5, 10), label: '第二批' },
  { shapes: SHAPES_3D,              label: '立体图形' },
  { shapes: SHAPES_2D,              label: '大合集' },   /* 10 选 5 补足到 20 */
];

const STATE = { START: 0, RUNNING: 1, FINISH: 2 };
let state = STATE.START;
let doneCount = 0, streak = 0, bestStreak = 0, wrongTotal = 0;
let batchIndex = 0;             // 当前批次（0..3）
let batchDone = 0;              // 本批已烤数量
let betweenBatches = false;     // 批次切换等待中（不送新饼干、不响应盖章）
const BATCH_SIZE = 5;           // 每批 5 块
let biscuit = null;            // {shape, x, y, wob, baked, leaving}
let stampAnim = null;          // {x, y, t, shape, ok}
let particles = [], crumbs = [];
let shake = 0;
let lastShape = null;
let spawnT = 0;

const $ = id => document.getElementById(id);
const captionEl = $('caption');
const toastEl = $('toast');

/* 语音 */
const synth = window.speechSynthesis || null;
let zhVoice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice; }
function speak(text) {
  if (muted || !synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = 0.92;
    synth.speak(u);
  } catch (e) {}
}

/* 音效 */
let actx = null, muted = false;
function initAudio() {
  if (actx) { actx.resume && actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
}
function beep(freq, dur, type, vol, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxRight = () => { beep(660, .1, 'sine', .2); beep(990, .16, 'sine', .2, .1); };
const sfxWrong = () => beep(180, .2, 'sawtooth', .12);
const sfxStamp = () => { beep(140, .12, 'square', .22); beep(90, .1, 'triangle', .18, .05); };
const sfxDing  = () => { beep(1320, .2, 'sine', .18); };

$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (muted && synth) synth.cancel();
});

/* 粒子 */
function burst(x, y, color, n) {
  for (let i = 0; i < (n || 20); i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1, color, size: 3 + Math.random() * 4 });
  }
}

function updateHUD() {
  $('hudDone').textContent = doneCount;
  $('hudStreak').textContent = streak;
  $('hudBatch').textContent = BATCHES[batchIndex] ? BATCHES[batchIndex].label : '';
}
let toastTimer = null;
function toast(text, good) {
  toastEl.textContent = text;
  toastEl.style.color = good ? '#7dffa1' : '#ffb0a0';
  toastEl.classList.add('pop');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('pop'), 900);
}
function caption(text) {
  captionEl.style.display = 'block';
  captionEl.textContent = text;
}

/* 生成下一块饼干：从当前批次随机 */
function nextBiscuit() {
  let s;
  do { s = SHAPES[Math.floor(Math.random() * SHAPES.length)]; } while (s.key === lastShape && Math.random() < 0.6);
  lastShape = s.key;
  /* 饼干 y：中带偏上，确保与加高的模具架不重叠 */
  const beltY2 = Math.max(H * 0.18, (H - 226) * 0.55);
  biscuit = { shape: s, x: -80, y: beltY2, wob: Math.random() * 6.28, baked: false, leaving: false, bakedT: 0 };
  speak(`给${s.name}饼干盖章！`);
  caption(`给 ${s.name} 饼干盖章！`);
}

/* 切换批次：换模具架 + 播报 */
function enterBatch(bi) {
  batchIndex = bi;
  const b = BATCHES[bi];
  SHAPES = b.shapes;
  batchDone = 0;
  betweenBatches = false;
  rackHit.length = 0;          // 清空热区，避免点到旧模具
  updateHUD();
}

/* 点击模具（shapes 之一） */
function stampShape(key) {
  if (state !== STATE.RUNNING || betweenBatches || !biscuit || biscuit.leaving || stampAnim) return;
  stampAnim = { x: biscuit.x, y: biscuit.y, t: 0, shape: key, ok: key === biscuit.shape.key };
  sfxStamp();
  if (stampAnim.ok) {
    sfxRight();
    doneCount++; streak++; batchDone++;
    if (streak > bestStreak) bestStreak = streak;
    biscuit.baked = true;
    burst(biscuit.x, biscuit.y, '#ffd35c', 26);
    toast('🍪 烤好啦！', true);
    speak(['太棒了', '好厉害', '真不错', '顶呱呱'][Math.floor(Math.random() * 4)]);
    updateHUD();
    if (doneCount >= TOTAL) {
      setTimeout(showResult, 900);
    } else if (batchDone >= BATCH_SIZE) {
      /* 本批完成 → 换下一批模具（等待期间不送新饼干） */
      betweenBatches = true;
      const next = batchIndex + 1;
      setTimeout(() => {
        enterBatch(next);
        const label = BATCHES[next].label;
        const is3D = BATCHES[next].shapes === SHAPES_3D;
        if (is3D) {
          toast('🎉 立体图形登场！', true);
          speak(`平面图形全都烤好啦！接下来是立体图形饼干，换新模具咯！`);
          caption('立体图形饼干来啦！🧊');
        } else {
          toast('🎉 换新模具啦！', true);
          speak(`这一批烤好啦！换新模具，继续加油！`);
          caption('新模具上架啦！');
        }
      }, 1100);
    }
  } else {
    wrongTotal++; streak = 0;
    biscuit.leaving = true;
    shake = 0.3;
    sfxWrong();
    toast(`这是${SHAPE_TXT[key]}模具`);
    speak(`盖错啦，这是${biscuit.shape.name}饼干，要用${biscuit.shape.name}模具`);
    updateHUD();
  }
}


function showResult() {
  let title, medal;
  if (bestStreak >= 16) { title = '🥇 金牌面点师！'; medal = '金牌'; }
  else if (bestStreak >= 10) { title = '🥈 银牌面点师！'; medal = '银牌'; }
  else if (bestStreak >= 5) { title = '🥉 铜牌面点师！'; medal = '铜牌'; }
  else { title = '🍪 收工啦！'; medal = '继续加油'; }
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML =
    `烤好 <b style="color:#ffd35c">${doneCount}</b> 块饼干（${medal}）<br>` +
    `最佳连对 <b style="color:#ffd35c">${bestStreak}</b> 次 · 盖错 <b style="color:#ff9d9d">${wrongTotal}</b> 次<br>` +
    `十五种形状（10 平面 + 5 立体）全都认识啦！`;
  $('result').classList.add('show');
  state = STATE.FINISH;         // 游戏结束：不再送饼干/响应盖章
  speak(`收工啦！你烤好了${doneCount}块饼干，获得${medal}！`);
}

/* 绘制形状（key 在 cx,cy 半径 r）—— 平面图形 */
function drawShape(key, cx, cy, r, fill, stroke, lw) {
  ctx.beginPath();
  if (key === 'circle') {
    ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
  } else if (key === 'square') {
    const s = r * 1.28;
    ctx.rect(cx - s / 2, cy - s / 2, s, s);
  } else if (key === 'triangle') {
    ctx.moveTo(cx, cy - r * 1.1);
    ctx.lineTo(cx + r, cy + r * 0.75);
    ctx.lineTo(cx - r, cy + r * 0.75);
    ctx.closePath();
  } else if (key === 'star') {
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 === 0 ? r * 1.05 : r * 0.45;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      else ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath();
  } else if (key === 'heart') {
    ctx.moveTo(cx, cy + r * 0.85);
    ctx.bezierCurveTo(cx - r * 1.3, cy - r * 0.1, cx - r * 0.55, cy - r * 1.05, cx, cy - r * 0.35);
    ctx.bezierCurveTo(cx + r * 0.55, cy - r * 1.05, cx + r * 1.3, cy - r * 0.1, cx, cy + r * 0.85);
    ctx.closePath();
  } else if (key === 'diamond') {
    ctx.moveTo(cx, cy - r * 1.05);
    ctx.lineTo(cx + r * 0.85, cy);
    ctx.lineTo(cx, cy + r * 1.05);
    ctx.lineTo(cx - r * 0.85, cy);
    ctx.closePath();
  } else if (key === 'oval') {
    ctx.ellipse(cx, cy, r * 1.15, r * 0.75, 0, 0, Math.PI * 2);
  } else if (key === 'hexagon') {
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
  } else if (key === 'trapezoid') {
    ctx.moveTo(cx - r * 0.55, cy - r * 0.7);
    ctx.lineTo(cx + r * 0.55, cy - r * 0.7);
    ctx.lineTo(cx + r, cy + r * 0.7);
    ctx.lineTo(cx - r, cy + r * 0.7);
    ctx.closePath();
  } else if (key === 'arrow') {
    ctx.moveTo(cx, cy - r * 1.05);
    ctx.lineTo(cx + r * 0.95, cy);
    ctx.lineTo(cx + r * 0.35, cy);
    ctx.lineTo(cx + r * 0.35, cy + r * 1.0);
    ctx.lineTo(cx - r * 0.35, cy + r * 1.0);
    ctx.lineTo(cx - r * 0.35, cy);
    ctx.lineTo(cx - r * 0.95, cy);
    ctx.closePath();
  }
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}

/* 绘制立体图形（伪 3D：亮面 + 侧面暗面 + 顶面高光） */
function drawShape3D(key, cx, cy, r, mainColor, edgeColor, baked) {
  const face = mainColor;                       // 正面
  const side = shadeColor(mainColor, -28);      // 侧面（暗）
  const top = shadeColor(mainColor, 22);        // 顶面（亮）
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = edgeColor || '#8a6a42';
  if (key === 'sphere') {
    /* 球：径向渐变球体 */
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    g.addColorStop(0, top);
    g.addColorStop(0.55, face);
    g.addColorStop(1, side);
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.95, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    /* 高光点 */
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(cx - r * 0.35, cy - r * 0.4, r * 0.2, r * 0.13, -0.6, 0, Math.PI * 2); ctx.fill();
  } else if (key === 'cube') {
    /* 正方体：正方形正面 + 斜上顶面 + 右侧面 */
    const s = r * 0.95, d = s * 0.45;
    /* 顶面 */
    ctx.beginPath();
    ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx - s + d, cy - s - d);
    ctx.lineTo(cx + s + d, cy - s - d); ctx.lineTo(cx + s, cy - s);
    ctx.closePath();
    ctx.fillStyle = top; ctx.fill(); ctx.stroke();
    /* 右侧面 */
    ctx.beginPath();
    ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx + s + d, cy - s - d);
    ctx.lineTo(cx + s + d, cy + s - d); ctx.lineTo(cx + s, cy + s);
    ctx.closePath();
    ctx.fillStyle = side; ctx.fill(); ctx.stroke();
    /* 正面 */
    ctx.beginPath();
    ctx.rect(cx - s, cy - s, s * 2, s * 2);
    ctx.fillStyle = face; ctx.fill(); ctx.stroke();
  } else if (key === 'cuboid') {
    /* 长方体：宽正面 + 斜上顶面 + 右侧面 */
    const w = r * 1.2, h = r * 0.75, d = r * 0.5;
    /* 顶面 */
    ctx.beginPath();
    ctx.moveTo(cx - w, cy - h); ctx.lineTo(cx - w + d, cy - h - d);
    ctx.lineTo(cx + w + d, cy - h - d); ctx.lineTo(cx + w, cy - h);
    ctx.closePath();
    ctx.fillStyle = top; ctx.fill(); ctx.stroke();
    /* 右侧面 */
    ctx.beginPath();
    ctx.moveTo(cx + w, cy - h); ctx.lineTo(cx + w + d, cy - h - d);
    ctx.lineTo(cx + w + d, cy + h - d); ctx.lineTo(cx + w, cy + h);
    ctx.closePath();
    ctx.fillStyle = side; ctx.fill(); ctx.stroke();
    /* 正面 */
    ctx.beginPath();
    ctx.rect(cx - w, cy - h, w * 2, h * 2);
    ctx.fillStyle = face; ctx.fill(); ctx.stroke();
  } else if (key === 'cylinder') {
    /* 圆柱：矩形身 + 顶椭圆 + 底弧 */
    const w = r * 0.68, h = r * 0.9, eo = r * 0.3;
    /* 侧面 */
    ctx.beginPath();
    ctx.moveTo(cx - w, cy - h);
    ctx.lineTo(cx - w, cy + h);
    ctx.ellipse(cx, cy + h, w, eo, 0, Math.PI, 0, true);
    ctx.lineTo(cx + w, cy - h);
    ctx.closePath();
    ctx.fillStyle = side; ctx.fill(); ctx.stroke();
    /* 正面渐变（圆柱曲面感） */
    const g2 = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
    g2.addColorStop(0, side);
    g2.addColorStop(0.5, face);
    g2.addColorStop(1, side);
    ctx.beginPath();
    ctx.rect(cx - w, cy - h, w * 2, h * 2);
    ctx.fillStyle = g2; ctx.fill(); ctx.stroke();
    /* 顶面椭圆 */
    ctx.beginPath();
    ctx.ellipse(cx, cy - h, w, eo, 0, 0, Math.PI * 2);
    ctx.fillStyle = top; ctx.fill(); ctx.stroke();
  } else if (key === 'cone') {
    /* 圆锥：三角锥身 + 底椭圆 */
    const w = r * 0.85, h = r * 1.15, eo = r * 0.3;
    /* 锥身 */
    ctx.beginPath();
    ctx.moveTo(cx, cy - h);
    ctx.lineTo(cx + w, cy + h - eo * 0.4);
    ctx.ellipse(cx, cy + h - eo * 0.4, w, eo, 0, 0, Math.PI * 0.5, true);
    ctx.lineTo(cx - w, cy + h - eo * 0.4);
    ctx.closePath();
    const g3 = ctx.createLinearGradient(cx - w, 0, cx + w, 0);
    g3.addColorStop(0, side);
    g3.addColorStop(0.45, face);
    g3.addColorStop(1, side);
    ctx.fillStyle = g3; ctx.fill(); ctx.stroke();
    /* 底面椭圆（可见前半） */
    ctx.beginPath();
    ctx.ellipse(cx, cy + h - eo * 0.4, w, eo, 0, 0, Math.PI, false);
    ctx.fillStyle = side; ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/* 颜色加深/变亮工具 */
function shadeColor(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}
/* 是否立体图形 */
function is3D(key) { return key === 'sphere' || key === 'cube' || key === 'cuboid' || key === 'cylinder' || key === 'cone'; }

/* 绘制场景 */
function drawScene(t) {
  // 糖果饼干屋：明亮奶油黄 → 杏粉渐变（柔和护眼）
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fff3d9');
  bg.addColorStop(0.62, '#ffd9a0');
  bg.addColorStop(1, '#ffc98a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 后墙砖纹
  ctx.strokeStyle = 'rgba(214,140,80,.12)';
  ctx.lineWidth = 2;
  for (let y = 40; y < H * 0.62; y += 34) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // 温馨挂灯
  for (let i = 0; i < 3; i++) {
    const lx = W * (0.2 + i * 0.3);
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, 46); ctx.stroke();
    const g = ctx.createRadialGradient(lx, 62, 2, lx, 62, 60);
    g.addColorStop(0, 'rgba(255,220,140,.55)');
    g.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lx, 62, 60, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9c0';
    ctx.beginPath(); ctx.arc(lx, 58, 10, 0, Math.PI * 2); ctx.fill();
  }

  // 传送带
  const beltY = H * 0.55, beltH = 46;
  ctx.fillStyle = '#8a5a34';
  roundRect2(0, beltY, W, beltH, 10); ctx.fill();
  // 滚动纹
  ctx.strokeStyle = 'rgba(255,235,200,.35)'; ctx.lineWidth = 3;
  const roll = (t * 120) % 42;
  for (let x = -42 + roll; x < W + 42; x += 42) {
    ctx.beginPath(); ctx.moveTo(x, beltY + 6); ctx.lineTo(x, beltY + beltH - 6); ctx.stroke();
  }
  ctx.strokeStyle = '#b07848'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, beltY); ctx.lineTo(W, beltY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, beltY + beltH); ctx.lineTo(W, beltY + beltH); ctx.stroke();

  // 模具架（底部）：整体抬高，内部留足形状 + 名字空间
  const n = SHAPES.length;
  const cellW = Math.min(150, (W - 30) / n);
  const rackH = 210;                       // 架子高度：形状 90 + 名字 24 + 内边距
  const rackY = H - rackH - 16;            // 距底部 16px
  ctx.fillStyle = 'rgba(255,251,242,.92)';
  roundRect2(10, rackY, W - 20, rackH, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(232,145,90,.55)'; ctx.lineWidth = 2;
  roundRect2(10, rackY, W - 20, rackH, 18); ctx.stroke();
  ctx.fillStyle = '#b07848';
  ctx.font = '15px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('点 模 具 盖 章', W / 2, rackY + rackH - 14);
}
function roundRect2(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBiscuit(t) {
  if (!biscuit) return;
  const b = biscuit;
  const by = b.y + Math.sin(t * 3 + b.wob) * 4 + (b.baked ? -26 : 0);
  const sc = b.baked ? Math.max(0, 1 - b.bakedT * 0.8) : 1;
  if (sc <= 0) return;
  ctx.save();
  ctx.translate(b.x, by);
  ctx.scale(sc, sc);
  const r = Math.min(W, H) * 0.075;
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(0, r * 1.5, r * 1.1, r * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();
  const key = b.shape.key;
  if (is3D(key)) {
    /* 立体饼干：伪 3D 绘制（烤好前面团色，烤好金色） */
    const mainC = b.baked ? '#e8a33d' : '#d8b98c';
    drawShape3D(key, 0, -r * 0.1, r * 0.85, mainC, '#8a6a42', b.baked);
  } else {
    // 饼干底（生面团色 / 烤好金色）
    drawShape(key, 0, 0, r, b.baked ? '#e8a33d' : '#d8b98c', '#8a6a42', 5);
  }
  // 巧克力点缀
  ctx.fillStyle = b.baked ? '#8a5a2a' : '#b08a5a';
  ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.2, r * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.07, 0, Math.PI * 2); ctx.fill();
  if (b.baked) {
    // 香气
    ctx.strokeStyle = 'rgba(255,235,180,.5)';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      const sx = -r * 0.5 + i * r * 0.5;
      const ph = t * 2 + i;
      ctx.beginPath();
      ctx.moveTo(sx, -r * 1.3);
      ctx.quadraticCurveTo(sx + 8 * Math.sin(ph), -r * 1.7, sx, -r * 2.1);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawStampAnim(t) {
  if (!stampAnim) return;
  const a = stampAnim;
  a.t += 0.016;
  const k = Math.min(1, a.t / 0.4);
  const lift = Math.sin(k * Math.PI) * 90;
  const cx = a.x, cy = a.y - lift;
  const r = Math.min(W, H) * 0.075;
  // 印章
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#6b4a2a';
  roundRect2(-r * 0.7, -r * 2.2, r * 1.4, r * 2.6, 8); ctx.fill();
  ctx.fillStyle = SHAPE_COLORS[a.shape];
  if (is3D(a.shape)) {
    drawShape3D(a.shape, 0, -r * 0.9, r * 0.5, SHAPE_COLORS[a.shape], '#3a2200');
  } else {
    drawShape(a.shape, 0, -r * 0.9, r * 0.55, null, '#3a2200', 3);
  }
  ctx.restore();
  if (a.t > 0.7) stampAnim = null;
}

function drawRack(t) {
  const n = SHAPES.length;
  const cellW = Math.min(150, (W - 30) / n);
  const rackH = 210;
  const rackY = H - rackH - 16;
  const r = Math.min(cellW * 0.44, 60);            // 形状基准半径（放大一倍）
  const shapeCy = rackY + r + 24;                  // 形状中心：架顶 + 形状高 + 边距
  const labelY = rackY + rackH - 40;               // 名字基线：底部提示上方
  for (let i = 0; i < n; i++) {
    const s = SHAPES[i];
    const cx = 10 + cellW * (i + 0.5) + (W - 20 - cellW * n) / 2;
    const cy = shapeCy;
    // 模具木底（随形状放大，亮木色）
    ctx.fillStyle = '#c98f5a';
    roundRect2(cx - cellW * 0.44, cy - r * 1.25, cellW * 0.88, r * 2.5, 14); ctx.fill();
    if (is3D(s.key)) {
      // 暗色描边底 + 彩色立体印面（双层错位）
      drawShape3D(s.key, cx, cy - r * 0.1, r * 0.98, '#a06a3e', '#7a4a26');
      drawShape3D(s.key, cx, cy - r * 0.3, r * 0.8, SHAPE_COLORS[s.key], '#3a2200');
    } else {
      ctx.fillStyle = '#a06a3e';
      drawShape(s.key, cx, cy, r * 0.98, null, '#7a4a26', 3);
      // 彩色形状印面
      drawShape(s.key, cx, cy, r * 0.8, SHAPE_COLORS[s.key], null, 0);
    }
    // 名字（middle 基线，字号随格子放大）
    ctx.fillStyle = '#7a4a1e';
    ctx.font = `bold ${Math.min(22, Math.max(15, cellW * 0.15))}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.name, cx, labelY);
    // 记录热区（覆盖木底 + 名字）
    rackHit[i] = { x: cx - cellW * 0.44, y: cy - r * 1.25, w: cellW * 0.88, h: labelY - (cy - r * 1.25) + 14, key: s.key };
  }
}
const rackHit = [];

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* 主循环 */
function update(dt, t) {
  if (shake > 0) shake = Math.max(0, shake - dt);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= dt * 1.3; }
  particles = particles.filter(p => p.life > 0);

  if (state === STATE.RUNNING) {
    // 传送带送饼干（批次切换等待中不送）
    if (!biscuit) {
      if (!betweenBatches) {
        spawnT -= dt;
        if (spawnT <= 0) { nextBiscuit(); }
      }
    } else if (biscuit.leaving) {
      biscuit.x -= 240 * dt;
      if (biscuit.x < -120) { biscuit = null; spawnT = 0.5; }
    } else if (biscuit.baked) {
      biscuit.bakedT += dt;
      if (biscuit.bakedT > 1.1) { biscuit = null; spawnT = 0.5; }
    } else {
      biscuit.x += Math.min(140, 60 + doneCount * 6) * dt;   // 传送带速度随进度微升
      if (biscuit.x > W - Math.min(W, H) * 0.09) {
        // 溜走到头：温和提示再来一块
        biscuit = null; spawnT = 0.4;
        streak = 0;
        caption('饼干溜走啦，等下一块～');
        speak('饼干溜走啦，下一块来啦');
        updateHUD();
      }
    }
  }
}

function render(t) {
  ctx.save();
  if (shake > 0) {
    const m = shake * 10;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }
  drawScene(t);
  drawBiscuit(t);
  drawStampAnim(t);
  drawRack(t);
  drawParticles();
  ctx.restore();
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 点击判定：先查模具架热区，再查饼干 */
canvas.addEventListener('pointerdown', e => {
  if (state !== STATE.RUNNING) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);
  for (const hz of rackHit) {
    if (x >= hz.x - 10 && x <= hz.x + hz.w + 10 && y >= hz.y - 10 && y <= hz.y + hz.h + 10) {
      stampShape(hz.key);
      return;
    }
  }
});

/* 开始 / 重开 */
$('btnStart').addEventListener('click', () => {
  initAudio();
  $('start').style.display = 'none';
  resetGame();
  state = STATE.RUNNING;
  spawnT = 0.4;
  speak('饼干工厂开工啦！');
});
$('btnRestart').addEventListener('click', () => {
  $('result').classList.remove('show');
  resetGame();
  state = STATE.RUNNING;
  spawnT = 0.4;
  speak('再烤一炉！');
});
function resetGame() {
  doneCount = 0; streak = 0; bestStreak = 0; wrongTotal = 0;
  biscuit = null; stampAnim = null;
  particles = [];
  shake = 0; lastShape = null; spawnT = 0.4;
  betweenBatches = false;
  enterBatch(0);                               // 第一批模具（平面 1-5）
  captionEl.style.display = 'none';
  updateHUD();
}

/* 测试钩子 */
window.__testShape = () => biscuit ? biscuit.shape.key : null;
window.__testStamp = key => stampShape(key);
window.__testState = () => ({ state, done: doneCount, streak, bestStreak, wrong: wrongTotal });
</script>

<script>
/* ---- 返回主页：确认弹窗 ---- */
(function () {
  var btn = document.getElementById('btnHome');
  var dlg = document.getElementById('homeConfirm');
  if (!btn || !dlg) return;
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    dlg.classList.add('show');
  });
  document.getElementById('hcOk').addEventListener('click', function () {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (err) {}
    window.location.replace('../index.html');
  });
  document.getElementById('hcCancel').addEventListener('click', function () {
    dlg.classList.remove('show');
  });
  dlg.addEventListener('pointerdown', function (e) {
    if (e.target === dlg) dlg.classList.remove('show');
  });
})();
</script>


<script>
/* ---- 禁用浏览器回退：按物理回退键只会弹确认弹窗 ---- */
(function () {
  var dlg = document.getElementById('homeConfirm');
  /* 无弹窗结构（理论上不会发生）时退化为静默推回 */
  function guardBack() {
    try { history.pushState({ g: 1 }, '', '#guard'); } catch (e) {}
    if (dlg) {
      dlg.classList.add('show');
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    }
  }
  try {
    history.pushState({ g: 1 }, '', '#guard');
    window.addEventListener('popstate', guardBack);
    /* 页面显示状态变化（从 bfcache 恢复）时重新垫垫子 */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { try { history.pushState({ g: 1 }, '', '#guard'); } catch (err) {} }
    });
  } catch (e) {}
})();
</script>
