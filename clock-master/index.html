<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>时钟小管家 · Clock Master</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #0b1026;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: absolute; top: 72px; left: 14px; z-index: 10; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
  .hud-chip { background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); border-radius: 14px; color: #dff2ff; padding: 7px 15px; font-size: 17px; font-weight: 600; box-shadow: 0 4px 18px rgba(0,0,0,.35); backdrop-filter: blur(6px); }
  .hud-chip b { color: #ffd35c; font-size: 21px; }
  #btnMute { position: absolute; top: 12px; right: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); color: #dff2ff; }
  #caption { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 15; background: rgba(10, 16, 40, .85); border: 2px solid rgba(120, 200, 255, .5); border-radius: 18px; color: #dff2ff; padding: 10px 26px; font-size: 20px; font-weight: 700; letter-spacing: 1px; pointer-events: none; white-space: nowrap; max-width: 92vw; text-align: center; }
  #toast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(1); z-index: 30; font-size: 52px; font-weight: 800; color: #ffd35c; text-shadow: 0 4px 18px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap; }
  #toast.pop { opacity: 1; transform: translate(-50%, -58%) scale(1.12); }
  #result { position: absolute; inset: 0; z-index: 40; background: rgba(4, 8, 22, .82); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #result.show { display: flex; }
  .result-card { text-align: center; color: #eaf4ff; background: linear-gradient(160deg, #16224a, #0d1330); border: 2px solid #4f8cff; border-radius: 26px; padding: 30px 44px; box-shadow: 0 20px 60px rgba(0,0,0,.55); max-width: 88vw; }
  .result-card h1 { font-size: 38px; color: #ffd35c; margin-bottom: 12px; }
  .result-card p { font-size: 17px; color: #b9cdf0; margin: 6px 0 22px; line-height: 1.8; }
  .result-card button { font-size: 20px; padding: 12px 42px; border-radius: 999px; border: none; cursor: pointer; background: linear-gradient(90deg, #4f8cff, #59d1ff); color: #fff; font-weight: 700; letter-spacing: 4px; box-shadow: 0 6px 20px rgba(79,140,255,.45); font-family: inherit; }
  #start { position: absolute; inset: 0; z-index: 50; background: radial-gradient(1200px 600px at 50% 30%, #17275e 0%, #0b1026 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #eaf4ff; text-align: center; padding: 20px; }
  #start h1 { font-size: clamp(38px, 8vw, 60px); letter-spacing: 6px; background: linear-gradient(90deg, #ffd35c, #7dffa1, #5cc8ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 14px; }
  #start p { font-size: 16px; color: #9db4d8; line-height: 2; max-width: 560px; }
  #start .rules { margin: 22px 0 28px; }
  #start button { font-size: 21px; padding: 14px 56px; border-radius: 999px; border: none; cursor: pointer; background: linear-gradient(90deg, #37d67a, #59ff9c); color: #06331a; font-weight: 800; letter-spacing: 6px; box-shadow: 0 8px 26px rgba(55,214,122,.45); font-family: inherit; }
  #start button:active { transform: scale(.97); }

/* ---- 返回主页按钮 + 确认弹窗 ---- */
#btnHome { position: absolute; top: 12px; left: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); color: #dff2ff; font-family: inherit; }
#btnHome:active { transform: scale(.94); }
#homeConfirm { position: absolute; inset: 0; z-index: 90; background: rgba(4, 8, 22, .62); display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
#homeConfirm.show { display: flex; }
#homeConfirm .hc-card { text-align: center; background: linear-gradient(160deg, #16224a, #0d1330); border: 2px solid #4f8cff; border-radius: 22px; padding: 26px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.5); max-width: 84vw; }
#homeConfirm .hc-card h2 { font-size: 24px; color: #eaf4ff; margin-bottom: 8px; letter-spacing: 2px; }
#homeConfirm .hc-card p { font-size: 15px; color: #9db4d8; margin: 4px 0 18px; }
#homeConfirm .hc-btns { display: flex; gap: 14px; justify-content: center; }
#homeConfirm button { font-size: 17px; padding: 10px 26px; border-radius: 999px; border: none; cursor: pointer; font-weight: 700; letter-spacing: 2px; font-family: inherit; }
#homeConfirm button:active { transform: scale(.96); }
#hcOk { background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; box-shadow: 0 6px 18px rgba(255,180,70,.4); }
#hcCancel { background: rgba(255,255,255,.12); color: #dff2ff; border: 1px solid rgba(120,200,255,.4) !important; }
</style>
</head>
<body>
<button id="btnHome" title="返回主页">🏠</button>
<div id="homeConfirm">
  <div class="hc-card">
    <h2>🏠 返回游戏主页？</h2>
    <p>当前的游戏进度将会丢失哦</p>
    <div class="hc-btns">
      <button id="hcOk">确认返回</button>
      <button id="hcCancel">再玩一会儿</button>
    </div>
  </div>
</div>

<canvas id="game"></canvas>
<button id="btnMute" title="声音开关">🔊</button>
<div class="hud">
  <div class="hud-chip">答对 <b id="hudRight">0</b> / 14 题</div>
  <div class="hud-chip">连对 <b id="hudStreak">0</b> 🔥</div>
</div>
<div id="caption" style="display:none"></div>
<div id="toast"></div>
<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">⏰ 全部答对！</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再玩一次</button>
  </div>
</div>
<div id="start">
  <h1>时钟小管家</h1>
  <p class="rules">
    大时钟需要你来调！听语音说：<b>"小明 8 点要刷牙"</b>。<br>
    先点<b>小时数字</b>让时针转过去，再点<b>分针该指的数字</b>：<br>
    · <b>8 点整</b> → 先点 <b>8</b>，分针指 12 → 再点 <b>12</b><br>
    · <b>8 点半</b> → 先点 <b>8</b>，分针指 6 → 再点 <b>6</b>（或点「30 分」按钮）<br>
    · <b>2 点 30 分</b>、<b>4 点 50 分</b> 这类 → 先点小时，再点表盘<b>外圈的分钟刻度</b><br>
    一共 14 题，看看你是不是时间小管家！
  </p>
  <button id="btnStart">开始挑战</button>
</div>
<script>
/* 屏蔽右键菜单：防止游戏中误触（触屏板双指/鼠标右键弹出系统菜单打断游戏） */
window.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
 * 时钟小管家 Clock Master —— 单文件 Canvas 小游戏（G12）
 * 点击表盘刻度设时针；半点题点 00/30 大按钮，5 分钟题点表盘外圈分钟刻度。14 题。
 * ========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const STATE = { START: 0, RUNNING: 1, FINISH: 2 };
let state = STATE.START;
let qIndex = 0;                 // 第几题（0 起）
let rightCount = 0, streak = 0, bestStreak = 0, wrongTotal = 0;
let question = null;            // {hour, minutes, sceneKey, askText}
let hourAngle = -Math.PI / 2;   // 时针当前角度（canvas 弧度：-π/2 = 12 点方向）
let hourTarget = 0;             // 时针目标小时（0..11，12 点存 0）
let minuteHandAngle = -Math.PI / 2;  // 分针当前角度（-π/2 = 12 点，初始指向 12）
let hourAnim = null;            // 时针转动动画 {from, sweep, t, dur}
let minuteAnim = null;          // 分针转动动画 {from, sweep, t, dur}
let minPhase = null;            // 'ask-min' = 等待分针（整点题=再点一次；半点/5分题=选分钟）
let minuteShown = 0;            // 分针指向的分钟值
let popT = 0;                   // 答对庆祝
let shake = 0;
let bounceBack = false;         // 答错弹回动画
let settleT = -1;               // 答对后停顿 1s 计时

/* 情境库 */
const SCENES = [
  { key: 'brush', text: '刷牙',  emoji: '🪥' },
  { key: 'eat',   text: '吃午饭', emoji: '🍜' },
  { key: 'sleep', text: '睡觉',  emoji: '😴' },
  { key: 'play',  text: '玩耍',  emoji: '⚽' },
  { key: 'read',  text: '看书',  emoji: '📖' },
  { key: 'school',text: '上学',  emoji: '🎒' },
];
function hourName(h) { return h === 0 ? '12' : String(h); }
/* 分钟部分读法：0→"整"，30→"半"，5→"5分"，50→"50分"（2点30分 = 两点半） */
function minutePhrase(m) {
  if (m === 0) return '点整';
  if (m === 30) return '点半';
  return `点${m}分`;
}
function timeText(h, m) { return `${hourName(h)}${minutePhrase(m)}`; }
/* 分针角度（0=12点方向，顺时针） */
function minuteAngle(m) { return -Math.PI / 2 + (m / 60) * Math.PI * 2; }
/* 时针角度（真实钟表：随分钟连续偏移。2:30 → 指在 2 和 3 正中间）
 * h: 0..11（0=12点），m: 0..59 */
function hourAngleFor(h, m) {
  return -Math.PI / 2 + ((h % 12) + m / 60) * (Math.PI / 6);
}
/* 顺时针扫角归一化到 [0, 2π)：用取模而非 while 循环——
 * 一旦角度为 NaN/Infinity，while 版本会死循环卡死页面。 */
function normSweep(s) {
  if (!isFinite(s)) return 0;
  let x = s % (Math.PI * 2);
  if (x < -0.001) x += Math.PI * 2;
  return x;
}
/* 由点击位置反推"分针该指几分"（按角度吸附到 5 分钟刻度）
 * 12 点方向 = 0 分；这样点半点的「6」、整点的「12」、五分钟刻度
 * 都能直接用"点分针该指的位置"来作答。 */
function minuteFromPoint(x, y) {
  const { cx, cy } = clockCenter();
  const deg = Math.atan2(y - cy, x - cx) * 180 / Math.PI;   // 0°=3点方向, -90°=12点
  let m = (deg + 90) / 6;                                    // 12 点方向 → 0 分
  m = ((m % 60) + 60) % 60;
  return Math.round(m / 5) * 5 % 60;                         // 吸附到 5 分钟
}

const $ = id => document.getElementById(id);
const captionEl = $('caption');
const toastEl = $('toast');

/* 语音 */
const synth = window.speechSynthesis || null;
let zhVoice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice; }
function speak(text) {
  if (muted || !synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = 0.92;
    synth.speak(u);
  } catch (e) {}
}
function say(text) {
  captionEl.style.display = 'block';
  captionEl.textContent = text;
  speak(text);
}

/* 音效 */
let actx = null, muted = false;
function initAudio() {
  if (actx) { actx.resume && actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
}
function beep(freq, dur, type, vol, delay) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxTick  = () => { beep(880, .05, 'sine', .1); };
const sfxRight = () => { beep(660, .1, 'sine', .18); beep(990, .16, 'sine', .18, .1); };
const sfxWrong = () => beep(180, .22, 'sawtooth', .1);
const sfxWin   = () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, .22, 'sine', .17, i * 0.13)); };

$('btnMute').addEventListener('click', () => {
  muted = !muted;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if (muted && synth) synth.cancel();
});

function updateHUD() {
  $('hudRight').textContent = rightCount;
  $('hudStreak').textContent = streak;
}
let toastTimer = null;
function toast(text, good) {
  toastEl.textContent = text;
  toastEl.style.color = good ? '#7dffa1' : '#ffb0a0';
  toastEl.classList.add('pop');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('pop'), 1000);
}

/* 出题：14 题 = 整点 6 + 半点 3 + 5分钟粒度 5（如 2:05、4:50、7:20、9:35、10:45） */
function buildQuestions() {
  const qs = [];
  const usedH = new Set();
  // 整点 6 题
  for (let i = 0; i < 6; i++) {
    let h; do { h = Math.floor(Math.random() * 12); } while (usedH.has(h));
    usedH.add(h);
    const sc = SCENES[i % SCENES.length];
    qs.push({ hour: h, minutes: 0, scene: sc });
  }
  // 半点 3 题
  for (let i = 0; i < 3; i++) {
    let h; do { h = Math.floor(Math.random() * 12); } while (usedH.has(h));
    usedH.add(h);
    const sc = SCENES[(i + 3) % SCENES.length];
    qs.push({ hour: h, minutes: 30, scene: sc });
  }
  // 5 分钟粒度 5 题（排除 0 和 30，避免与上面重复；小时允许复用——共 14 题但只有 12 个小时）
  const fiveMinPool = [5, 10, 15, 20, 25, 35, 40, 45, 50, 55];
  for (let i = 0; i < 5; i++) {
    const h = Math.floor(Math.random() * 12);
    const m = fiveMinPool[Math.floor(Math.random() * fiveMinPool.length)];
    const sc = SCENES[(i + 1) % SCENES.length];
    qs.push({ hour: h, minutes: m, scene: sc });
  }
  return qs;
}
let questions = [];

function askQuestion() {
  question = questions[qIndex];
  hourTarget = 0;
  hourAngle = -Math.PI / 2;      // 重置到 12 点方向
  minuteHandAngle = -Math.PI / 2;
  hourAnim = null;
  minuteAnim = null;
  minPhase = null;
  minuteShown = 0;
  bounceBack = false;
  settleT = -1;
  const m = question.minutes;
  if (m === 0) {
    say(`小明 ${hourName(question.hour)} 点要${question.scene.text}。整点要这样做：先点数字 ${hourName(question.hour)} 让时针指过去，再点数字 12 让分针指到 12！`);
  } else {
    say(m === 30
      ? `小明 ${hourName(question.hour)} 点半要${question.scene.text}。先点数字 ${hourName(question.hour)} 让时针过去，再点数字 6 让分针指到 6！`
      : `小明要${question.scene.text}啦，把时钟调到 ${timeText(question.hour, m)}！先点数字 ${hourName(question.hour)} 的刻度`);
  }
}

/* 第一次点击数字：时针平滑转到该位置 */
function setHour(h) {
  if (state !== STATE.RUNNING || !question) return;
  if (minPhase === 'ask-min') {
    /* 已在等分针阶段：此次点击是"第二次点数字"→ 分针按小时刻度转向该处对应的分钟？
       不——分针只能点分钟刻度。忽略小时点击，提示选分针 */
    say('时针已经对啦！现在点表盘外圈的分针刻度');
    return;
  }
  sfxTick();
  const want = question.hour;
  if (h === want) {
    /* 正确的小时：时针先转向该小时刻度（分钟偏移在分针到位后补上） */
    hourTarget = h;
    const to = hourAngleFor(h, 0);
    /* 顺时针扫（从当前位置正向转到目标） */
    const sweep = normSweep(to - hourAngle);          /* 顺时针正向，安全归一化 */
    hourAnim = { from: hourAngle, sweep, t: 0, dur: Math.max(0.5, Math.abs(sweep) * 0.28) };
    minPhase = 'ask-min';
    minuteShown = -1;
    const m = question.minutes;
    if (m === 0) {
      /* 整点：0 分 = 分针指 12。第二下点 12，不是再点小时数字 */
      say(`时针指到 ${hourName(h)} 啦！整点时，分针要指着 12——点一下数字 12！`);
    } else if (m === 30) {
      say(`时针对啦！半点的时候分针要指着 6——点一下数字 6，或者点下面的「30 分」按钮！`);
    } else {
      say(`时针对啦！现在点外圈的「${m} 分」刻度，分针转过去！`);
    }
  } else {
    /* 错：时针也转过去再弹回 */
    wrongTotal++;
    streak = 0;
    bounceBack = true;
    shake = 0.3;
    sfxWrong();
    toast(`正确时间是 ${timeText(question.hour, question.minutes)}`);
    speak(`现在指向 ${hourName(h)} 点，正确的是 ${timeText(question.hour, question.minutes)}哦，再转一次！`);
    updateHUD();
  }
}

/* 第二次点击（分针）：整点题=再点同一小时刻度；半点/5分题=点分钟刻度 */
function setMinute(m) {
  if (state !== STATE.RUNNING || !question || minPhase !== 'ask-min') return;
  if (hourAnim && hourAnim.t < hourAnim.dur) {
    say('时针还在转呢，等它停好再点分针哦');   // 不静默吞点击，给孩子明确反馈
    return;
  }
  if (minuteAnim) {
    say('分针正在转，等它停下来');             // 同上
    return;
  }
  sfxTick();
  minuteShown = m;
  const to = minuteAngle(m);
  let sweep = normSweep(to - minuteHandAngle);
  /* 分针已经在目标位置（整点题常见：分针本就停在 12）时，sweep≈0 会让针
   * 一动不动、孩子以为没生效。给一个「先摆出去再回到 12」的确认动画。 */
  if (Math.abs(sweep) < 0.02) {
    sweep = Math.PI * 2;                       // 完整转一圈回来，视觉上明确"分针动了"
  }
  minuteAnim = { from: minuteHandAngle, sweep, t: 0, dur: Math.max(0.55, Math.abs(sweep) * 0.22), answer: m };
  /* 分针转到位后由 update 判定对错 → 停顿 1s → 下一题 */
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResult();
  } else {
    askQuestion();
  }
}
function showResult() {
  let title, medal;
  if (bestStreak >= 12)     { title = '🥇 金牌时间管家！'; medal = '金牌'; }
  else if (bestStreak >= 8) { title = '🥈 银牌时间管家！'; medal = '银牌'; }
  else if (bestStreak >= 3) { title = '🥉 铜牌时间管家！'; medal = '铜牌'; }
  else                      { title = '⏰ 全部答完！';     medal = '继续加油'; }
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML =
    `答对 <b style="color:#ffd35c">${rightCount}</b> / 14 题（${medal}）<br>` +
    `最佳连对 <b style="color:#ffd35c">${bestStreak}</b> 次 · 答错 <b style="color:#ff9d9d">${wrongTotal}</b> 次<br>` +
    `整点、半点、五分钟时刻全都认识啦！`;
  $('result').classList.add('show');
  state = STATE.FINISH;
  speak(`全部答完！你答对了${rightCount}题，获得${medal}！`);
}

/* 布局 */
function clockCenter() { return { cx: W / 2, cy: H * 0.48, r: Math.min(W, H) * 0.26 }; }
/* 分钟选择：半点题用两个大按钮；5 分钟题用表盘外的分钟刻度点 */
function minButtons() {
  const { cx, cy, r } = clockCenter();
  const bw = Math.min(110, W * 0.2), bh = 56;
  return {
    zero: { x: cx - r - bw - 24, y: cy - bh / 2, w: bw, h: bh, label: '00 分' },
    thirty: { x: cx + r + 24, y: cy - bh / 2, w: bw, h: bh, label: '30 分' },
  };
}
/* 5 分钟题的分钟刻度热区（12 个点，绕表盘外圈） */
function minuteTicks() {
  const { cx, cy, r } = clockCenter();
  const ticks = [];
  for (let i = 0; i < 12; i++) {
    const m = i * 5;
    const a = minuteAngle(m);
    ticks.push({
      m,
      x: cx + Math.cos(a) * (r * 1.22),
      y: cy + Math.sin(a) * (r * 1.22),
      label: m === 0 ? '00' : String(m),
    });
  }
  return ticks;
}

/* 绘制 */
function drawScene(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#101a3c');
  bg.addColorStop(1, '#0b1026');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  /* 星点 */
  ctx.fillStyle = 'rgba(220,235,255,.5)';
  for (let i = 0; i < 36; i++) {
    const x = (i * 137.5) % W, y = (i * 89.3) % (H * 0.35);
    ctx.globalAlpha = 0.15 + 0.25 * (0.5 + 0.5 * Math.sin(t + i));
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  /* 情境小场景（右下角提示当前活动） */
  if (question) {
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.font = '52px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(question.scene.emoji, W * 0.86, H * 0.82);
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#b9cdf0';
    ctx.fillText(`小明要${question.scene.text}`, W * 0.86, H * 0.82 + 44);
    ctx.restore();
  }
}
function drawClock(t) {
  const { cx, cy, r } = clockCenter();
  ctx.save();
  ctx.translate(cx, cy);
  /* 表盘 */
  const g = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#fdf6e3');
  g.addColorStop(1, '#e8d9b8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8a6a42'; ctx.lineWidth = 8;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(138,106,66,.4)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, r - 12, 0, Math.PI * 2); ctx.stroke();
  /* 刻度数字 12 个（可点击大热区） */
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + i * (Math.PI / 6);
    const nx = Math.cos(a) * (r * 0.78), ny = Math.sin(a) * (r * 0.78);
    const hNum = i === 0 ? 12 : i;
    /* 命中态高亮 */
    const isSel = (i % 12) === (hourTarget % 12) && hourTarget >= 0;
    ctx.beginPath();
    ctx.arc(nx, ny, r * 0.135, 0, Math.PI * 2);
    ctx.fillStyle = isSel ? '#ffd35c' : 'rgba(255,255,255,.55)';
    ctx.fill();
    ctx.strokeStyle = isSel ? '#c9922a' : 'rgba(138,106,66,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#1a2a55';
    ctx.font = `bold ${Math.round(r * 0.16)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(hNum), nx, ny + 1);
    /* 等分针阶段：在"分针该指的位置"画呼吸光圈，明确提示「该点这里」
     * 整点 → 12（i=0）；半点 → 6（i=6）；五分钟 → 分钟数对应的刻度 */
    if (minPhase === 'ask-min' && question) {
      const wantIdx = question.minutes === 0 ? 0
        : question.minutes === 30 ? 6
        : question.minutes % 5 === 0 ? (question.minutes / 5) % 12 : -1;
      if (i === wantIdx) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 6);
        ctx.strokeStyle = 'rgba(79,140,255,' + (0.55 + 0.45 * pulse) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(nx, ny, r * 0.135 + 7 + pulse * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    /* 小刻度点 */
    const dx = Math.cos(a) * r * 0.94, dy = Math.sin(a) * r * 0.94;
    ctx.fillStyle = '#8a6a42';
    ctx.beginPath(); ctx.arc(dx, dy, 4, 0, Math.PI * 2); ctx.fill();
  }
  /* 分针：用动画角度（转动平滑），待选时停 12 点方向
   * 注意：指针几何沿 +X（3 点方向）绘制，与刻度数字的 (cos θ, sin θ)
   * 约定完全一致——这样 rotate(角度) 后指针精确指向该角度对应的刻度。
   * （若沿 -Y 画，同样的角度会让指针整体逆时针偏 90°） */
  const mAng = minuteShown >= 0 ? minuteHandAngle : -Math.PI / 2;
  ctx.save();
  ctx.rotate(mAng);
  ctx.strokeStyle = '#3a5a9a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * 0.12, 0); ctx.lineTo(r * 0.62, 0); ctx.stroke();
  ctx.restore();
  /* 时针 */
  const hb = bounceBack ? Math.sin(t * 30) * 0.1 : 0;
  ctx.save();
  ctx.rotate(hourAngle + hb);
  ctx.strokeStyle = '#b03c3c'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * 0.14, 0); ctx.lineTo(r * 0.42, 0); ctx.stroke();
  ctx.restore();
  /* 中心圆 */
  ctx.fillStyle = '#1a2a55';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawMinButtons(t) {
  if (minPhase !== 'ask-min') return;
  if (!question) return;
  if (question.minutes === 30) {
    /* 半点题：00 / 30 两个大按钮 */
    const btns = minButtons();
    const pulse = 1 + Math.sin(t * 6) * 0.04;
    for (const key of ['zero', 'thirty']) {
      const b = btns[key];
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = 'rgba(22,34,74,.95)';
      roundR(-b.w / 2, -b.h / 2, b.w, b.h, 16);
      ctx.fill();
      ctx.strokeStyle = '#4f8cff'; ctx.lineWidth = 3;
      roundR(-b.w / 2, -b.h / 2, b.w, b.h, 16);
      ctx.stroke();
      ctx.fillStyle = '#eaf4ff';
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.label, 0, 0);
      ctx.restore();
    }
    /* 顶部提示 */
    ctx.fillStyle = '#ffd35c';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('选哪个：00 分 还是 30 分？', W / 2, clockCenter().cy - clockCenter().r - 40);
  } else {
    /* 5 分钟题：表盘外圈分钟刻度点 */
    const ticks = minuteTicks();
    const pulse = 1 + Math.sin(t * 6) * 0.08;
    for (const tk of ticks) {
      ctx.save();
      ctx.translate(tk.x, tk.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = 'rgba(22,34,74,.95)';
      ctx.beginPath(); ctx.arc(0, 0, Math.min(26, W * 0.032), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4f8cff'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, Math.min(26, W * 0.032), 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#eaf4ff';
      ctx.font = `bold ${Math.min(17, W * 0.022)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(tk.label, 0, 1);
      ctx.restore();
    }
    /* 顶部提示 */
    ctx.fillStyle = '#ffd35c';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点分针应指的分钟刻度', W / 2, clockCenter().cy - clockCenter().r - 40);
  }
}
function drawPop(t) {
  if (popT <= 0) return;
  const k = 1 - popT;
  ctx.save();
  ctx.globalAlpha = Math.max(0, popT);
  ctx.font = `bold ${52 + k * 20}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7dffa1';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10;
  ctx.fillText('✓ 对啦！', W / 2, H * 0.16 - k * 30);
  ctx.restore();
}
function roundR(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function update(dt, t) {
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (popT > 0) popT = Math.max(0, popT - dt);
  /* 时针动画 */
  if (hourAnim) {
    hourAnim.t += dt;
    const k = Math.min(1, hourAnim.t / hourAnim.dur);
    const e = 1 - Math.pow(1 - k, 3);              /* easeOutCubic */
    hourAngle = hourAnim.from + hourAnim.sweep * e;
    if (k >= 1) hourAngle = hourAnim.from + hourAnim.sweep;
  }
  /* 分针动画 */
  if (minuteAnim) {
    minuteAnim.t += dt;
    const k = Math.min(1, minuteAnim.t / minuteAnim.dur);
    const e = 1 - Math.pow(1 - k, 3);
    minuteHandAngle = minuteAnim.from + minuteAnim.sweep * e;
    if (k >= 1) minuteHandAngle = minuteAnim.from + minuteAnim.sweep;
  }
  /* 分针动画完成 → 判定对错（hourAnim 完成后分针才开始，此处必已到位） */
  if (minuteAnim && minuteAnim.t >= minuteAnim.dur) {
    const ans = minuteAnim.answer;
    minuteAnim = null;
    if (question && ans === question.minutes) {
      /* 对：分针到位 → 时针补上分钟偏移（真实钟面：2:30 时针指 2、3 之间）
       * 然后报分 + 停顿 1s */
      minuteShown = ans;
      const wantHourAngle = hourAngleFor(question.hour, ans);
      const hSweep = normSweep(wantHourAngle - hourAngle);
      /* 偏移量接近 0（已在正确位置）或接近整圈（顺时针扫一圈）都无需动画 */
      if (hSweep > 0.002 && hSweep < Math.PI * 2 - 0.002) {
        hourAnim = { from: hourAngle, sweep: hSweep, t: 0, dur: 0.5 };
      }
      rightCount++;
      streak++;
      if (streak > bestStreak) bestStreak = streak;
      popT = 1.2;
      sfxRight();
      toast(`${timeText(question.hour, question.minutes)} ✓`, true);
      speak(`答对啦！${timeText(question.hour, question.minutes)}，小明去${question.scene.text}喽！`);
      updateHUD();
      question = null;
      settleT = 1.4;      /* 多留一点时间让孩子看清时针偏移后的钟面 */
    } else if (question) {
      /* 错：分针弹回 12 点 + 提示 */
      wrongTotal++;
      streak = 0;
      shake = 0.3;
      sfxWrong();
      toast(`分针应该指 ${question.minutes} 分哦`);
      speak(`分针应该指${question.minutes}分哦，再试试！`);
      updateHUD();
      const to = -Math.PI / 2;
      const sweepBack = normSweep(to - minuteHandAngle);
      minuteAnim = { from: minuteHandAngle, sweep: sweepBack, t: 0, dur: 0.6, answer: null };
      minuteShown = -1;
    }
  }
  /* 停顿 1s 后 → 下一题 */
  if (settleT > 0) {
    settleT -= dt;
    if (settleT <= 0) {
      settleT = -1;
      nextQuestion();
    }
  }
}
function render(t) {
  ctx.save();
  if (shake > 0) {
    const m = shake * 8;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }
  drawScene(t);
  drawClock(t);
  drawMinButtons(t);
  drawPop(t);
  ctx.restore();
}

let lastT = 0;
function frame(now) {
  const dt = Math.min(0.05, lastT === 0 ? 0.016 : (now - lastT) / 1000);
  lastT = now;
  if (state === STATE.RUNNING) update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 点击：先分钟按钮，再表盘刻度 */
canvas.addEventListener('pointerdown', e => {
  if (state !== STATE.RUNNING) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);
  /* ---- 等分针阶段：统一用「点分针该指的位置」作答 ----
   * · 整点   → 点 12（分针指 12）
   * · 半点   → 点 6（分针指 6）——也保留「00 分 / 30 分」大按钮
   * · 五分钟 → 点对应位置（内圈数字或外圈刻度都可以）
   * 按点击方向吸附到 5 分钟，宽容度大、幼儿好点。 */
  if (minPhase === 'ask-min') {
    if (!question) return;
    /* 半点题：先看两个大按钮（手指粗的小朋友也能点中） */
    if (question.minutes === 30) {
      const btns = minButtons();
      for (const key of ['zero', 'thirty']) {
        const b = btns[key];
        if (x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8) {
          setMinute(key === 'zero' ? 0 : 30);
          return;
        }
      }
    }
    /* 表盘区域内的点击：按角度吸附出分钟数 */
    const { cx, cy, r } = clockCenter();
    const dist = Math.hypot(x - cx, y - cy);
    if (dist > r * 1.45 || dist < r * 0.25) return;    /* 太远/太靠近圆心：忽略 */
    const clicked = minuteFromPoint(x, y);
    if (clicked === question.minutes) {
      setMinute(question.minutes);
    } else {
      /* 点错方向：给明确语音引导（不再静默无反应） */
      wrongTotal++;
      streak = 0;
      updateHUD();
      sfxWrong();
      shake = 0.2;
      const need = question.minutes === 0 ? '12' : question.minutes === 30 ? '6' : question.minutes + ' 分';
      const nowAt = clicked === 0 ? '12' : clicked === 30 ? '6' : clicked + ' 分';
      say(question.minutes === 0
        ? `你点到 ${nowAt} 啦。整点的分针要指着 12——点一下数字 12！`
        : question.minutes === 30
          ? `你点到 ${nowAt} 啦。半点的分针要指着 6——点一下数字 6！`
          : `你点到 ${nowAt} 啦。分针要指着 ${need} 的位置，再试试！`);
    }
    return;
  }
  /* 表盘刻度（0..11；点击显示 12 的位置 → 0） */
  const { cx, cy, r } = clockCenter();
  const dx = x - cx, dy = y - cy;
  if (Math.hypot(dx, dy) > r * 1.15) return;
  let best = -1, bestD = 1e9;
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + i * (Math.PI / 6);
    const nx = cx + Math.cos(a) * (r * 0.78), ny = cy + Math.sin(a) * (r * 0.78);
    const d = Math.hypot(x - nx, y - ny);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (bestD <= r * 0.2) setHour(best);          /* 直接传 0..11，12 点即 0 */
});

/* 开始 / 重开 */
$('btnStart').addEventListener('click', () => {
  initAudio();
  $('start').style.display = 'none';
  resetGame();
  state = STATE.RUNNING;
});
$('btnRestart').addEventListener('click', () => {
  $('result').classList.remove('show');
  resetGame();
  state = STATE.RUNNING;
});
function resetGame() {
  qIndex = 0; rightCount = 0; streak = 0; bestStreak = 0; wrongTotal = 0;
  questions = buildQuestions();
  question = null;
  hourAngle = -Math.PI / 2; hourTarget = 0; minuteHandAngle = -Math.PI / 2; minuteShown = 0; minPhase = null;
  hourAnim = null; minuteAnim = null;
  popT = 0; shake = 0; bounceBack = false; settleT = -1;
  captionEl.style.display = 'none';
  updateHUD();
  askQuestion();
}

/* 测试钩子 */
window.__testSetHour = h => setHour(h);
window.__testSetMinute = m => setMinute(m);
/* 同步推进若干毫秒（含动画与判定），供无竞态的自动化校验使用 */
window.__testTick = ms => {
  const step = 16.7;
  for (let e = 0; e < ms; e += step) update(step / 1000, 0);
};
window.__testState = () => ({
  state, qIndex, right: rightCount, streak, bestStreak, wrong: wrongTotal,
  hour: question ? question.hour : null, minutes: question ? question.minutes : null, minPhase,
  /* 指针角度（度，0°=3点方向，-90°/270°=12点方向）—— 便于校验钟面准确性 */
  hourDeg: Math.round(((hourAngle * 180 / Math.PI) % 360 + 360) % 360),
  minuteDeg: Math.round(((minuteHandAngle * 180 / Math.PI) % 360 + 360) % 360),
  /* 当前题目的"正确钟面"应有角度 */
  wantHourDeg: question ? Math.round(((hourAngleFor(question.hour, question.minutes) * 180 / Math.PI) % 360 + 360) % 360) : null,
  wantMinuteDeg: question ? Math.round(((minuteAngle(question.minutes) * 180 / Math.PI) % 360 + 360) % 360) : null,
});
</script>

<script>
/* ---- 返回主页：确认弹窗 ---- */
(function () {
  var btn = document.getElementById('btnHome');
  var dlg = document.getElementById('homeConfirm');
  if (!btn || !dlg) return;
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    dlg.classList.add('show');
  });
  document.getElementById('hcOk').addEventListener('click', function () {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (err) {}
    window.location.replace('../index.html');
  });
  document.getElementById('hcCancel').addEventListener('click', function () {
    dlg.classList.remove('show');
  });
  dlg.addEventListener('pointerdown', function (e) {
    if (e.target === dlg) dlg.classList.remove('show');
  });
})();
</script>


<script>
/* ---- 禁用浏览器回退：按物理回退键只会弹确认弹窗 ---- */
(function () {
  var dlg = document.getElementById('homeConfirm');
  /* 无弹窗结构（理论上不会发生）时退化为静默推回 */
  function guardBack() {
    try { history.pushState({ g: 1 }, '', '#guard'); } catch (e) {}
    if (dlg) {
      dlg.classList.add('show');
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    }
  }
  try {
    history.pushState({ g: 1 }, '', '#guard');
    window.addEventListener('popstate', guardBack);
    /* 页面显示状态变化（从 bfcache 恢复）时重新垫垫子 */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { try { history.pushState({ g: 1 }, '', '#guard'); } catch (err) {} }
    });
  } catch (e) {}
})();
</script>
