<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>极速飞车 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1530; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; display: block; }

  /* HUD */
  .hud { position: fixed; top: 72px; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 5; }
  .hud-chip {
    background: rgba(10, 18, 42, .68); color: #eaf2ff;
    border: 1px solid rgba(130, 190, 255, .30); border-radius: 999px;
    padding: 8px 18px; font-size: 17px; font-weight: 700; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  .hud-chip b { color: #ffd35c; font-size: 20px; }
  #hudLap small, #hudTime small { color: #9db4d8; font-size: 13px; font-weight: 600; }
  #hudSpeed { min-width: 130px; text-align: center; }
  #hudSpeed small { display: block; font-size: 11px; color: #9db4d8; letter-spacing: 2px; margin-top: -2px; }

  /* 圈数进度 */
  #lapDots { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; pointer-events: none; }
  .lap-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.4); }
  .lap-dot.done { background: #ffd35c; border-color: #ffd35c; box-shadow: 0 0 8px rgba(255, 211, 92, .8); }
  .lap-dot.cur { border-color: #7dffa1; background: rgba(125, 255, 161, .35); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 2px rgba(125,255,161,.4); } to { box-shadow: 0 0 10px rgba(125,255,161,.95); } }

  /* 计次板（超车数） */
  #posBoard {
    position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 18, 42, .55); border: 1px solid rgba(130, 190, 255, .22);
    border-radius: 12px; padding: 5px 14px; color: #cfe2ff; font-size: 13px; font-weight: 600;
    z-index: 5; pointer-events: none; letter-spacing: 1px;
  }

  /* 冲出赛道提示条 */
  #offroadTip {
    position: fixed; top: 62%; left: 50%; transform: translateX(-50%);
    background: rgba(140, 26, 26, .82); border: 2px solid rgba(255, 110, 110, .9);
    border-radius: 14px; padding: 10px 26px; color: #ffe3e3;
    font-size: 19px; font-weight: 800; letter-spacing: 1px;
    z-index: 5; pointer-events: none; opacity: 0;
    transition: opacity .18s; text-shadow: 0 2px 6px rgba(0,0,0,.5);
    white-space: nowrap;
  }

  /* 触屏转向按钮（移动端） */
  #touchUI { position: fixed; bottom: 0; left: 0; right: 0; display: none; z-index: 6; padding: 18px 22px calc(18px + env(safe-area-inset-bottom)); justify-content: space-between; }
  #touchUI button {
    width: 92px; height: 92px; border-radius: 50%; border: 2px solid rgba(150, 210, 255, .55);
    background: rgba(20, 34, 70, .55); color: #dff2ff; font-size: 34px; font-weight: 800;
    backdrop-filter: blur(4px); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #touchUI button:active { background: rgba(70, 130, 220, .6); }

  /* 开始界面 */
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(7, 13, 32, .92), rgba(7, 13, 32, .55) 45%, rgba(7, 13, 32, .92));
    color: #fff; padding: 20px;
  }
  #start h1 { font-size: 46px; letter-spacing: 4px; text-shadow: 0 4px 24px rgba(60, 140, 255, .55); margin-bottom: 8px; }
  #start .sub { color: #9db4d8; font-size: 16px; margin-bottom: 26px; }
  #start .rules {
    background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35);
    border-radius: 18px; padding: 20px 30px; color: #cfe2ff; font-size: 17px; line-height: 2.1;
    max-width: 560px; margin-bottom: 28px;
  }
  #start .rules b { color: #ffd35c; }
  #start .rules kbd {
    display: inline-block; background: linear-gradient(160deg, #1c2a58, #101a3e);
    border: 1px solid rgba(150, 210, 255, .5); border-bottom-width: 3px; border-radius: 8px;
    color: #dff2ff; font-family: inherit; font-size: 16px; font-weight: 800;
    padding: 2px 12px; margin: 0 3px; box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  #start button {
    font-size: 22px; font-weight: 800; letter-spacing: 6px;
    padding: 15px 70px; border-radius: 999px; border: none; cursor: pointer;
    color: #07240f; background: linear-gradient(160deg, #7dffa1, #2ecc71);
    box-shadow: 0 6px 26px rgba(46, 204, 113, .45), inset 0 2px 3px rgba(255,255,255,.5);
    transition: transform .12s;
  }
  #start button:hover { transform: scale(1.06); }
  #start .kbd-tip { margin-top: 16px; color: #9db4d8; font-size: 14px; }

  /* 结算界面 */
  #result {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 10, 26, .78); backdrop-filter: blur(5px);
  }
  #result.show { display: flex; }
  .result-card {
    background: linear-gradient(165deg, #14224a, #0c1531);
    border: 1px solid rgba(140, 200, 255, .35); border-radius: 24px;
    padding: 34px 52px; text-align: center; color: #fff;
    box-shadow: 0 20px 70px rgba(0, 0, 0, .6);
    animation: pop .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result-card h1 { font-size: 34px; margin-bottom: 10px; }
  .result-card p { color: #cfe2ff; font-size: 17px; line-height: 2; }
  .result-card p b { color: #ffd35c; font-size: 20px; }
  .result-card button {
    margin-top: 18px; font-size: 19px; font-weight: 800; letter-spacing: 3px;
    padding: 12px 46px; border-radius: 999px; border: none; cursor: pointer;
    color: #07240f; background: linear-gradient(160deg, #7dffa1, #2ecc71);
    box-shadow: 0 5px 20px rgba(46, 204, 113, .4);
  }
  .result-card button:hover { transform: scale(1.05); }

/* ---- 返回主页按钮 + 确认弹窗 ---- */
#btnHome { position: absolute; top: 12px; left: 12px; z-index: 60; font-size: 20px; line-height: 1; padding: 9px 13px; border-radius: 12px; cursor: pointer; background: rgba(10, 16, 40, .72); border: 1px solid rgba(120, 200, 255, .35); color: #dff2ff; font-family: inherit; }
#btnHome:active { transform: scale(.94); }
#homeConfirm { position: absolute; inset: 0; z-index: 90; background: rgba(4, 8, 22, .62); display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
#homeConfirm.show { display: flex; }
#homeConfirm .hc-card { text-align: center; background: linear-gradient(160deg, #16224a, #0d1330); border: 2px solid #4f8cff; border-radius: 22px; padding: 26px 34px; box-shadow: 0 18px 50px rgba(0,0,0,.5); max-width: 84vw; }
#homeConfirm .hc-card h2 { font-size: 24px; color: #eaf4ff; margin-bottom: 8px; letter-spacing: 2px; }
#homeConfirm .hc-card p { font-size: 15px; color: #9db4d8; margin: 4px 0 18px; }
#homeConfirm .hc-btns { display: flex; gap: 14px; justify-content: center; }
#homeConfirm button { font-size: 17px; padding: 10px 26px; border-radius: 999px; border: none; cursor: pointer; font-weight: 700; letter-spacing: 2px; font-family: inherit; }
#homeConfirm button:active { transform: scale(.96); }
#hcOk { background: linear-gradient(90deg, #ff9c5c, #ffd35c); color: #3a2200; box-shadow: 0 6px 18px rgba(255,180,70,.4); }
#hcCancel { background: rgba(255,255,255,.12); color: #dff2ff; border: 1px solid rgba(120,200,255,.4) !important; }
</style>
</head>
<body>
<button id="btnHome" title="返回主页">🏠</button>
<div id="homeConfirm">
  <div class="hc-card">
    <h2>🏠 返回游戏主页？</h2>
    <p>当前的游戏进度将会丢失哦</p>
    <div class="hc-btns">
      <button id="hcOk">确认返回</button>
      <button id="hcCancel">再玩一会儿</button>
    </div>
  </div>
</div>

<canvas id="game"></canvas>

<div class="hud">
  <div class="hud-chip" id="hudLap">第 <b id="lapNum">1</b> / 3 圈</div>
  <div class="hud-chip" id="hudSpeed"><b id="speedNum">0</b> km/h<small>SPEED</small></div>
  <div class="hud-chip" id="hudTime"><small>TIME</small> <b id="timeNum">0:00.0</b></div>
</div>
<div id="lapDots"></div>
<div id="posBoard">🏆 完赛 <b id="posNum" style="color:#ffd35c">6</b> / 6 · 超越 <b id="passNum" style="color:#7dffa1">0</b> 辆</div>
<div id="offroadTip">⚠️ 冲出赛道了！按 ← 或 → 回到路面</div>
<div id="countdown"></div>

<div id="touchUI">
  <button id="btnLeft" aria-label="左转">◀</button>
  <button id="btnRight" aria-label="右转">▶</button>
</div>

<div id="start">
  <h1>🏎️ 极速飞车 3D</h1>
  <div class="sub">THREE.JS RACING</div>
  <div class="rules">
    一场 <b>3 圈</b>的公路竞速，你要从最后一名追到冠军！<br>
    油门是自动的，你只需要掌握<b>方向</b>：<br>
    <kbd>←</kbd> 向左转弯　<kbd>→</kbd> 向右转弯<br>
    撞上对手或冲出赛道会减速，跑稳才是最快路线。
  </div>
  <button id="btnStart">出 发</button>
  <p class="kbd-tip">按 <b>回车</b> 也能发车 · 触屏设备用屏幕下方的左右按钮</p>
</div>

<div id="result">
  <div class="result-card">
    <h1 id="resultTitle">🏁 比赛结束</h1>
    <p id="resultDesc"></p>
    <button id="btnRestart">再跑一次</button>
  </div>
</div>

<script src="three.min.js"></script>
<script>
/* 屏蔽右键菜单：防止游戏中误触（触屏板双指/鼠标右键弹出系统菜单打断游戏） */
window.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
 * 极速飞车 3D Racing —— 单文件 three.js 赛车（非教育向）
 * 自动油门，仅左右方向键/触屏按钮控制转向；
 * 程序化闭合弯道 + 5 辆 AI 对手 + 3 圈计分 + 名次结算。
 * ========================================================= */
'use strict';

const canvas = document.getElementById('game');
const $ = id => document.getElementById(id);

/* ---------- 基础常量 ---------- */
const LAPS_TOTAL   = 3;      // 总圈数
const RIVALS_COUNT = 5;      // AI 对手数
const ROAD_W       = 11;     // 路面半宽
const CURVE_SEG    = 220;    // 赛道中心线采样段数
const AI_SPEEDS    = [30.5, 31.3, 32.1, 32.9, 33.7]; // 对手基础速度 m/s（玩家极速 34，想赢必须走线）

const STATE = { START: 0, COUNTDOWN: 1, RUNNING: 2, FINISH: 3 };
let state = STATE.START;

/* ---------- 渲染器 / 场景 / 相机 ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x89c6f5);
scene.fog = new THREE.Fog(0x9fd0f7, 90, 320);

const camera = new THREE.PerspectiveCamera(64, window.innerWidth / window.innerHeight, 0.1, 600);

/* 灯光：环境 + 太阳（开阴影：PCFSoft + 紧凑正交 frustum 跟随玩家，2048 贴图
 * 覆盖 ±90m，树和车在路面上投出软边影子，同时保住 60fps） */
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3a7d3f, 0.95));
const sun = new THREE.DirectionalLight(0xfff4d6, 1.15);
sun.position.set(60, 110, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SC = sun.shadow.camera;          // 正交阴影相机
SC.left = -90; SC.right = 90; SC.top = 90; SC.bottom = -90;
SC.near = 20; SC.far = 260;
sun.shadow.bias = -0.0004;             // 技能库推荐：消除 shadow acne
sun.shadow.normalBias = 0.02;
const SUN_OFF = new THREE.Vector3(60, 110, 40);   // 太阳相对目标的固定偏移
scene.add(sun);
scene.add(sun.target);                  // target 也要进场景才会更新矩阵
/* frustum ±110：覆盖玩家周围 90m 内的树（对角最坏 ~127m 只在最角落，树稀疏可接受；
 * 2048 贴图下 220m 宽 → ~9.3cm/texel，车速尺度下足够软清晰） */
SC.left = -110; SC.right = 110; SC.top = 110; SC.bottom = -110;
SC.updateProjectionMatrix();

/* ---------- 赛道中心线（程序化闭合曲线） ---------- */
const curvePts = [];
(function buildTrack() {
  /* 用椭圆 + 3 个不同相位的正弦扰动，捏出一条有机的闭合赛道 */
  for (let i = 0; i < CURVE_SEG; i++) {
    const a = i / CURVE_SEG * Math.PI * 2;
    const R = 130;
    const w1 = Math.sin(a * 2 + 0.6) * 26;
    const w2 = Math.sin(a * 3 - 1.2) * 14;
    const w3 = Math.cos(a * 5 + 2.0) * 6;
    const r = R + w1 + w2 + w3;
    curvePts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
  }
})();
const center = new THREE.CatmullRomCurve3(curvePts, true, 'catmullrom', 0.5);
const trackLen = center.getLength();
const SEG_SAMPLES = 700;   // 均匀弧长采样（用于帧间位置推进）
const centerSamples = center.getSpacedPoints(SEG_SAMPLES); // 闭环含首尾重复点
/* 每个采样点的切线 / 内法线（左手） */
const tangents = [], normals = [];
for (let i = 0; i < SEG_SAMPLES; i++) {
  const p = centerSamples[i];
  const q = centerSamples[(i + 1) % SEG_SAMPLES];
  const t = q.clone().sub(p).setY(0).normalize();
  tangents.push(t);
  normals.push(new THREE.Vector3(-t.z, 0, t.x)); // 指向弯道内侧（左）
}

/* 距离 s（0..trackLen）→ 采样索引 */
function sToIdx(s) {
  s = ((s % trackLen) + trackLen) % trackLen;
  return Math.floor(s / trackLen * SEG_SAMPLES) % SEG_SAMPLES;
}
/* 距离 s + 横向偏移 o → 世界坐标（含平滑插值） */
function trackPos(s, o, y) {
  const f = ((s % trackLen) + trackLen) % trackLen / trackLen * SEG_SAMPLES;
  const i = Math.floor(f) % SEG_SAMPLES;
  const k = f - Math.floor(f);
  const p0 = centerSamples[i], p1 = centerSamples[(i + 1) % SEG_SAMPLES];
  const t0 = tangents[i], t1 = tangents[(i + 1) % SEG_SAMPLES];
  const n0 = normals[i], n1 = normals[(i + 1) % SEG_SAMPLES];
  const pos = p0.clone().lerp(p1, k);
  const nor = n0.lerp(n1, k).normalize();
  pos.addScaledVector(nor, o);
  pos.y = y || 0;
  return pos;
}
/* 距离 s 处的曲率（估算弯道方向强度，AI 用） */
function curvatureAt(s) {
  const i = sToIdx(s);
  const n0 = normals[i], n1 = normals[(i + 4) % SEG_SAMPLES];
  return n1.dot(n0); // ~1 直道，<1 弯道
}

/* ---------- 天空穹顶：大球 BackSide + 上下渐变 shader ----------
 * 技能库 threejs-shaders 的渐变模式；地平线附近叠一条热霾亮带衔接雾色 */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(560, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x2e7fd4) },   // 天顶
      midColor: { value: new THREE.Color(0x9fd0f7) },   // 地平线（衔接雾色）
      hazeColor: { value: new THREE.Color(0xeaf6ff) },  // 近地平线亮带
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor, midColor, hazeColor;
      varying vec3 vDir;
      void main() {
        float h = clamp(vDir.y, 0.0, 1.0);
        vec3 col = mix(midColor, topColor, pow(h, 0.75));
        col = mix(col, hazeColor, smoothstep(0.28, 0.02, h) * 0.55);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  })
);
sky.frustumCulled = false;
scene.add(sky);
/* 太阳光晕：贴在穹顶内侧的加法混合亮斑，位置与太阳光方向一致 */
{
  const sunHalo = new THREE.Mesh(
    new THREE.CircleGeometry(46, 24),
    new THREE.MeshBasicMaterial({ color: 0xfff8d8, transparent: true, opacity: 0.9, fog: false, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  sunHalo.position.set(150, 320, 100);
  sunHalo.lookAt(0, 0, 0);
  sky.add(sunHalo);
}

/* ---------- 赛道网格（路面 / 路肩 / 中线） ---------- */
(function buildRoad() {
  /* 5 列条带：路肩L | 路左l | 中m | 路右r | 路肩R，4 条 quad 带 index */
  const verts = [], uvs = [], idx = [];
  const N = SEG_SAMPLES;
  for (let i = 0; i <= N; i++) {
    const j = i % N;
    const pC = centerSamples[j], nC = normals[j];
    const cols = [-ROAD_W - 1.4, -ROAD_W, 0, ROAD_W, ROAD_W + 1.4];
    for (const off of cols) {
      const p = pC.clone().addScaledVector(nC, off);
      p.y = 0.02;
      verts.push(p.x, p.y, p.z);
    }
    const v = i / N;
    for (const u of [0, 0.086, 0.5, 0.914, 1]) uvs.push(u, v);
  }
  for (let i = 0; i < N; i++) {
    for (let c = 0; c < 4; c++) {
      const a = i * 5 + c, b = a + 1, d = a + 5, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const tex = makeRoadTexture();
  const mat = new THREE.MeshLambertMaterial({ map: tex });   // Lambert 才能接收阴影
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  mesh.receiveShadow = true;
  scene.add(mesh);

  /* 路肩草地渐变 */
  const gGeo = new THREE.CircleGeometry(420, 48);
  const gTex = makeGrassTexture();
  const grass = new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({ map: gTex }));
  grass.rotation.x = -Math.PI / 2;
  grass.position.y = -0.06;
  grass.receiveShadow = true;
  scene.add(grass);
})();

/* 程序化路面贴图：深灰沥青 + 红白路肩 + 黄色中线（双虚线） */
function makeRoadTexture() {
  const W = 256, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#3f4550';
  c.fillRect(0, 0, W, H);
  /* 沥青颗粒 */
  for (let i = 0; i < 900; i++) {
    c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.08)';
    c.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  /* 左右红白路肩 */
  const shW = 22;
  for (let y = 0; y < H; y += 32) {
    c.fillStyle = '#e04a4a'; c.fillRect(0, y, shW, 32); c.fillRect(W - shW, y, shW, 32);
    c.fillStyle = '#f2f2f2'; c.fillRect(0, y + 32, shW, 32); c.fillRect(W - shW, y + 32, shW, 32);
  }
  /* 黄色中线（实线）+ 左右车道白色虚线（增强道路感） */
  c.fillStyle = '#ffd35c';
  c.fillRect(W / 2 - 5, 0, 10, H);
  c.fillStyle = 'rgba(245,245,245,.92)';
  for (let y = 0; y < H; y += 64) {
    c.fillRect(W * 0.31 - 3, y, 6, 34);
    c.fillRect(W * 0.69 - 3, y, 6, 34);
  }
  /* 轮胎磨痕（中央两条暗带） */
  c.fillStyle = 'rgba(0,0,0,.16)';
  c.fillRect(W * 0.28, 0, 26, H);
  c.fillRect(W * 0.66, 0, 26, H);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.ClampToEdgeWrapping;

    if (offroad) {
      chip.style.borderColor = 'rgba(255, 90, 90, .9)';
      chip.style.background = 'rgba(120, 20, 20, .72)';
      n.style.color = '#ff9d9d';
      offroadTip.style.opacity = '1';
    } else if (offRatio > 0.78) {
      chip.style.borderColor = 'rgba(255, 200, 90, .8)';
      chip.style.background = 'rgba(120, 80, 10, .6)';
      n.style.color = '#ffd35c';
      offroadTip.style.opacity = '0';
    } else {
      chip.style.borderColor = '';
      chip.style.background = '';
      n.style.color = '';
      offroadTip.style.opacity = '0';
    }
  }

  PS.s += effSpeed * dt;
  PS.visualYaw = -PS.steer * 0.24;

  /* 圈数推进 */
  if (PS.s >= trackLen * PS.lap) {
    PS.lap++;
    if (PS.lap > LAPS_TOTAL) {
      PS.finished = true;
      PS.finishTime = raceTime;
      finishRace(true);
    } else {
      updateLapHUD();
      lapSfx();
    }
  }

  /* ---- AI ---- */
  for (const r of rivals) {
    if (r.finished) continue;
    /* 目标速度：基础 × 曲率因子 + 随机呼吸 */
    const curv = curvatureAt(r.s);
    const wob = 1 + Math.sin(t * 0.7 + r.wobbleT) * 0.04;
    let want = r.baseSpeed * (0.62 + curv * 0.38) * wob;
    /* 橡皮筋：落后玩家太多提速，领先太多略松 */
    const gap = progressOf(PS.s, PS.lap) - progressOf(r.s, r.lap);
    if (gap > 60) want *= 1.16;
    else if (gap < -60) want *= 0.88;
    r.speed += (want - r.speed) * Math.min(1, dt * 1.4);
    /* 走线：朝内线切弯 + 慢速摆动 */
    const cut = (1 - curv) * 4.2;
    r.targetO = Math.max(-ROAD_W + 1.4, Math.min(ROAD_W - 1.4, (Math.sin(aheadPhase(r, t)) * 1.1) + cut * sideOfCurve(r.s)));
    r.o += (r.targetO - r.o) * Math.min(1, dt * 1.1);
    /* 避让玩家与前车（简单横移） */
    for (const other of [PS, ...rivals]) {
      if (other === r || other.finished) continue;
      const da = ((other.s - r.s) % trackLen + trackLen) % trackLen;
      if (da < 7 && Math.abs(other.o - r.o) < 2.0) {
        r.targetO = Math.max(-ROAD_W + 1.4, Math.min(ROAD_W - 1.4, other.o + (other.o > r.o ? -2.6 : 2.6)));
      }
    }
    r.s += r.speed * dt;
    if (r.s >= trackLen * r.lap) {
      r.lap++;
      if (r.lap > LAPS_TOTAL) {
        r.finished = true;
        r.finishTime = raceTime;
        r.finishOrder = ++finishCount;
      }
    }
  }

  handleCollisions(dt);
  updateRank();

  /* ---- 相机追尾 ---- */
  const camTarget = trackPos(PS.s - 9.2, PS.o * 0.55, 5.8);
  const lookAt = trackPos(PS.s + 20, PS.o * 0.25, 1.2);
  camera.position.lerp(camTarget, Math.min(1, dt * 6));
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 1.6);
    camera.position.x += (Math.random() - 0.5) * shake * 0.7;
    camera.position.y += (Math.random() - 0.5) * shake * 0.4;
  }
  camera.lookAt(lookAt);
  /* 速度感：FOV 随速度平滑张开（64 直道巡航 → 73 极速冲刺）+ 过弯侧倾 */
  const wantFov = 64 + Math.min(1, effSpeed / 34) * 9;
  if (Math.abs(camera.fov - wantFov) > 0.05) {
    camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 3);
    camera.updateProjectionMatrix();
  }
  camera.rotation.z += PS.steer * 0.045;

  /* 玩家网格姿态 */
  const pp = trackPos(PS.s, PS.o, 0.02);
  player.position.copy(pp);
  const ahead = trackPos(PS.s + 3, PS.o, 0);
  player.lookAt(ahead);
  player.rotateY(PS.visualYaw);
  /* 车轮滚动 + 前轮随转向偏摆（打方向时前轮看得见角度） */
  const steerYaw = PS.steer * 0.42;
  player.userData.wheels.forEach((w, wi) => {
    w.rotation.x -= effSpeed * dt * 2.2;
    if (wi < 2) w.rotation.y = -steerYaw;
  });

  /* 太阳阴影相机跟随玩家（±90m frustum 始终罩住玩家附近，2048 贴图足够清晰） */
  sun.target.position.set(pp.x, 0, pp.z);
  sun.position.set(pp.x + SUN_OFF.x, SUN_OFF.y, pp.z + SUN_OFF.z);
  sun.target.updateMatrixWorld();

  /* AI 网格姿态 */
  for (const r of rivals) {
    const rp = trackPos(r.s, r.o, 0.02);
    r.mesh.position.copy(rp);
    const ra = trackPos(r.s + 3, r.o, 0);
    r.mesh.lookAt(ra);
    const lean = (r.targetO - r.o) * 0.06;
    r.mesh.rotateY(-lean);
    for (const w of r.mesh.userData.wheels) w.rotation.x -= r.speed * dt * 2.2;
  }

  /* HUD */
  $('speedNum').textContent = Math.round(effSpeed * 3.6);
  const m = Math.floor(raceTime / 60), sec = raceTime - m * 60;
  $('timeNum').textContent = m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}
let finishCount = 0;
function aheadPhase(r, t) { return t * 0.5 + r.wobbleT; }
function sideOfCurve(s) {
  /* 曲率符号：内侧法线方向判断 */
  const i = sToIdx(s);
  const n0 = normals[i];
  const n1 = normals[(i + 6) % SEG_SAMPLES];
  const dot = n0.dot(n1);
  return dot < 0.9995 ? (n1.x * n0.z - n1.z * n0.x) * 60 : 0;
}

/* ---------- 粒子（尘土 / 漂移烟）：单个 Points = 1 个 draw call ----------
 * 原实现 90 个 Mesh 共享 1 个材质、却按 mesh 设 opacity —— 全场尘土透明度
 * 一起跳。技能库 threejs-shaders：把寿命/尺寸放进 BufferAttribute，
 * 由顶点着色器逐粒子缩放、片元着色器逐粒子淡出。 */
const DUST_MAX = 160;
const dustPos = new Float32Array(DUST_MAX * 3);
const dustData = new Float32Array(DUST_MAX * 2);      // x: size, y: life(0..1)
const dustVel = [];                                   // 每粒子速度 {vx, vy, vz}
for (let i = 0; i < DUST_MAX; i++) dustVel.push({ vx: 0, vy: 0, vz: 0 });
let dustHead = 0;                                     // 环形写入游标
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('aDust', new THREE.BufferAttribute(dustData, 2));
const dustMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uColor: { value: new THREE.Color(0xc9b48a) } },
  vertexShader: `
    attribute vec2 aDust;          /* x: size, y: life */
    varying float vLife;
    void main() {
      vLife = aDust.y;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aDust.x * (140.0 / -mv.z);   /* 近大远小 */
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vLife;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;                     /* 圆形粒子 */
      float edge = smoothstep(0.5, 0.18, r);    /* 柔软边缘 */
      gl_FragColor = vec4(uColor, vLife * edge * 0.62);
    }
  `,
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
dustPoints.frustumCulled = false;
scene.add(dustPoints);

const _dv = new THREE.Vector3();
function dustBurst(target, opts) {
  const p = trackPos(target.s, target.o, 0.12);
  const i = dustHead;
  dustHead = (dustHead + 1) % DUST_MAX;
  dustPos[i * 3] = p.x; dustPos[i * 3 + 1] = p.y; dustPos[i * 3 + 2] = p.z;
  dustData[i * 2] = (opts && opts.size) || 10 + Math.random() * 10;
  dustData[i * 2 + 1] = 1;
  const spread = (opts && opts.spread) || 3;
  dustVel[i].vx = (Math.random() - .5) * spread;
  dustVel[i].vy = Math.random() * (opts && opts.up != null ? opts.up : 2.5);
  dustVel[i].vz = (Math.random() - .5) * spread;
}
function updateDust(dt) {
  let alive = 0;
  for (let i = 0; i < DUST_MAX; i++) {
    if (dustData[i * 2 + 1] <= 0) { dustPos[i * 3 + 1] = -50; continue; }   // 沉底隐藏
    dustData[i * 2 + 1] -= dt * 1.5;
    dustVel[i].vy -= 4 * dt;
    dustPos[i * 3] += dustVel[i].vx * dt;
    dustPos[i * 3 + 1] = Math.max(0.05, dustPos[i * 3 + 1] + dustVel[i].vy * dt);
    dustPos[i * 3 + 2] += dustVel[i].vz * dt;
    dustData[i * 2] += dt * 26;               /* 尺寸随时间膨胀（扬尘感） */
    alive++;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aDust.needsUpdate = true;
  return alive;
}

/* ---------- 圈数 HUD ---------- */
function updateLapHUD() {
  const el = $('lapNum');
  if (el) el.textContent = Math.min(PS.lap, LAPS_TOTAL);
}
function updateLapDots() {
  const box = $('lapDots');
  box.innerHTML = '';
  for (let i = 1; i <= LAPS_TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'lap-dot' + (i < PS.lap ? ' done' : i === PS.lap ? ' cur' : '');
    box.appendChild(d);
  }
}

/* ---------- 音效（Web Audio） ---------- */
let actx = null, engineOsc = null, engineGain = null, engineFilter = null, muted = false;
function initAudio() {
  if (actx) { actx.resume && actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  engineOsc = actx.createOscillator();
  engineFilter = actx.createBiquadFilter();
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 220;        // 砍掉锯齿波的高频毛刺，只留低沉轰鸣
  engineFilter.Q.value = 0.7;
  engineGain = actx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 70;
  engineGain.gain.value = 0.0;
  engineOsc.connect(engineFilter).connect(engineGain).connect(actx.destination);
  engineOsc.start();
}
function setEngine(speedRatio) {
  if (!engineOsc) return;
  /* 柔和版：音量约为原来的 1/3，频率范围收窄（60→105Hz），怠速极轻 */
  engineOsc.frequency.value = 60 + speedRatio * 45;
  engineGain.gain.value = muted ? 0 : (0.006 + speedRatio * 0.018);
}
function beep(freq, dur, type, vol, delay, sweepTo) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const bumpSfx = () => { beep(120, .18, 'square', .22); beep(80, .25, 'sawtooth', .16, .05); };
const lapSfx = () => { beep(660, .12, 'sine', .2); beep(880, .16, 'sine', .2, .12); };
const startBeeps = () => { beep(440, .2, 'sine', .22, 0); beep(440, .2, 'sine', .22, .8); beep(440, .2, 'sine', .22, 1.6); beep(880, .5, 'sine', .28, 2.4); };

/* ---------- 开始 / 结束 ---------- */
function startRace() {
  initAudio();
  $('start').style.display = 'none';
  resetRace();
  state = STATE.COUNTDOWN;
  countdown = 2.4;
  startBeeps();
  updateLapDots();
}
function resetRace() {
  raceTime = 0; shake = 0; bumpCooldown = 0; finishCount = 0;
  PS.s = 0; PS.o = 0; PS.speed = 0; PS.steer = 0; PS.lap = 1;
  PS.passed = 0; PS.finished = false;
  rivals.forEach(r => { scene.remove(r.mesh); });
  spawnRivals();
  lastPassCheck = new Set(rivals.map((r, i) => i)); // 起跑时 5 辆 AI 全在玩家前方
  $('passNum').textContent = '0';
  $('posNum').textContent = RIVALS_COUNT + 1;
  updateLapHUD();
  camera.position.copy(trackPos(-12, 0, 5));
}
function restart() {
  $('result').classList.remove('show');
  resetRace();
  state = STATE.COUNTDOWN;
  countdown = 2.4;
  startBeeps();
  updateLapDots();
}
let lastPassCheck = new Set();
function finishRace(byPlayer) {
  state = STATE.FINISH;
  setEngine(0);
  $('result').classList.add('show');
  const total = RIVALS_COUNT + 1;
  let title, desc;
  if (playerRank === 1) { title = '🏆 冠军！'; }
  else if (playerRank === 2) { title = '🥈 亚军！'; }
  else if (playerRank === 3) { title = '🥉 季军！'; }
  else { title = '🏁 完赛'; }
  const m = Math.floor(raceTime / 60), sec = raceTime - m * 60;
  desc = `总名次 <b>${playerRank}</b> / ${total}　完赛用时 <b>${m}:${(sec < 10 ? '0' : '') + sec.toFixed(1)}</b><br>` +
         `超越了 <b>${PS.passed}</b> 辆对手车，再跑一次刷新成绩！`;
  $('resultTitle').textContent = title;
  $('resultDesc').innerHTML = desc;
  beep(523, .2, 'sine', .2); beep(659, .2, 'sine', .2, .18); beep(784, .3, 'sine', .22, .36);
}

/* 途中超车计数：集合记录"仍跑在玩家前面"的对手 */
function trackPassing() {
  const pp = progressOf(PS.s, PS.lap);
  for (let i = 0; i < rivals.length; i++) {
    const r = rivals[i];
    const rivalAhead = progressOf(r.s, r.lap) > pp;
    const wasAhead = lastPassCheck.has(i);
    if (!rivalAhead && wasAhead) {          // 玩家超过它
      lastPassCheck.delete(i);
      PS.passed++;
      $('passNum').textContent = PS.passed;
    } else if (rivalAhead && !wasAhead) {   // 它反超回来
      lastPassCheck.add(i);
      PS.passed--;
      $('passNum').textContent = Math.max(0, PS.passed);
    }
  }
}

/* ---------- 主循环 ---------- */
let lastT = 0;
/* 展示镜头：菜单 / 结算时沿赛道低空巡航（比静止起跑门生动得多） */
let showCamS = 0;
function updateShowcaseCam(dt) {
  showCamS = (showCamS + dt * 14) % trackLen;              // 14 m/s 巡航
  const p = trackPos(showCamS, 7.5, 7);                   // 路边高处
  const look = trackPos(showCamS + 34, 0, 1.5);           // 望向前方赛道
  camera.position.lerp(p, Math.min(1, dt * 2.2));
  camera.lookAt(look);
  if (Math.abs(camera.fov - 64) > 0.05) {                 // 菜单里恢复正常 FOV
    camera.fov += (64 - camera.fov) * Math.min(1, dt * 3);
    camera.updateProjectionMatrix();
  }
  /* 展示镜头也让太阳跟随，避免阴影范围跑出 frustum */
  sun.target.position.set(look.x, 0, look.z);
  sun.position.set(look.x + SUN_OFF.x, SUN_OFF.y, look.z + SUN_OFF.z);
  sun.target.updateMatrixWorld();
}
function frame(nowMs) {
  const now = nowMs / 1000;
  const dt = Math.min(0.05, lastT === 0 ? 0.016 : now - lastT);
  lastT = now;
  if (state === STATE.RUNNING) {
    raceTime += dt;
    trackPassing();
  }
  if (state === STATE.START || state === STATE.FINISH) updateShowcaseCam(dt);
  update(dt, now);
  updateDust(dt);
  setEngine(state === STATE.RUNNING ? Math.min(1, PS.speed / 34) : 0.12);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 窗口自适应 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

$('btnStart').addEventListener('click', startRace);
$('btnRestart').addEventListener('click', restart);

/* ---------- 测试钩子（无头验证用） ---------- */
window.__race = {
  STATE, getState: () => state,
  get player() { return { s: PS.s, o: PS.o, speed: PS.speed, lap: PS.lap, finished: PS.finished, rank: playerRank }; },
  get rivals() { return rivals.map(r => ({ s: r.s, o: r.o, speed: r.speed, lap: r.lap, finished: r.finished })); },
  get countdown() { return countdown; },
  get drawCalls() { return renderer.info.render.calls; },
  start: startRace, tick: (ms) => { /* 手动泵帧（无 rAF 环境用） */
    let t = performance.now();
    const step = 16.7;
    for (let e = 0; e < ms; e += step) { frame(t + e); }
    lastT = 0;
  },
  steer: dir => { steerInput = dir; },
  fireKey: key => {
    window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
    window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
  },
  /* ---- 渲染诊断（CDP 用）：位置 + 屏幕投影 + 读回像素 ---- */
  playerPos: () => player.getWorldPosition(new THREE.Vector3()).toArray(),
  camPos: () => camera.position.toArray(),
  camDir: () => new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).toArray(),
  playerOnScreen: () => {
    const sp = player.getWorldPosition(new THREE.Vector3());
    const ndc = sp.project(camera);
    return { ndc: [ndc.x, ndc.y, ndc.z], on: Math.abs(ndc.x) < 1 && Math.abs(ndc.y) < 1 && ndc.z < 1 };
  },
  readCenter: () => {   // 读屏幕中心 60x60 区域平均色（追尾视角下车体应在画面中心）
    const gl = renderer.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const px = new Uint8Array(60 * 60 * 4);
    gl.readPixels(Math.floor(w / 2 - 30), Math.floor(h / 2 - 30), 60, 60, gl.RGBA, gl.UNSIGNED_BYTE, px);
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < px.length; i += 4) { r += px[i]; g += px[i + 1]; b += px[i + 2]; }
    const n = px.length / 4;
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  },
};
</script>

<script>
/* ---- 返回主页：确认弹窗 ---- */
(function () {
  var btn = document.getElementById('btnHome');
  var dlg = document.getElementById('homeConfirm');
  if (!btn || !dlg) return;
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    dlg.classList.add('show');
  });
  document.getElementById('hcOk').addEventListener('click', function () {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (err) {}
    window.location.replace('../index.html');
  });
  document.getElementById('hcCancel').addEventListener('click', function () {
    dlg.classList.remove('show');
  });
  dlg.addEventListener('pointerdown', function (e) {
    if (e.target === dlg) dlg.classList.remove('show');
  });
})();
</script>


<script>
/* ---- 禁用浏览器回退：按物理回退键只会弹确认弹窗 ---- */
(function () {
  var dlg = document.getElementById('homeConfirm');
  /* 无弹窗结构（理论上不会发生）时退化为静默推回 */
  function guardBack() {
    try { history.pushState({ g: 1 }, '', '#guard'); } catch (e) {}
    if (dlg) {
      dlg.classList.add('show');
      try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
    }
  }
  try {
    history.pushState({ g: 1 }, '', '#guard');
    window.addEventListener('popstate', guardBack);
    /* 页面显示状态变化（从 bfcache 恢复）时重新垫垫子 */
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { try { history.pushState({ g: 1 }, '', '#guard'); } catch (err) {} }
    });
  } catch (e) {}
})();
</script>
